<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 859" role="img" aria-labelledby="fig-r2-02-what-intubation-removes-screen-title" aria-describedby="fig-r2-02-what-intubation-removes-screen-desc"><title id="fig-r2-02-what-intubation-removes-screen-title">What intubation takes away and adds</title><desc id="fig-r2-02-what-intubation-removes-screen-desc">Conceptual, not a timeline. Intubation removes three things: spontaneous breathing, sympathetic tone, and negative intrathoracic pressure. It adds two: apnea and positive pressure. Spontaneous breathing is linked to Patients M and H; sympathetic tone to Patients P and R; negative intrathoracic pressure to Patient P; apnea to Patients H, M and R; positive pressure to Patients P and R. Patient H, pneumonia, has almost no oxygen store and needs her own breathing to refill it. Patient P, vomiting blood, needs sympathetic tone and negative pressure for venous return. Patient M, ketoacidosis, needs her very high ventilation, which is holding her pH up. Patient R, pulmonary embolus, needs low pulmonary vascular resistance and enough systemic pressure to perfuse his right ventricle.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-02-what-intubation-removes-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r2-02-what-intubation-removes-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r2-02-what-intubation-removes-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r2-02-what-intubation-removes-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r2-02-what-intubation-removes-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r2-02-what-intubation-removes-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r2-02-what-intubation-removes-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r2-02-what-intubation-removes-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r2-02-what-intubation-removes-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r2-02-what-intubation-removes-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r2-02-what-intubation-removes-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r2-02-what-intubation-removes-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r2-02-what-intubation-removes-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r2-02-what-intubation-removes-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r2-02-what-intubation-removes-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r2-02-what-intubation-removes-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r2-02-what-intubation-removes-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r2-02-what-intubation-removes-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r2-02-what-intubation-removes-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r2-02-what-intubation-removes-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r2-02-what-intubation-removes-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r2-02-what-intubation-removes-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-02-what-intubation-removes-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-02-what-intubation-removes-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-02-what-intubation-removes-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r2-02-what-intubation-removes-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-02-what-intubation-removes-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r2-02-what-intubation-removes-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r2-02-what-intubation-removes-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r2-02-what-intubation-removes-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-02-what-intubation-removes-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r2-02-what-intubation-removes-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r2-02-what-intubation-removes-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r2-02-what-intubation-removes-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-02-what-intubation-removes-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r2-02-what-intubation-removes-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-02-what-intubation-removes-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r2-02-what-intubation-removes-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r2-02-what-intubation-removes-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r2-02-what-intubation-removes-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-02-what-intubation-removes-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r2-02-what-intubation-removes-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r2-02-what-intubation-removes-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-02-what-intubation-removes-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-02-what-intubation-removes-screen-bg" width="360" height="859"/><text class="fig-r2-02-what-intubation-removes-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">What intubation takes</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="12.0" y="74.0" font-size="19" font-weight="600" text-anchor="start">away and adds</text><text class="fig-r2-02-what-intubation-removes-screen-t-muted" x="12.0" y="94.0" font-size="12.5" text-anchor="start">Conceptual, not a timeline.</text><text class="fig-r2-02-what-intubation-removes-screen-t-red" x="12.0" y="131.0" font-size="13" font-weight="600" text-anchor="start">REMOVED</text><rect class="fig-r2-02-what-intubation-removes-screen-pn" x="12.0" y="141.0" width="336.0" height="64.0" rx="6"/