ntubation-removes-screen-pn" x="12.0" y="633.0" width="336.0" height="66.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="655.0" font-size="14" font-weight="600" text-anchor="start">Patient P · vomiting blood</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="675.0" font-size="12.5" text-anchor="start">needs sympathetic tone and</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="691.0" font-size="12.5" text-anchor="start">negative pressure for venous return</text><rect class="fig-r2-02-what-intubation-removes-screen-pn" x="12.0" y="707.0" width="336.0" height="66.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="729.0" font-size="14" font-weight="600" text-anchor="start">Patient M · ketoacidosis</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="749.0" font-size="12.5" text-anchor="start">needs her very high ventilation;</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="765.0" font-size="12.5" text-anchor="start">it is holding her pH up</text><rect class="fig-r2-02-what-intubation-removes-screen-pn" x="12.0" y="781.0" width="336.0" height="66.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="803.0" font-size="14" font-weight="600" text-anchor="start">Patient R · pulmonary embolus</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="823.0" font-size="12.5" text-anchor="start">needs low pulmonary vascular resistance</text><text class="fig-r2-02-what-intubation-removes-screen-t-ink" x="24.0" y="839.0" font-size="12.5" text-anchor="start">and pressure to perfuse his RV</text></svg>