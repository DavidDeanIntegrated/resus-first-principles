<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1020" viewBox="0 0 1080 1020" role="img" aria-labelledby="title desc"><title id="title">Ending VF is not the same as restoring flow</title><desc id="desc">Electrical organization leads toward contraction and circulation, but neither transition is guaranteed. Incessant VF continues through the shock; recurrent VF terminates and later returns. CPR artifact may hide the interval. Immediate post-shock CPR supports circulation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526671"/></marker></defs>
<rect x="0" y="0" width="1080" height="1020" rx="0" fill="#F7F5EF"/>
<text x="44" y="43" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#087F82" font-weight="600" text-anchor="start">RESUS FIRST PRINCIPLES  /  FIGURE 02</text>
<text x="44" y="91" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#172D38" font-weight="600" text-anchor="start">Ending VF is not the same as restoring flow</text>
<text x="44" y="127" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#526671" font-weight="400" text-anchor="start">Sections 4.1–4.2 • Electrical activity, contraction, and perfusion</text>
<rect x="44" y="165" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="44" y="165" width="5" height="150" rx="2" fill="#087F82"/>
<text x="66" y="203" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Electrical organization</text>
<text x="66" y="240" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">ECG shows activation.</text>
<text x="66" y="270" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">It does not show output.</text>
<rect x="385" y="165" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="385" y="165" width="5" height="150" rx="2" fill="#087F82"/>
<text x="407" y="203" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Mechanical contraction</text>
<text x="407" y="240" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Myocardium must respond.</text>
<text x="407" y="270" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Ischemia can impair it.</text>
<rect x="726" y="165" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="726" y="165" width="5" height="150" rx="2" fill="#087F82"/>
<text x="748" y="203" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Effective circulation</text>
<text x="748" y="240" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Needs filling and ejection,</text>
<text x="748" y="270" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">with an open flow path.</text>
<path d="M356 240 L381 240" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M697 240 L722 240" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="44" y="345" width="992" height="76" rx="12" fill="#172D38"/>
<text x="69" y="378" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#FFFFFF" font-weight="600" text-anchor="start">A shock can terminate VF without producing a pulse.</text>
<text x="69" y="405" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#DAE8E6" font-weight="400" text-anchor="start">After a shock, resume CPR immediately in the standard adult arrest sequence.</text>
<text x="44" y="473" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#087F82" font-weight="600" text-anchor="start">WHY VF AT THE NEXT CHECK DOES NOT PROVE THE SHOCK FAILED</text>
<text x="44" y="528" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#172D38" font-weight="600" text-anchor="start">Incessant VF</text>
<text x="44" y="562" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526671" font-weight="400" text-anchor="start">VF never terminates</text>
<text x="44" y="640" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#172D38" font-weight="600" text-anchor="start">Recurrent VF</text>
<text x="44" y="674" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526671" font-weight="400" text-anchor="start">VF ends, then returns</text>
<rect x="310" y="504" width="180" height="66" rx="12" fill="#F5E4DF"/>
<text x="400" y="545" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#B84A3C" font-weight="600" text-anchor="middle">VF</text>
<path d="M494 540 L552 540" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="522" y="493" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526671" font-weight="400" text-anchor="middle">shock</text>
<rect x="310" y="616" width="180" height="66" rx="12" fill="#F5E4DF"/>
<text x="400" y="657" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#B84A3C" font-weight="600" text-anchor="middle">VF</text>
<path d="M494 652 L552 652" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="522" y="605" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#526671" font-weight="400" text-anchor="middle">shock</text>
<rect x="562" y="504" width="474" height="66" rx="12" fill="#F5E4DF"/>
<text x="799" y="545" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#B84A3C" font-weight="600" text-anchor="middle">VF continues</text>
<rect x="562" y="616" width="230" height="66" rx="12" fill="#E1EFEB"/>
<text x="677" y="656" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="middle">VF terminated</text>
<path d="M799 652 L837 652" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="847" y="616" width="189" height="66" rx="12" fill="#F5E4DF"/>
<text x="941" y="656" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#B84A3C" font-weight="600" text-anchor="middle">VF returns</text>
<rect x="44" y="725" width="992" height="175" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<text x="68" y="766" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#172D38" font-weight="600" text-anchor="start">The bedside limitation</text>
<text x="68" y="805" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#526671" font-weight="400" text-anchor="start">CPR artifact can hide the intervening rhythm. These are mechanisms,</text>
<text x="68" y="837" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#526671" font-weight="400" text-anchor="start">not a reason to pause compressions and watch the monitor.</text>
<text x="68" y="869" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#526671" font-weight="400" text-anchor="start">Organized rhythm or visible cardiac motion alone does not establish ROSC.</text>
<path d="M44 955 H1036" stroke="#D5DEDC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="988" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#526671" font-weight="400" text-anchor="start">Conceptual timelines, not durations • VF = ventricular fibrillation; ROSC = return of spontaneous circulation.</text>
</svg>