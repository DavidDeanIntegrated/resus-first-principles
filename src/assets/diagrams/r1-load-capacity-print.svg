<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" role="img" aria-labelledby="rf3p-title rf3p-desc"><title id="rf3p-title">The respiratory pump: load against capacity</title><desc id="rf3p-desc">One causal loop, read clockwise, under the statement that the pump fails when load persistently exceeds its capacity to meet that load. Load rises, so effort increases; sustained high effort fatigues the muscles; capacity falls; PaCO2 rises; and an arrow labeled acidosis raises ventilatory demand returns to rising load. Load and effort are drawn as solid red boxes, fatigue and falling capacity as dashed teal boxes, and rising PaCO2 as a gold box. Notes accompanying the loop: load rises with stiffer lungs, narrower airways, intrinsic PEEP, ventilatory demand from fever, acidosis or sepsis, and dead space forcing more ventilation. Rapid shallow breathing reduces the work of each breath but raises the dead-space fraction. A rising PaCO2 often comes late; waiting for it can mean waiting too long. Conceptual loop; no scale.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf3p-t-ink{fill:#172d38}.rf3p-t-muted{fill:#526671}.rf3p-t-teal{fill:#077578}.rf3p-t-red{fill:#af4639}.rf3p-t-gold{fill:#996613}.rf3p-bg{fill:#ffffff}.rf3p-pn{fill:#ffffff;stroke:#d5dedc}.rf3p-s-teal{stroke:#077578;fill:none}.rf3p-f-teal{fill:#077578}.rf3p-s-red{stroke:#af4639;fill:none}.rf3p-f-red{fill:#af4639}.rf3p-s-gold{stroke:#996613;fill:none}.rf3p-f-gold{fill:#996613}.rf3p-s-muted{stroke:#526671;fill:none}.rf3p-f-muted{fill:#526671}.rf3p-s-rule{stroke:#d5dedc;fill:none}.rf3p-f-rule{fill:#d5dedc}.rf3p-f-tt{fill:#ddedea}.rf3p-f-rt{fill:#f5e4df}</style><defs><marker id="rf3p-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf3p-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf3p-bg" width="700" height="400"/><text class="rf3p-t-teal" x="16" y="24" font-size="13" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf3p-t-ink" x="16" y="52" font-size="20" font-weight="600" text-anchor="start">The respiratory pump: load against capacity</text><text class="rf3p-t-muted" x="16" y="76" font-size="13" text-anchor="start">The pump fails when load persistently exceeds its capacity to meet that load.</text><path class="rf3p-s-muted" d="M224.1,146.0 Q262.6,159.4 283.8,194.8" stroke-width="2.5" marker-end="url(#rf3p-ah)"/><path class="rf3p-s-muted" d="M312.1,243.8 Q319.9,283.9 301.2,315.5" stroke-width="2.5" marker-end="url(#rf3p-ah)"/><path class="rf3p-s-muted" d="M234.2,341.5 Q197.7,355.5 160.8,341.5" stroke-width="2.5" marker-end="url(#rf3p-ah)"/><path class="rf3p-s-muted" d="M91.3,318.5 Q72.6,287.3 80.4,246.8" stroke-width="2.5" marker-end="url(#rf3p-ah)"/><path class="rf3p-s-muted" d="M104.5,197.8 Q125.1,162.8 164.2,149.0" stroke-width="2.5" marker-end="url(#rf3p-ah)"/><rect class="rf3p-f-rt" x="136.0" y="103.0" width="120" height="40" rx="8"/><rect class="rf3p-s-red" x="136.0" y="103.0" width="120" height="40" rx="8" stroke-width="2"/><text class="rf3p-t-red" x="196.0" y="128.0" font-size="14" font-weight="600" text-anchor="middle">Load rises</text><rect class="rf3p-f-rt" x="255.60000000000002" y="200.75" width="120" height="40" rx="8"/><rect class="rf3p-s-red" x="255.60000000000002" y="200.75" width="120" height="40" rx="8" stroke-width="2"/><text class="rf3p-t-red" x="315.6" y="225.75" font-size="14" font-weight="600" text-anchor="middle">More effort</text><rect class="rf3p-f-tt" x="237.2" y="321.5" width="120" height="40" rx="8"/><rect class="rf3p-s-teal" x="237.2" y="321.5" width="120" height="40" rx="8" stroke-width="2" stroke-dasharray="5 3"/><text class="rf3p-t-teal" x="297.2" y="346.5" font-size="14" font-weight="600" text-anchor="middle">Fatigue</text><rect class="rf3p-f-tt" x="34.80000000000001" y="321.5" width="120" height="40" rx="8"/><rect class="rf3p-s-teal" x="34.80000000000001" y="321.5" width="120" height="40" rx="8" stroke-width="2" stroke-dasharray="5 3"/><text class="rf3p-t-teal" x="94.80000000000001" y="346.5" font-size="14" font-weight="600" text-anchor="middle">Capacity falls</text><rect class="rf3p-pn" x="16.400000000000006" y="200.75" width="120" height="40" rx="8"/><rect class="rf3p-s-gold" x="16.400000000000006" y="200.75" width="120" height="40" rx="8" stroke-width="2"/><text class="rf3p-t-gold" x="76.4" y="225.75" font-size="14" font-weight="600" text-anchor="middle">PaCO2 rises</text><text class="rf3p-t-muted" x="196" y="265.75" font-size="13" text-anchor="middle">read</text><text class="rf3p-t-muted" x="196" y="281.75" font-size="13" text-anchor="middle">clockwise</text><text class="rf3p-t-gold" x="141.95" y="180.5" font-size="13" text-anchor="start">acidosis raises</text><text class="rf3p-t-gold" x="141.95" y="196.5" font-size="13" text-anchor="start">ventilatory</text><text class="rf3p-t-gold" x="141.95" y="212.5" font-size="13" text-anchor="start">demand</text><rect class="rf3p-f-tt" x="400" y="110" width="284" height="92" rx="6"/><text class="rf3p-t-ink" x="412" y="131" font-size="13.5" text-anchor="start">Load rises with stiffer lungs, narrower</text><text class="rf3p-t-ink" x="412" y="150" font-size="13.5" text-anchor="start">airways, intrinsic PEEP, ventilatory</text><text class="rf3p-t-ink" x="412" y="169" font-size="13.5" text-anchor="start">demand (fever, acidosis, sepsis), and</text><text class="rf3p-t-ink" x="412" y="188" font-size="13.5" text-anchor="start">dead space forcing more ventilation.</text><rect class="rf3p-f-tt" x="400" y="212" width="284" height="73" rx="6"/><text class="rf3p-t-ink" x="412" y="233" font-size="13.5" text-anchor="start">Rapid shallow breathing reduces the</text><text class="rf3p-t-ink" x="412" y="252" font-size="13.5" text-anchor="start">work of each breath but raises the</text><text class="rf3p-t-ink" x="412" y="271" font-size="13.5" text-anchor="start">dead-space fraction.</text><rect class="rf3p-f-tt" x="400" y="295" width="284" height="73" rx="6"/><text class="rf3p-t-ink" x="412" y="316" font-size="13.5" text-anchor="start">A rising PaCO2 often comes late;</text><text class="rf3p-t-ink" x="412" y="335" font-size="13.5" text-anchor="start">waiting for it can mean waiting too</text><text class="rf3p-t-ink" x="412" y="354" font-size="13.5" text-anchor="start">long.</text><text class="rf3p-t-muted" x="16" y="388" font-size="13" text-anchor="start">Conceptual loop; no scale. From Part IV.</text></svg>