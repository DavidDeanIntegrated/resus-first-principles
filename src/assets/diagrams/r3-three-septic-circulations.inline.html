<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 853" role="img" aria-labelledby="fig-r3-01-three-septic-circulations-screen-title" aria-describedby="fig-r3-01-three-septic-circulations-screen-desc"><title id="fig-r3-01-three-septic-circulations-screen-title">Three septic circulations, each a snapshot at one moment</title><desc id="fig-r3-01-three-septic-circulations-screen-desc">Three simple circuit diagrams, each with a heart, arterioles, capillaries and veins, and each a snapshot at one moment. Patient V, pneumonia: a large heart output with wide arterioles. Given values: MAP 53, cardiac output 7.5 liters per minute. Calculated values: SVR about 500, stroke volume 64 mL. Low vascular tone; cardiac output high at current filling. Patient L, urinary source: fluid leaving the capillaries into the surrounding tissue. Given value: MAP 66 on a vasopressor. Edema. Fluid has left the vessels. Patient C, biliary sepsis: a small heart output with narrowed arterioles. Given values: MAP 64, cardiac output 3.2 liters per minute. Calculated values: SVR about 1250, stroke volume 26 mL. High vascular tone; cardiac output low at current filling. In each circuit the arteriolar width is inferred, drawn schematically, not observed. A note reads shock index 1.44 for V and 1.42 for C: almost the same index, opposite circulations. A key reads: given, MAP, CVP and cardiac output, as stated; calculated, SVR and stroke volume, from them; inferred, arteriolar width. Illustrative teaching numbers.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r3-01-three-septic-circulations-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r3-01-three-septic-circulations-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r3-01-three-septic-circulations-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r3-01-three-septic-circulations-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r3-01-three-septic-circulations-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r3-
