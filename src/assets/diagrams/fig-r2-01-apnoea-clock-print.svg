<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 756" role="img" aria-labelledby="fig-r2-01-apnoea-clock-print-title" aria-describedby="fig-r2-01-apnoea-clock-print-desc"><title id="fig-r2-01-apnoea-clock-print-title">The apnea clock</title><desc id="fig-r2-01-apnoea-clock-print-desc">Schematic graph of lung oxygen store in liters against time from the start of apnea in minutes. Simple depletion estimates: store divided by consumption of 250 milliliters per minute. A healthy adult after preoxygenation starts at about 2.2 liters, a depletion estimate of about 8.7 minutes. The same adult on room air starts at about 0.35 liters, an estimate of about 1.4 minutes. Patient H&#x27;s store is about 1.2 liters even if her ventilated alveoli reached an oxygen fraction of 0.8, and her consumption is likely higher, so her dashed line starts lower and falls faster; no estimate or time is given for her. A shaded band at the start marks that she begins at a saturation of 88 percent, already at the shoulder of the dissociation curve, so saturation can fall steeply almost as soon as apnea starts. Depletion estimates, not upper limits and not times to a saturation of 90 percent. Saturation falls before the store is empty. Illustrative; about 80 kg; sea level; no ventilation or oxygen inflow during apnea.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-01-apnoea-clock-print-t-ink{fill:#172d38}.fig-r2-01-apnoea-clock-print-t-muted{fill:#526671}.fig-r2-01-apnoea-clock-print-t-teal{fill:#077578}.fig-r2-01-apnoea-clock-print-t-red{fill:#af4639}.fig-r2-01-apnoea-clock-print-t-gold{fill:#996613}.fig-r2-01-apnoea-clock-print-bg{fill:#ffffff}.fig-r2-01-apnoea-clock-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r2-01-apnoea-clock-print-s-teal{stroke:#077578;fill:none}.fig-r2-01-apnoea-clock-print-f-teal{fill:#077578}.fig-r2-01-apnoea-clock-print-s-red{stroke:#af4639;fill:none}.fig-r2-01-apnoea-clock-print-f-red{fill:#af4639}.fig-r2-01-apnoea-clock-print-s-gold{stroke:#996613;fill:none}.fig-r2-01-apnoea-clock-print-f-gold{fill:#996613}.fig-r2-01-apnoea-clock-print-s-muted{stroke:#526671;fill:none}.fig-r2-01-apnoea-clock-print-f-muted{fill:#526671}.fig-r2-01-apnoea-clock-print-s-rule{stroke:#d5dedc;fill:none}.fig-r2-01-apnoea-clock-print-f-rule{fill:#d5dedc}.fig-r2-01-apnoea-clock-print-s-ink{stroke:#172d38;fill:none}.fig-r2-01-apnoea-clock-print-f-ink{fill:#172d38}.fig-r2-01-apnoea-clock-print-f-tt{fill:#ddedea}.fig-r2-01-apnoea-clock-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r2-01-apnoea-clock-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-01-apnoea-clock-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-01-apnoea-clock-print-bg" width="700" height="756"/><text class="fig-r2-01-apnoea-clock-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-01-apnoea-clock-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">The apnea clock</text><text class="fig-r2-01-apnoea-clock-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Lung oxygen store against time. Simple depletion estimates: store divided by consumption</text><text class="fig-r2-01-apnoea-clock-print-t-muted" x="16.0" y="87.0" font-size="13.5" text-anchor="start">(250 mL/min).</text><path class="fig-r2-01-apnoea-clock-print-s-muted" d="M80,124 V430 H676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r2-01-apnoea-clock-print-t-muted" x="74.0" y="434.0" font-size="13.5" text-anchor="end">0</text><text class="fig-r2-01-apnoea-clock-print-t-muted" x="80.0" y="450.0" font-size="13.5" text-anchor="middle">0</text><text class="fig-r2-01-apnoea-clock-print-t-muted" x="676.0" y="468.0" font-size="13.5" text-anchor="end">Time from start of apnea (min) →</text><text class="fig-r2-01-apnoea-clock-print-t-muted" font-size="13.5" transform="translate(46,280.0) rotate(-90)" text-anchor="middle">Lung oxygen store (L)</text><rect class="fig-r2-01-apnoea-clock-print-f-rt" x="80" y="280.0" width="65.6" height="150.0"/><path class="fig-r2-01-apnoea-clock-print-s-teal" d="M80,166.0 L598.5,430" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-01-apnoea-clock-print-s-gold" d="M80,388.0 L163.4,430" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-01-apnoea-clock-print-s-red" d="M80,286.0 L235.0,364.0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><circle class="fig-r2-01-apnoea-clock-print-f-teal" cx="598.5" cy="430" r="4"/><circle class="fig-r2-01-apnoea-clock-print-f-gold" cx="163.4" cy="430" r="4"/><text class="fig-r2-01-apnoea-clock-print-t-teal" x="676.0" y="450.0" font-size="13.5" font-weight="600" text-anchor="end">estimate about 8.7 minutes</text><text class="fig-r2-01-apnoea-clock-print-t-gold" x="167.4" y="450.0" font-size="13.5" font-weight="600" text-anchor="start">about 1.4</text><text class="fig-r2-01-apnoea-clock-print-t-teal" x="88.0" y="158.0" font-size="13.5" font-weight="600" text-anchor="start">Preoxygenated adult: about 2.2 L</text><path class="fig-r2-01-apnoea-clock-print-s-gold" d="M20,482.1 H50" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r2-01-apnoea-clock-print-t-gold" x="60.0" y="486.1" font-size="13.5" text-anchor="start">Room air: about 0.35 L,</text><text class="fig-r2-01-apnoea-clock-print-t-gold" x="60.0" y="503.7" font-size="13.5" text-anchor="start">estimate about 1.4 minutes</text><path class="fig-r2-01-apnoea-clock-print-s-red" d="M20,533.3 H50" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r2-01-apnoea-clock-print-t-red" x="60.0" y="537.3" font-size="13.5" text-anchor="start">Patient H: about 1.2 L even at 0.8 oxygen fraction;</text><text class="fig-r2-01-apnoea-clock-print-t-red" x="60.0" y="554.9" font-size="13.5" text-anchor="start">consumption likely higher; no estimate given</text><rect class="fig-r2-01-apnoea-clock-print-pn" x="16.0" y="584.4" width="668.0" height="76.7" rx="6"/><rect class="fig-r2-01-apnoea-clock-print-f-red" x="16.0" y="584.4" width="5" height="76.7" rx="2"/><text class="fig-r2-01-apnoea-clock-print-t-ink" x="32.0" y="604.4" font-size="13.5" text-anchor="start">Shaded: Patient H starts at 88 percent, already at the shoulder of the curve; saturation can fall</text><text class="fig-r2-01-apnoea-clock-print-t-ink" x="32.0" y="622.6" font-size="13.5" text-anchor="start">steeply almost as soon as apnea starts. No time is given: it depends on her shunt fraction,</text><text class="fig-r2-01-apnoea-clock-print-t-ink" x="32.0" y="640.9" font-size="13.5" text-anchor="start">consumption and hemoglobin.</text><rect class="fig-r2-01-apnoea-clock-print-f-tt" x="16.0" y="671.1" width="668.0" height="72.7" rx="6"/><text class="fig-r2-01-apnoea-clock-print-t-ink" x="28.0" y="691.1" font-size="13.5" text-anchor="start">Depletion estimates, not upper limits and not times to a saturation of 90 percent. Saturation</text><text class="fig-r2-01-apnoea-clock-print-t-ink" x="28.0" y="709.3" font-size="13.5" text-anchor="start">falls before the store is empty. Illustrative; about 80 kg; sea level; no ventilation or oxygen</text><text class="fig-r2-01-apnoea-clock-print-t-ink" x="28.0" y="727.5" font-size="13.5" text-anchor="start">inflow during apnea.</text></svg>