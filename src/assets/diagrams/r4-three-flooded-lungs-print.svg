<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 755" role="img" aria-labelledby="fig-r4-01-three-flooded-lungs-print-title" aria-describedby="fig-r4-01-three-flooded-lungs-print-desc"><title id="fig-r4-01-three-flooded-lungs-print-title">Same lungs, three circulations, and the ground between them</title><desc id="fig-r4-01-three-flooded-lungs-print-desc">Three overlapping circles, each drawn with a different outline style. The middle circle is labeled redistribution, Patient S, with MAP 150, weight change 0 kg and shock index 0.58, and the words sudden onset, high pressure, no recent weight gain. The left circle, labeled accumulation, Patient F, shows MAP 96 and weight change plus 6 kg, and overlaps the middle circle in a region labeled excess water plus a pressure surge. The right circle, labeled pump failure, Patient K, shows MAP 68, shock index 1.37 and lactate 5.0, and overlaps the middle circle in a region labeled flooded lungs and high afterload, with low forward flow. The left and right circles do not touch. Below the circles, a line says which problem dominates now is a bedside judgment, not a number, and a note says no recent weight gain does not prove normal body water, and a quick response to nitrates or CPAP does not prove redistribution alone. A tag says B-lines are a pattern consistent with increased density of the lung interstitium, from fluid or from thickening, and do not measure left atrial pressure or identify the cause. A footer says all three lungs hold fluid and the image cannot tell them apart.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-01-three-flooded-lungs-print-t-ink{fill:#172d38}.fig-r4-01-three-flooded-lungs-print-t-muted{fill:#526671}.fig-r4-01-three-flooded-lungs-print-t-teal{fill:#077578}.fig-r4-01-three-flooded-lungs-print-t-red{fill:#af4639}.fig-r4-01-three-flooded-lungs-print-t-gold{fill:#996613}.fig-r4-01-three-flooded-lungs-print-bg{fill:#ffffff}.fig-r4-01-three-flooded-lungs-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-01-three-flooded-lungs-print-s-teal{stroke:#077578;fill:none}.fig-r4-01-three-flooded-lungs-print-f-teal{fill:#077578}.fig-r4-01-three-flooded-lungs-print-s-red{stroke:#af4639;fill:none}.fig-r4-01-three-flooded-lungs-print-f-red{fill:#af4639}.fig-r4-01-three-flooded-lungs-print-s-gold{stroke:#996613;fill:none}.fig-r4-01-three-flooded-lungs-print-f-gold{fill:#996613}.fig-r4-01-three-flooded-lungs-print-s-muted{stroke:#526671;fill:none}.fig-r4-01-three-flooded-lungs-print-f-muted{fill:#526671}.fig-r4-01-three-flooded-lungs-print-s-rule{stroke:#d5dedc;fill:none}.fig-r4-01-three-flooded-lungs-print-f-rule{fill:#d5dedc}.fig-r4-01-three-flooded-lungs-print-s-ink{stroke:#172d38;fill:none}.fig-r4-01-three-flooded-lungs-print-f-ink{fill:#172d38}.fig-r4-01-three-flooded-lungs-print-f-tt{fill:#ddedea}.fig-r4-01-three-flooded-lungs-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r4-01-three-flooded-lungs-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-01-three-flooded-lungs-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-01-three-flooded-lungs-print-bg" width="700" height="755"/><text class="fig-r4-01-three-flooded-lungs-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">Same lungs, three circulations,</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="16.0" y="74.0" font-size="20" font-weight="600" text-anchor="start">and the ground between them</text><text class="fig-r4-01-three-flooded-lungs-print-t-muted" x="16.0" y="94.0" font-size="13.5" text-anchor="start">Illustrative teaching numbers.</text><circle class="fig-r4-01-three-flooded-lungs-print-f-tt" cx="119" cy="218" r="95" opacity="0.35"/><circle class="fig-r4-01-three-flooded-lungs-print-s-ink" cx="119" cy="218" r="95" stroke-width="2.5" stroke-dasharray="8 6"/><circle class="fig-r4-01-three-flooded-lungs-print-f-tt" cx="119" cy="383" r="95" opacity="0.35"/><circle class="fig-r4-01-three-flooded-lungs-print-s-ink" cx="119" cy="383" r="95" stroke-width="3"/><circle class="fig-r4-01-three-flooded-lungs-print-f-tt" cx="119" cy="548" r="95" opacity="0.35"/><circle class="fig-r4-01-three-flooded-lungs-print-s-ink" cx="119" cy="548" r="95" stroke-width="3" stroke-dasharray="2 5"/><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="186.0" font-size="13.5" font-weight="600" text-anchor="middle">Accumulation (F)</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="202.3" font-size="13" text-anchor="middle">MAP 96</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="218.5" font-size="13" text-anchor="middle">Weight change +6 kg</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="336.5" font-size="13.5" font-weight="600" text-anchor="middle">Redistribution (S)</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="352.8" font-size="13" text-anchor="middle">MAP 150</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="369.0" font-size="13" text-anchor="middle">Weight change 0 kg</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="385.3" font-size="13" text-anchor="middle">Shock index 0.58</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="401.5" font-size="13" text-anchor="middle">sudden onset, high</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="417.8" font-size="13" text-anchor="middle">pressure, no recent</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="434.0" font-size="13" text-anchor="middle">weight gain</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="543.9" font-size="13.5" font-weight="600" text-anchor="middle">Pump failure (K)</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="560.1" font-size="13" text-anchor="middle">MAP 68</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="576.4" font-size="13" text-anchor="middle">Shock index 1.37</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="119.0" y="592.6" font-size="13" text-anchor="middle">Lactate 5.0</text><path class="fig-r4-01-three-flooded-lungs-print-s-ink" d="M149,300.5 H228" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle class="fig-r4-01-three-flooded-lungs-print-f-ink" cx="149" cy="300.5" r="3"/><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="232.0" y="305.1" font-size="13" font-weight="600" text-anchor="start">Excess water plus a pressure surge</text><path class="fig-r4-01-three-flooded-lungs-print-s-ink" d="M149,465.5 H228" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle class="fig-r4-01-three-flooded-lungs-print-f-ink" cx="149" cy="465.5" r="3"/><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="232.0" y="470.1" font-size="13" font-weight="600" text-anchor="start">Flooded lungs and high afterload, with low forward flow</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="16.0" y="665.0" font-size="13" font-weight="600" text-anchor="start">Which problem dominates now is a bedside judgment, not a number.</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="16.0" y="687.9" font-size="13" text-anchor="start">No recent weight gain does not prove normal body water; a quick response to nitrates</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="16.0" y="704.8" font-size="13" text-anchor="start">or CPAP does not prove redistribution alone.</text><rect class="fig-r4-01-three-flooded-lungs-print-f-tt" x="232.0" y="518.0" width="452.0" height="83.6" rx="6"/><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="242.0" y="539.7" font-size="13" text-anchor="start">B-lines: a pattern consistent with increased density of</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="242.0" y="556.6" font-size="13" text-anchor="start">the lung interstitium, from fluid or from thickening.</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="242.0" y="573.5" font-size="13" text-anchor="start">They do not measure left atrial pressure or identify</text><text class="fig-r4-01-three-flooded-lungs-print-t-ink" x="242.0" y="590.4" font-size="13" text-anchor="start">the cause.</text><text class="fig-r4-01-three-flooded-lungs-print-t-muted" x="16.0" y="731.7" font-size="13" text-anchor="start">All three lungs hold fluid; the image cannot tell them apart.</text></svg>