<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 448" role="img" aria-labelledby="fig-r4-01-three-flooded-lungs-print-title" aria-describedby="fig-r4-01-three-flooded-lungs-print-desc"><title id="fig-r4-01-three-flooded-lungs-print-title">Same lungs, three circulations</title><desc id="fig-r4-01-three-flooded-lungs-print-desc">Three simple circuit diagrams, each with lungs, a heart and the body; all three lungs are shaded to show fluid. Patient S, sudden onset: narrowed arteries; MAP 150, weight change 0 kg, shock index 0.58; high pressure with no water gained. Patient F, ten days off his diuretic: swollen legs; MAP 96, weight change plus 6 kg; water gained over days. Patient K, after a myocardial infarction: a small heart output and low forward flow; MAP 68, shock index 1.37, lactate 5.0 mmol/L; the pump is failing. A note reads: all three lungs hold fluid; pressure, water and flow differ, and the image cannot tell them apart. Illustrative teaching numbers; schematic circuits.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-01-three-flooded-lungs-print-t-ink{fill:#172d38}.fig-r4-01-three-flooded-lungs-print-t-muted{fill:#526671}.fig-r4-01-three-flooded-lungs-print-t-teal{fill:#077578}.fig-r4-01-three-flooded-lungs-print-t-red{fill:#af4639}.fig-r4-01-three-flooded-lungs-print-t-gold{fill:#996613}.fig-r4-01-three-flooded-lungs-print-bg{fill:#ffffff}.fig-r4-01-three-flooded-lungs-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-01-three-flooded-lungs-print-s-teal{stroke:#077578;fill:none}.fig-r4-01-three-flooded-lungs-print-f-teal{fill:#077578}.fig-r4-01-three-flooded-lungs-print-s-red{stroke:#af4639;fill:none}.fig-r4-01-three-flooded-lungs-print-f-red{fill:#af4639}.fig-r4-01-three-flooded-lungs-print-s-gold{stroke:#996613;fill:none}.fig-r4-01-three-flooded-lungs-print-f-gold{fill:#996613}.fig-r4-01-three-flooded-lungs-print-s-muted{stroke:#526671;fill:none}.fig-r4-01-three-flooded-lungs-print-f-muted{fill:#526671}.fi