<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 766" role="img" aria-labelledby="fig-r4-02a-pressure-chain-print-title" aria-describedby="fig-r4-02a-pressure-chain-print-desc"><title id="fig-r4-02a-pressure-chain-print-title">A rise in filling pressure is transmitted back from the left ventricle to the lung capillaries</title><desc id="fig-r4-02a-pressure-chain-print-desc">A schematic chain of boxes from the left ventricle to the lung capillaries, with no values. A dashed line labeled pressure runs from the left ventricle toward the capillaries, and a separate thin solid line labeled blood flow runs the other way. Left ventricle: LVEDP, the pressure at the end of filling; a filling pressure is not a filling volume. A strip says mean left atrial pressure and LVEDP track reasonably closely with a normal valve, an organized atrial rhythm and a normally compliant atrium, and separate with a narrowed or substantially leaking mitral valve, a stiff or enlarged atrium, lost atrial rhythm, and the point in the cardiac cycle when the pressure is read. Left atrium: left atrial pressure changes through the cardiac cycle; a dashed marker says the wedge pressure estimates left atrial pressure under the right conditions, is not a direct measure of capillary pressure and is not interchangeable with LVEDP. Pulmonary veins: pressure just upstream of the atrium. Lung capillaries: pressure between pulmonary arterial and venous pressure, higher than left atrial pressure. An arrow says filtration rises with capillary pressure and leads to the interstitium, where lymph flow rises to match filtration, up to a limit. When filtration exceeds lymph capacity, fluid collects in three numbered stages: around the bronchovascular bundles, in the alveolar walls, and in the alveoli. A dotted box says the alveolar epithelium transports salt, water follows, and the lymphatics and the circulation remove it. A key says the wedge pressure estimates left atrial pressure, lung ultrasound and imaging see interstitial fluid, and neither measures capillary pressure directly.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-02a-pressure-chain-print-t-ink{fill:#172d38}.fig-r4-02a-pressure-chain-print-t-muted{fill:#526671}.fig-r4-02a-pressure-chain-print-t-teal{fill:#077578}.fig-r4-02a-pressure-chain-print-t-red{fill:#af4639}.fig-r4-02a-pressure-chain-print-t-gold{fill:#996613}.fig-r4-02a-pressure-chain-print-bg{fill:#ffffff}.fig-r4-02a-pressure-chain-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-02a-pressure-chain-print-s-teal{stroke:#077578;fill:none}.fig-r4-02a-pressure-chain-print-f-teal{fill:#077578}.fig-r4-02a-pressure-chain-print-s-red{stroke:#af4639;fill:none}.fig-r4-02a-pressure-chain-print-f-red{fill:#af4639}.fig-r4-02a-pressure-chain-print-s-gold{stroke:#996613;fill:none}.fig-r4-02a-pressure-chain-print-f-gold{fill:#996613}.fig-r4-02a-pressure-chain-print-s-muted{stroke:#526671;fill:none}.fig-r4-02a-pressure-chain-print-f-muted{fill:#526671}.fig-r4-02a-pressure-chain-print-s-rule{stroke:#d5dedc;fill:none}.fig-r4-02a-pressure-chain-print-f-rule{fill:#d5dedc}.fig-r4-02a-pressure-chain-print-s-ink{stroke:#172d38;fill:none}.fig-r4-02a-pressure-chain-print-f-ink{fill:#172d38}.fig-r4-02a-pressure-chain-print-f-tt{fill:#ddedea}.fig-r4-02a-pressure-chain-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r4-02a-pressure-chain-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-02a-pressure-chain-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-02a-pressure-chain-print-bg" width="700" height="766"/><text class="fig-r4-02a-pressure-chain-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">A rise in filling pressure is transmitted back from</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="16.0" y="74.0" font-size="20" font-weight="600" text-anchor="start">the left ventricle to the lung capillaries</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="16.0" y="94.0" font-size="13.5" text-anchor="start">Schematic; no values.</text><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M16,119 h26" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r4-02a-pressure-chain-print-t-muted" x="48.0" y="123.0" font-size="13" text-anchor="start">pressure</text><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M126,119 h26" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r4-02a-pressure-chain-print-t-muted" x="158.0" y="123.0" font-size="13" text-anchor="start">blood flow</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="50.0" y="137.0" width="316.0" height="49.8" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="158.7" font-size="13" font-weight="600" text-anchor="start">Left ventricle</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="175.6" font-size="13" text-anchor="start">LVEDP: pressure at the end of filling</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="54.0" y="202.8" font-size="13" text-anchor="start">A filling pressure is not a filling</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="54.0" y="219.7" font-size="13" text-anchor="start">volume</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="50.0" y="240.6" width="316.0" height="66.7" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="262.3" font-size="13" font-weight="600" text-anchor="start">Left atrium</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="279.2" font-size="13" text-anchor="start">Left atrial pressure: changes through</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="296.1" font-size="13" text-anchor="start">the cardiac cycle</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="50.0" y="317.3" width="316.0" height="66.7" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="339.0" font-size="13" font-weight="600" text-anchor="start">Pulmonary veins</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="355.9" font-size="13" text-anchor="start">Pulmonary venous pressure: just</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="372.8" font-size="13" text-anchor="start">upstream of the atrium</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="50.0" y="394.0" width="316.0" height="66.7" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="415.7" font-size="13" font-weight="600" text-anchor="start">Lung capillaries</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="432.6" font-size="13" text-anchor="start">Capillary pressure: between pulmonary</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="449.5" font-size="13" text-anchor="start">arterial and venous pressure</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="54.0" y="476.7" font-size="13" font-weight="600" text-anchor="start">Higher than left atrial pressure</text><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M26,143 V483.59999999999997" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#fig-r4-02a-pressure-chain-print-ah)"/><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M40,483.59999999999997 V143" stroke-width="1.2" stroke-linecap="round" marker-end="url(#fig-r4-02a-pressure-chain-print-ah)"/><rect class="fig-r4-02a-pressure-chain-print-f-rt" x="390.0" y="137.0" width="294.0" height="185.0" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="158.7" font-size="13" text-anchor="start">Mean left atrial pressure and LVEDP</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="175.6" font-size="13" text-anchor="start">track reasonably closely with a</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="192.5" font-size="13" text-anchor="start">normal valve, an organized atrial</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="209.4" font-size="13" text-anchor="start">rhythm and a normally compliant</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="226.3" font-size="13" text-anchor="start">atrium. They separate with a</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="243.2" font-size="13" text-anchor="start">narrowed or substantially leaking</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="260.1" font-size="13" text-anchor="start">mitral valve, a stiff or enlarged</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="277.0" font-size="13" text-anchor="start">atrium, lost atrial rhythm, and the</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="293.9" font-size="13" text-anchor="start">point in the cardiac cycle when the</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="310.8" font-size="13" text-anchor="start">pressure is read.</text><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M390,234.60000000000002 H366" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><rect class="fig-r4-02a-pressure-chain-print-pn" x="390.0" y="332.0" width="294.0" height="100.5" rx="6"/><rect class="fig-r4-02a-pressure-chain-print-s-ink" x="390.0" y="332.0" width="294.0" height="100.5" rx="6" stroke-width="1.5" stroke-dasharray="3 4"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="353.7" font-size="13" text-anchor="start">Wedge pressure: estimates left</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="370.6" font-size="13" text-anchor="start">atrial pressure under the right</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="387.5" font-size="13" text-anchor="start">conditions; not a direct measure of</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="404.4" font-size="13" text-anchor="start">capillary pressure; not</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="400.0" y="421.3" font-size="13" text-anchor="start">interchangeable with LVEDP</text><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M390,362.0 H376 V276.6 H366" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M96,499.59999999999997 V537.5999999999999" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fig-r4-02a-pressure-chain-print-ah)"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="112.0" y="521.6" font-size="13" font-weight="600" text-anchor="start">Filtration rises with capillary pressure</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="16.0" y="541.6" width="326.0" height="66.7" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="26.0" y="563.3" font-size="13" font-weight="600" text-anchor="start">Interstitium</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="26.0" y="580.2" font-size="13" text-anchor="start">Lymph flow rises to match filtration,</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="26.0" y="597.1" font-size="13" text-anchor="start">up to a limit</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="16.0" y="618.3" width="326.0" height="83.6" rx="6"/><rect class="fig-r4-02a-pressure-chain-print-s-ink" x="16.0" y="618.3" width="326.0" height="83.6" rx="6" stroke-width="1.5" stroke-dasharray="1.5 4"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="26.0" y="640.0" font-size="13" text-anchor="start">Clearance: the alveolar epithelium</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="26.0" y="656.9" font-size="13" text-anchor="start">transports salt, and water follows; the</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="26.0" y="673.8" font-size="13" text-anchor="start">lymphatics and the circulation remove</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="26.0" y="690.7" font-size="13" text-anchor="start">it</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="358.0" y="555.6" font-size="13" font-weight="600" text-anchor="start">When filtration exceeds lymph capacity,</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="358.0" y="572.5" font-size="13" font-weight="600" text-anchor="start">fluid collects:</text><rect class="fig-r4-02a-pressure-chain-print-f-tt" x="358.0" y="595.4" width="326.0" height="32.9" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="368.0" y="617.1" font-size="13" text-anchor="start">1  around the bronchovascular bundles</text><rect class="fig-r4-02a-pressure-chain-print-f-tt" x="358.0" y="632.3" width="326.0" height="32.9" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="368.0" y="654.0" font-size="13" text-anchor="start">2  in the alveolar walls</text><rect class="fig-r4-02a-pressure-chain-print-f-tt" x="358.0" y="669.2" width="326.0" height="32.9" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="368.0" y="690.9" font-size="13" text-anchor="start">3  in the alveoli</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="16.0" y="726.1" font-size="13" text-anchor="start">Wedge pressure (catheter) estimates left atrial pressure. Lung ultrasound and imaging</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="16.0" y="743.0" font-size="13" text-anchor="start">see interstitial fluid. Neither measures capillary pressure directly.</text></svg>