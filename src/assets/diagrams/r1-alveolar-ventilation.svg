<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 578" width="100%" role="img" aria-labelledby="rf2-title rf2-desc"><title id="rf2-title">Same minute ventilation, different alveolar ventilation</title><desc id="rf2-desc">Two breathing patterns each move 6.0 liters per minute, with an anatomic dead space of 150 milliliters per breath, drawn to scale. Slow, deep breathing: rate 12 per minute, tidal volume 500 milliliters, 350 reach alveoli, alveolar ventilation 12 times 0.35 equals 4.2 liters per minute. Fast, shallow breathing: rate 30 per minute, tidal volume 200 milliliters, only 50 reach alveoli, alveolar ventilation 30 times 0.05 equals 1.5 liters per minute. Alveolar ventilation falls by a factor of about 2.8, so at the same carbon dioxide production steady-state PaCO2 would rise from 40 toward about 110 mm Hg. Illustrative numbers.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf2-t-ink{fill:var(--fig-ink,#172d38)}.rf2-t-muted{fill:var(--fig-muted,#526671)}.rf2-t-teal{fill:var(--fig-teal,#077578)}.rf2-t-red{fill:var(--fig-red,#af4639)}.rf2-t-gold{fill:var(--fig-gold,#996613)}.rf2-bg{fill:var(--fig-canvas,#f7f5ef)}.rf2-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.rf2-s-teal{stroke:var(--fig-teal,#077578);fill:none}.rf2-f-teal{fill:var(--fig-teal,#077578)}.rf2-s-red{stroke:var(--fig-red,#af4639);fill:none}.rf2-f-red{fill:var(--fig-red,#af4639)}.rf2-s-gold{stroke:var(--fig-gold,#996613);fill:none}.rf2-f-gold{fill:var(--fig-gold,#996613)}.rf2-s-muted{stroke:var(--fig-muted,#526671);fill:none}.rf2-f-muted{fill:var(--fig-muted,#526671)}.rf2-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.rf2-f-rule{fill:var(--fig-rule,#d5dedc)}.rf2-f-tt{fill:var(--fig-teal-tint,#ddedea)}.rf2-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.rf2-t-ink{fill:var(--fig-ink,#e8dfd0)}.rf2-t-muted{fill:var(--fig-muted,#b3a897)}.rf2-t-teal{fill:var(--fig-teal,#6fb8b0)}.rf2-t-red{fill:var(--fig-red,#e0907f)}.rf2-t-gold{fill:var(--fig-gold,#d9a955)}.rf2-bg{fill:var(--fig-canvas,#25211c)}.rf2-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.rf2-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.rf2-f-teal{fill:var(--fig-teal,#6fb8b0)}.rf2-s-red{stroke:var(--fig-red,#e0907f);fill:none}.rf2-f-red{fill:var(--fig-red,#e0907f)}.rf2-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.rf2-f-gold{fill:var(--fig-gold,#d9a955)}.rf2-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.rf2-f-muted{fill:var(--fig-muted,#b3a897)}.rf2-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.rf2-f-rule{fill:var(--fig-rule,#4a4238)}.rf2-f-tt{fill:var(--fig-teal-tint,#30443f)}.rf2-f-rt{fill:var(--fig-red-tint,#43302a)}}:root[data-theme=dark] svg {}</style><defs><marker id="rf2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf2-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf2-bg" width="360" height="578"/><text class="rf2-t-teal" x="12" y="24" font-size="12" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf2-t-ink" x="12" y="48" font-size="19" font-weight="600" text-anchor="start">Same minute ventilation,</text><text class="rf2-t-ink" x="12" y="72" font-size="19" font-weight="600" text-anchor="start">different alveolar ventilation</text><text class="rf2-t-muted" x="12" y="92" font-size="12.5" text-anchor="start">VA = VE × (1 − VD/VT). Anatomic dead space 150 mL.</text><rect class="rf2-pn" x="12" y="108" width="336" height="150" rx="6"/><rect class="rf2-f-teal" x="12" y="108" width="5" height="150" rx="2"/><text class="rf2-t-ink" x="28" y="130" font-size="16" font-weight="600" text-anchor="start">Slow, deep breathing</text><text class="rf2-t-ink" x="28" y="150" font-size="12.5" text-anchor="start">Rate 12/min × tidal volume 500 mL = 6.0 L/min</text><rect class="rf2-f-rt" x="28" y="162" width="90.0" height="26"/><rect class="rf2-f-teal" x="118.0" y="162" width="210.0" height="26"/><rect class="rf2-s-muted" x="28" y="162" width="300.0" height="26" stroke-width="1"/><text class="rf2-t-red" x="28" y="204" font-size="12.5" text-anchor="start">150 mL dead space</text><text class="rf2-t-teal" x="328" y="204" font-size="12.5" font-weight="600" text-anchor="end">350 mL to alveoli</text><text class="rf2-t-teal" x="28" y="230" font-size="17" font-weight="600" text-anchor="start">VA = 12 × 0.35 = 4.2 L/min</text><text class="rf2-t-muted" x="28" y="248" font-size="12" text-anchor="start">Each breath, to scale</text><rect class="rf2-pn" x="12" y="268" width="336" height="150" rx="6"/><rect class="rf2-f-red" x="12" y="268" width="5" height="150" rx="2"/><text class="rf2-t-ink" x="28" y="290" font-size="16" font-weight="600" text-anchor="start">Fast, shallow breathing</text><text class="rf2-t-ink" x="28" y="310" font-size="12.5" text-anchor="start">Rate 30/min × tidal volume 200 mL = 6.0 L/min</text><rect class="rf2-f-rt" x="28" y="322" width="90.0" height="26"/><rect class="rf2-f-red" x="118.0" y="322" width="30.0" height="26"/><rect class="rf2-s-muted" x="28" y="322" width="120.0" height="26" stroke-width="1"/><text class="rf2-t-red" x="28" y="364" font-size="12.5" text-anchor="start">150 mL dead space</text><text class="rf2-t-red" x="328" y="364" font-size="12.5" font-weight="600" text-anchor="end">50 mL to alveoli</text><text class="rf2-t-red" x="28" y="390" font-size="17" font-weight="600" text-anchor="start">VA = 30 × 0.05 = 1.5 L/min</text><text class="rf2-t-muted" x="28" y="408" font-size="12" text-anchor="start">Each breath, to scale</text><rect class="rf2-f-tt" x="12" y="428" width="336" height="104" rx="6"/><text class="rf2-t-ink" x="24" y="450" font-size="13.5" text-anchor="start">Alveolar ventilation falls from 4.2 to 1.5</text><text class="rf2-t-ink" x="24" y="469" font-size="13.5" text-anchor="start">L/min, a factor of about 2.8. At the same</text><text class="rf2-t-ink" x="24" y="488" font-size="13.5" text-anchor="start">VCO2, steady-state PaCO2 would rise from 40</text><text class="rf2-t-ink" x="24" y="507" font-size="13.5" text-anchor="start">toward about 110 mm Hg.</text><text class="rf2-t-muted" x="12" y="552" font-size="12" text-anchor="start">Illustrative steady-state numbers from Part II.</text><text class="rf2-t-muted" x="12" y="568" font-size="12" text-anchor="start">Effort is not in the equation.</text></svg>