" y1="162" x2="140" y2="180" class="s-ink" stroke-width="1.2"/><text x="140" y="194" font-size="12.4" text-anchor="middle" font-weight="700" class="t-ink">gap (hatched)</text><text x="12" y="208" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">cations | anions</text></g><g transform="translate(10,1044)"><rect x="0" y="0" width="340" height="96" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Two gaps, opposite directions</text><text x="12" y="44" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">Toxic alcohol over time:</text><text x="12" y="62" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">early: parent alcohol → osmolar gap up</text><text x="12" y="80" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">later: acids → anion gap up, osmolar falls</text></g></svg>
