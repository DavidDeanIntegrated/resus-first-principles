<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 466" role="img" aria-labelledby="fig-r4-03-pleural-pressure-print-title" aria-describedby="fig-r4-03-pleural-pressure-print-desc"><title id="fig-r4-03-pleural-pressure-print-title">Breathing hard loads the left ventricle</title><desc id="fig-r4-03-pleural-pressure-print-desc">Two schematic drawings of a heart inside the chest. In the first, labeled labored breathing, arrows point outward from the heart to show pleural pressure falling well below atmospheric; the ventricle must generate more transmural pressure, so its load rises. In the second, labeled positive pressure, arrows point inward toward the heart to show slightly positive pleural pressure; the gap between inside and outside is smaller, so the load falls. A note reads: at the same arterial pressure, positive pressure lowers the load on the left ventricle; the direction is the point. Schematic; no values are shown.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-03-pleural-pressure-print-t-ink{fill:#172d38}.fig-r4-03-pleural-pressure-print-t-muted{fill:#526671}.fig-r4-03-pleural-pressure-print-t-teal{fill:#077578}.fig-r4-03-pleural-pressure-print-t-red{fill:#af4639}.fig-r4-03-pleural-pressure-print-t-gold{fill:#996613}.fig-r4-03-pleural-pressure-print-bg{fill:#ffffff}.fig-r4-03-pleural-pressure-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-03-pleural-pressure-print-s-teal{stroke:#077578;fill:none}.fig-r4-03-pleural-pressure-print-f-teal{fill:#077578}.fig-r4-03-pleural-pressure-print-s-red{stroke:#af4639;fill:none}.fig-r4-03-pleural-pressure-print-f-red{fill:#af4639}.fig-r4-03-pleural-pressure-print-s-gold{stroke:#996613;fill:none}.fig-r4-03-pleural-pressure-print-f-gold{fill:#996613}.fig-r4-03-pleural-pressure-print-s-muted{stroke:#526671;fill:none}.fig-r4-03-pleural-pressure-print-f-muted{fill:#526671}.fig-r4-03-pleural-pressure-print-s-rule{stroke:#d5dedc;fill:none}.fig-r4-03-pleural-pressure-print-f-rule{fill:#d5dedc}.fig-r4-03-pleural-pressure-print-s-ink{stroke:#172d38;fill:none}.fig-r4-03-pleural-pressure-print-f-ink{fill:#172d38}.fig-r4-03-pleural-pressure-print-f-tt{fill:#ddedea}.fig-r4-03-pleural-pressure-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r4-03-pleural-pressure-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-03-pleural-pressure-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-03-pleural-pressure-print-bg" width="700" height="466"/><text class="fig-r4-03-pleural-pressure-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-03-pleural-pressure-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">Breathing hard loads the left ventricle</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Schematic; direction only;</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="16.0" y="87.0" font-size="13.5" text-anchor="start">no values are shown.</text><rect class="fig-r4-03-pleural-pressure-print-pn" x="16.0" y="110.0" width="327.0" height="280.0" rx="6"/><rect class="fig-r4-03-pleural-pressure-print-f-red" x="16.0" y="110.0" width="5" height="280.0" rx="2"/><text class="fig-r4-03-pleural-pressure-print-t-ink" x="32.0" y="134.0" font-size="15" font-weight="600" text-anchor="start">Labored breathing</text><rect class="fig-r4-03-pleural-pressure-print-f-tt" x="117.5" y="158" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-print-f-red" cx="179.5" cy="210" r="24" opacity="0.85"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M149.5,210.0 L129.5,210.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M209.5,210.0 L229.5,210.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M179.5,186.0 L179.5,170.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M179.5,234.0 L179.5,250.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><text class="fig-r4-03-pleural-pressure-print-t-muted" x="32.0" y="284.0" font-size="13" text-anchor="start">Pleural pressure falls</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="32.0" y="300.0" font-size="13" text-anchor="start">well below atmospheric</text><text class="fig-r4-03-pleural-pressure-print-t-red" x="32.0" y="324.0" font-size="13" font-weight="600" text-anchor="start">Ventricle must generate</text><text class="fig-r4-03-pleural-pressure-print-t-red" x="32.0" y="341.0" font-size="13" font-weight="600" text-anchor="start">more transmural pressure:</text><text class="fig-r4-03-pleural-pressure-print-t-red" x="32.0" y="358.0" font-size="13" font-weight="600" text-anchor="start">more load</text><rect class="fig-r4-03-pleural-pressure-print-pn" x="357.0" y="110.0" width="327.0" height="280.0" rx="6"/><rect class="fig-r4-03-pleural-pressure-print-f-teal" x="357.0" y="110.0" width="5" height="280.0" rx="2"/><text class="fig-r4-03-pleural-pressure-print-t-ink" x="373.0" y="134.0" font-size="15" font-weight="600" text-anchor="start">Positive pressure</text><rect class="fig-r4-03-pleural-pressure-print-f-tt" x="458.5" y="158" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-print-f-teal" cx="520.5" cy="210" r="24" opacity="0.85"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M468.5,210.0 L488.5,210.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M572.5,210.0 L552.5,210.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M520.5,168.4 L520.5,184.4" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M520.5,251.6 L520.5,235.6" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><text class="fig-r4-03-pleural-pressure-print-t-muted" x="373.0" y="284.0" font-size="13" text-anchor="start">Pleural pressure</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="373.0" y="300.0" font-size="13" text-anchor="start">slightly positive</text><text class="fig-r4-03-pleural-pressure-print-t-teal" x="373.0" y="324.0" font-size="13" font-weight="600" text-anchor="start">Smaller gap inside</text><text class="fig-r4-03-pleural-pressure-print-t-teal" x="373.0" y="341.0" font-size="13" font-weight="600" text-anchor="start">to outside: less load</text><rect class="fig-r4-03-pleural-pressure-print-f-tt" x="16.0" y="402.0" width="668.0" height="52.0" rx="6"/><text class="fig-r4-03-pleural-pressure-print-t-ink" x="28.0" y="422.0" font-size="13" text-anchor="start">At the same arterial pressure, positive pressure lowers the load on the left ventricle.</text><text class="fig-r4-03-pleural-pressure-print-t-ink" x="28.0" y="439.0" font-size="13" text-anchor="start">The direction is the point; no values are shown.</text></svg>