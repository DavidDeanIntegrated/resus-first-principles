<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 426" role="img" aria-labelledby="fig-r4-03-pleural-pressure-print-title" aria-describedby="fig-r4-03-pleural-pressure-print-desc"><title id="fig-r4-03-pleural-pressure-print-title">Transmural pressure on the left ventricle: labored breathing versus positive pressure</title><desc id="fig-r4-03-pleural-pressure-print-desc">Two side-by-side drawings of a heart inside the chest, both at peak systole during inspiration and with the same systolic pressure. In the left drawing, labeled labored breathing, arrows point outward from the heart to show pleural pressure falling well below atmospheric, and a label reads higher transmural pressure. In the right drawing, labeled positive pressure, a flat baseline marked approximately zero shows pleural pressure near atmospheric at the same point in the breath, and a label reads lower transmural pressure. No other values are shown.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-03-pleural-pressure-print-t-ink{fill:#172d38}.fig-r4-03-pleural-pressure-print-t-muted{fill:#526671}.fig-r4-03-pleural-pressure-print-t-teal{fill:#077578}.fig-r4-03-pleural-pressure-print-t-red{fill:#af4639}.fig-r4-03-pleural-pressure-print-t-gold{fill:#996613}.fig-r4-03-pleural-pressure-print-bg{fill:#ffffff}.fig-r4-03-pleural-pressure-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-03-pleural-pressure-print-s-teal{stroke:#077578;fill:none}.fig-r4-03-pleural-pressure-print-f-teal{fill:#077578}.fig-r4-03-pleural-pressure-print-s-red{stroke:#af4639;fill:none}.fig-r4-03-pleural-pressure-print-f-red{fill:#af4639}.fig-r4-03-pleural-pressure-print-s-gold{stroke:#996613;fill:none}.fig-r4-03-pleural-pressure-print-f-gold{fill:#996613}.fig-r4-03-pleural-pressure-print-s-muted{stroke:#526671;fill:none}.fig-r4-03-pleural-pressure-print-f-muted{fill:#526671}.fig-r4-03-pleural-pressure-print-s-rule{stroke:#d5dedc;fill:none}.fig-r4-03-pleural-pressure-print-f-rule{fill:#d5dedc}.fig-r4-03-pleural-pressure-print-s-ink{stroke:#172d38;fill:none}.fig-r4-03-pleural-pressure-print-f-ink{fill:#172d38}.fig-r4-03-pleural-pressure-print-f-tt{fill:#ddedea}.fig-r4-03-pleural-pressure-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r4-03-pleural-pressure-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-03-pleural-pressure-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-03-pleural-pressure-print-bg" width="700" height="426"/><text class="fig-r4-03-pleural-pressure-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-03-pleural-pressure-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">Transmural pressure on the left ventricle: labored</text><text class="fig-r4-03-pleural-pressure-print-t-ink" x="16.0" y="74.0" font-size="20" font-weight="600" text-anchor="start">breathing versus positive pressure</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="16.0" y="100.0" font-size="13" text-anchor="start">Same instant: peak systole during inspiration; same assumed systolic pressure</text><rect class="fig-r4-03-pleural-pressure-print-pn" x="16.0" y="124.9" width="327.0" height="260.0" rx="6"/><text class="fig-r4-03-pleural-pressure-print-t-ink" x="30.0" y="148.9" font-size="15" font-weight="600" text-anchor="start">Labored breathing</text><rect class="fig-r4-03-pleural-pressure-print-f-tt" x="117.5" y="172.9" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-print-f-rt" cx="179.5" cy="224.9" r="24"/><circle class="fig-r4-03-pleural-pressure-print-s-ink" cx="179.5" cy="224.9" r="24" stroke-width="2"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M149.5,224.9 L127.5,224.9" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M209.5,224.9 L231.5,224.9" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M179.5,200.9 L179.5,183.3" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M179.5,248.9 L179.5,266.5" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-print-ah)"/><text class="fig-r4-03-pleural-pressure-print-t-muted" x="30.0" y="306.9" font-size="13" text-anchor="start">Pleural pressure well below</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="30.0" y="323.8" font-size="13" text-anchor="start">atmospheric</text><text class="fig-r4-03-pleural-pressure-print-t-ink" x="30.0" y="360.9" font-size="13" font-weight="600" text-anchor="start">Higher transmural pressure</text><rect class="fig-r4-03-pleural-pressure-print-pn" x="357.0" y="124.9" width="327.0" height="260.0" rx="6"/><text class="fig-r4-03-pleural-pressure-print-t-ink" x="371.0" y="148.9" font-size="15" font-weight="600" text-anchor="start">Positive pressure</text><rect class="fig-r4-03-pleural-pressure-print-f-tt" x="458.5" y="172.9" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-print-f-rt" cx="520.5" cy="224.9" r="24"/><circle class="fig-r4-03-pleural-pressure-print-s-ink" cx="520.5" cy="224.9" r="24" stroke-width="2"/><path class="fig-r4-03-pleural-pressure-print-s-ink" d="M464.5,264.9 H576.5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r4-03-pleural-pressure-print-t-ink" x="578.5" y="268.9" font-size="13" font-weight="600" text-anchor="start">≈ 0</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="371.0" y="306.9" font-size="13" text-anchor="start">Pleural pressure near atmospheric at</text><text class="fig-r4-03-pleural-pressure-print-t-muted" x="371.0" y="323.8" font-size="13" text-anchor="start">the same point in the breath</text><text class="fig-r4-03-pleural-pressure-print-t-ink" x="371.0" y="360.9" font-size="13" font-weight="600" text-anchor="start">Lower transmural pressure</text><text class="fig-r4-03-pleural-pressure-print-t-ink" x="16.0" y="402.9" font-size="13" text-anchor="start">Direction only; not a measure of total afterload. No other values are shown.</text></svg>