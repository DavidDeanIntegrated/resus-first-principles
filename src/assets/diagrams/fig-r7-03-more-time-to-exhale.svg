<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 886" role="img" aria-labelledby="fig-r7-03-more-time-to-exhale-screen-title" aria-describedby="fig-r7-03-more-time-to-exhale-screen-desc"><title id="fig-r7-03-more-time-to-exhale-screen-title">Why more time to exhale works, and what it costs</title><desc id="fig-r7-03-more-time-to-exhale-screen-desc">Two volume-over-time traces with illustrative numbers and the same 1 second inspiratory time. At 20 breaths per minute, each cycle lasts 3 seconds and exhalation gets 2 seconds, so breaths stack and trapped volume builds. At 10 breaths per minute, each cycle lasts 6 seconds and exhalation gets 5 seconds, more than doubled, and volume returns to baseline. A tradeoff list: the lower rate gives less trapped volume, lower intrinsic PEEP and better venous return, but costs minute ventilation, so higher CO2 is accepted. A reassessment pair: improving means less work with stable or falling CO2; tiring means less wheeze with rising CO2 and a quieter chest, which is worse. A footnote, by mechanism only: bronchodilators widen airways, shortening time constants; beta-2 agonists relax airway smooth muscle, and anticholinergics block M3 muscarinic receptors, removing vagal bronchoconstrictor tone. Heliox lowers gas density and is not a bronchodilator.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r7-03-more-time-to-exhale-screen-h)}</style><defs><marker id="fig-r7-03-more-time-to-exhale-screen-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r7-03-more-time-to-exhale-screen-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="360" height="886"/><g transform="translate(10,10)"><text x="0" y="16" font-size="12.4" text-anchor="start" font-weight="700" class="t-teal">LIFE-THREATENING ASTHMA</text><text x="0" y="40" font-size="19" text-anchor="start" font-weight="700" class="t-ink">Why more time to exhale works,</text><text x="0" y="64" font-size="19" text-anchor="start" font-weight="700" class="t-ink">and what it costs</text><text x="0" y="88" font-size="13" text-anchor="start" font-weight="400" class="t-muted">Illustrative numbers; inspiratory time held at 1 s.</text></g><g transform="translate(10,124)"><rect x="0" y="0" width="340" height="170" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Higher rate: 20/min</text><text x="12" y="40" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">3 s cycle, 1 s in, 2 s out</text><line x1="20" y1="144" x2="330" y2="144" class="s-muted" stroke-width="1.5" stroke-dasharray="5 3"/><text x="330" y="160" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">baseline</text><path d="M24,144 L72.0,94 L168.0,134 L216.0,84 L312.0,124" class="s-teal" stroke-width="2.5"/><line x1="72.0" y1="70" x2="168.0" y2="70" class="s-ink" stroke-width="1.5" marker-end="url(#fig-r7-03-more-time-to-exhale-screen-ar)"/><text x="120.0" y="50" font-size="13" text-anchor="start" font-weight="400" class="t-ink"></text><text x="72.0" y="62" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">exhale 2 s</text><text x="24" y="160" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">trapped volume builds</text></g><g transform="translate(10,308)"><rect x="0" y="0" width="340" height="170" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Lower rate: 10/min</text><text x="12" y="40" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">6 s cycle, 1 s in, 5 s out: more than doubled</text><line x1="20" y1="144" x2="330" y2="144" class="s-muted" stroke-width="1.5" stroke-dasharray="5 3"/><text x="330" y="160" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">baseline</text><path d="M24,144 L72.0,94 L312.0,144" class="s-teal" stroke-width="2.5"/><line x1="72.0" y1="70" x2="312.0" y2="70" class="s-ink" stroke-width="1.5" marker-end="url(#fig-r7-03-more-time-to-exhale-screen-ar)"/><text x="192.0" y="50" font-size="13" text-anchor="start" font-weight="400" class="t-ink"></text><text x="72.0" y="62" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">exhale 5 s</text></g><g transform="translate(10,492)"><rect x="0" y="0" width="340" height="170" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">The tradeoff</text><text x="12" y="46" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">Lower rate gives:</text><text x="12" y="63" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">✓ less trapped volume</text><text x="12" y="80" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">✓ lower intrinsic PEEP</text><text x="12" y="97" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">✓ better venous return</text><text x="12" y="120" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">But costs:</text><text x="12" y="137" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">✗ less minute ventilation</text><text x="12" y="154" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">✗ higher CO2 accepted</text></g><g transform="translate(10,676)"><rect x="0" y="0" width="340" height="196" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Reassess: which way is it going?</text><text x="12" y="46" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">▲ Improving: less work,</text><text x="24" y="62" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">stable or falling CO2</text><text x="12" y="90" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">▼ Tiring: less wheeze + rising CO2</text><text x="24" y="106" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">+ quieter chest = worse</text><text x="12" y="134" font-size="12.4" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">Bronchodilators widen airways, shortening time</text><text x="12" y="150" font-size="12.4" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">constants: beta-2 agonists relax airway muscle;</text><text x="12" y="166" font-size="12.4" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">anticholinergics block M3, removing vagal tone.</text><text x="12" y="182" font-size="12.4" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">Heliox lowers gas density; not a bronchodilator.</text></g></svg>