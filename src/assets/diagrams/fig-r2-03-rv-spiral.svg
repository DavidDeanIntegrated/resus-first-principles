<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 633" role="img" aria-labelledby="fig-r2-03-rv-spiral-screen-title" aria-describedby="fig-r2-03-rv-spiral-screen-desc"><title id="fig-r2-03-rv-spiral-screen-title">The right ventricular spiral</title><desc id="fig-r2-03-rv-spiral-screen-desc">Simplified teaching model. A loop of four boxes: lower systemic pressure leads to reduced right coronary perfusion, then a weaker right ventricle, then lower cardiac output, which returns to lower systemic pressure; each step worsens the next. From a panel outside the loop, hypoxemia, hypercapnia and positive pressure raise pulmonary vascular resistance and add load to the weaker right ventricle. A side panel shows Patient R, with right ventricular perfusion approximated as mean arterial pressure minus central venous pressure: before induction 71 minus 18 equals 53 mm Hg; if mean arterial pressure falls to 55, 55 minus 18 equals 37 mm Hg. The approximation is a teaching simplification; the true driving pressure varies through the cardiac cycle.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-03-rv-spiral-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r2-03-rv-spiral-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r2-03-rv-spiral-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r2-03-rv-spiral-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r2-03-rv-spiral-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r2-03-rv-spiral-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r2-03-rv-spiral-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r2-03-rv-spiral-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r2-03-rv-spiral-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r2-03-rv-spiral-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r2-03-rv-spiral-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r2-03-rv-spiral-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r2-03-rv-spiral-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r2-03-rv-spiral-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r2-03-rv-spiral-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r2-03-rv-spiral-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r2-03-rv-spiral-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r2-03-rv-spiral-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r2-03-rv-spiral-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r2-03-rv-spiral-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r2-03-rv-spiral-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r2-03-rv-spiral-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-03-rv-spiral-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-03-rv-spiral-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-03-rv-spiral-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r2-03-rv-spiral-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-03-rv-spiral-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r2-03-rv-spiral-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r2-03-rv-spiral-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r2-03-rv-spiral-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-03-rv-spiral-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r2-03-rv-spiral-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r2-03-rv-spiral-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r2-03-rv-spiral-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-03-rv-spiral-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r2-03-rv-spiral-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-03-rv-spiral-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r2-03-rv-spiral-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r2-03-rv-spiral-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r2-03-rv-spiral-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-03-rv-spiral-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r2-03-rv-spiral-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r2-03-rv-spiral-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-03-rv-spiral-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-03-rv-spiral-screen-bg" width="360" height="633"/><text class="fig-r2-03-rv-spiral-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">The right ventricular spiral</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="12.0" y="70.0" font-size="12.5" text-anchor="start">Simplified teaching model.</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="12.0" y="93.0" width="150.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-ink" x="87.0" y="121.0" font-size="14" font-weight="600" text-anchor="middle">Lower systemic</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="87.0" y="139.0" font-size="14" font-weight="600" text-anchor="middle">pressure</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="198.0" y="93.0" width="150.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-ink" x="273.0" y="121.0" font-size="14" font-weight="600" text-anchor="middle">Reduced right</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="273.0" y="139.0" font-size="14" font-weight="600" text-anchor="middle">coronary perfusion</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="198.0" y="199.0" width="150.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-red" x="273.0" y="227.0" font-size="14" font-weight="600" text-anchor="middle">Weaker right</text><text class="fig-r2-03-rv-spiral-screen-t-red" x="273.0" y="245.0" font-size="14" font-weight="600" text-anchor="middle">ventricle</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="12.0" y="199.0" width="150.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-ink" x="87.0" y="227.0" font-size="14" font-weight="600" text-anchor="middle">Lower cardiac</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="87.0" y="245.0" font-size="14" font-weight="600" text-anchor="middle">output</text><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M165.0,124.0 H194.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M273.0,158 V195" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M195.0,230.0 H166.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M87.0,196 V159" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><text class="fig-r2-03-rv-spiral-screen-t-muted" x="180.0" y="182.0" font-size="12.5" text-anchor="middle">each step worsens the next</text><path class="fig-r2-03-rv-spiral-screen-s-red" d="M273.0,285 V265" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><rect class="fig-r2-03-rv-spiral-screen-f-rt" x="12.0" y="287.0" width="336.0" height="96.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-red" x="24.0" y="309.0" font-size="13.5" font-weight="600" text-anchor="start">Raise pulmonary vascular resistance</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="24.0" y="331.0" font-size="14" font-weight="600" text-anchor="start">Hypoxemia, hypercapnia</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="24.0" y="350.0" font-size="14" font-weight="600" text-anchor="start">and positive pressure</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="24.0" y="371.0" font-size="12.5" text-anchor="start">add load to the weaker right ventricle</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="12" y="399" width="336" height="220.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-teal" x="28.0" y="421.0" font-size="13.5" font-weight="600" text-anchor="start">Patient R: RV perfusion</text><text class="fig-r2-03-rv-spiral-screen-t-teal" x="28.0" y="439.0" font-size="13.5" font-weight="600" text-anchor="start">approximated as MAP − CVP</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="28.0" y="469.0" font-size="12.5" text-anchor="start">Before induction</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="28.0" y="489.0" font-size="15" font-weight="600" text-anchor="start">MAP 71 − CVP 18 = 53 mm Hg</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="28.0" y="517.0" font-size="12.5" text-anchor="start">If MAP falls to 55</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="28.0" y="537.0" font-size="15" font-weight="600" text-anchor="start">55 − 18 = 37 mm Hg</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="28.0" y="567.0" font-size="12.5" text-anchor="start">A teaching simplification:</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="28.0" y="583.0" font-size="12.5" text-anchor="start">true driving pressure varies</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="28.0" y="599.0" font-size="12.5" text-anchor="start">through the cardiac cycle.</text><rect class="fig-r2-03-rv-spiral-screen-f-teal" x="12.0" y="399.0" width="5" height="220.0" rx="2"/></svg>