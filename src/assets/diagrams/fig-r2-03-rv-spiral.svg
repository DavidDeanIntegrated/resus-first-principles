<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 564" role="img" aria-labelledby="fig-r2-03-rv-spiral-screen-title" aria-describedby="fig-r2-03-rv-spiral-screen-desc"><title id="fig-r2-03-rv-spiral-screen-title">The right ventricular spiral</title><desc id="fig-r2-03-rv-spiral-screen-desc">Simplified teaching model. Hypoxemia, hypercapnia, lung collapse and overinflation raise pulmonary vascular resistance, which feeds greater right ventricular load. Greater load leads into a directional loop: right ventricular dilation and wall stress, then reduced right ventricular perfusion and contraction, then reduced left ventricular filling and lower systemic pressure, then further reduced right ventricular perfusion, which returns to more dilation and wall stress. Unless interrupted, the loop can sustain itself.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-03-rv-spiral-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r2-03-rv-spiral-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r2-03-rv-spiral-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r2-03-rv-spiral-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r2-03-rv-spiral-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r2-03-rv-spiral-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r2-03-rv-spiral-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r2-03-rv-spiral-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r2-03-rv-spiral-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r2-03-rv-spiral-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r2-03-rv-spiral-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r2-03-rv-spiral-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r2-03-rv-spiral-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r2-03-rv-spiral-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r2-03-rv-spiral-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r2-03-rv-spiral-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r2-03-rv-spiral-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r2-03-rv-spiral-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r2-03-rv-spiral-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r2-03-rv-spiral-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r2-03-rv-spiral-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r2-03-rv-spiral-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-03-rv-spiral-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-03-rv-spiral-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-03-rv-spiral-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r2-03-rv-spiral-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-03-rv-spiral-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r2-03-rv-spiral-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r2-03-rv-spiral-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r2-03-rv-spiral-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-03-rv-spiral-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r2-03-rv-spiral-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r2-03-rv-spiral-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r2-03-rv-spiral-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-03-rv-spiral-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r2-03-rv-spiral-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-03-rv-spiral-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r2-03-rv-spiral-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r2-03-rv-spiral-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r2-03-rv-spiral-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-03-rv-spiral-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r2-03-rv-spiral-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r2-03-rv-spiral-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-03-rv-spiral-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-03-rv-spiral-screen-bg" width="360" height="564"/><text class="fig-r2-03-rv-spiral-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">The right ventricular spiral</text><text class="fig-r2-03-rv-spiral-screen-t-muted" x="12.0" y="70.0" font-size="12.5" text-anchor="start">Simplified teaching model.</text><rect class="fig-r2-03-rv-spiral-screen-f-rt" x="12.0" y="93.0" width="336.0" height="68.6" rx="6"/><rect class="fig-r2-03-rv-spiral-screen-f-red" x="12.0" y="93.0" width="5" height="68.6" rx="2"/><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="118.5" font-size="13.5" font-weight="600" text-anchor="middle">Hypoxemia, hypercapnia, lung</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="135.4" font-size="13.5" font-weight="600" text-anchor="middle">collapse and overinflation raise</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="152.2" font-size="13.5" font-weight="600" text-anchor="middle">pulmonary vascular resistance</text><path class="fig-r2-03-rv-spiral-screen-s-red" d="M180.0,164.625 V191.625" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><rect class="fig-r2-03-rv-spiral-screen-pn" x="80.0" y="195.6" width="200.0" height="44.0" rx="6"/><rect class="fig-r2-03-rv-spiral-screen-f-red" x="80.0" y="195.6" width="5" height="44.0" rx="2"/><text class="fig-r2-03-rv-spiral-screen-t-red" x="180.0" y="222.5" font-size="14.5" font-weight="600" text-anchor="middle">Greater RV load</text><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M180.0,242.625 V269.625" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><rect class="fig-r2-03-rv-spiral-screen-pn" x="105.0" y="273.6" width="150.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="305.0" font-size="13.5" font-weight="600" text-anchor="middle">RV dilation</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="321.9" font-size="13.5" font-weight="600" text-anchor="middle">and wall stress</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="198.0" y="361.6" width="150.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-red" x="273.0" y="384.6" font-size="13.5" font-weight="600" text-anchor="middle">Reduced RV</text><text class="fig-r2-03-rv-spiral-screen-t-red" x="273.0" y="401.5" font-size="13.5" font-weight="600" text-anchor="middle">perfusion and</text><text class="fig-r2-03-rv-spiral-screen-t-red" x="273.0" y="418.4" font-size="13.5" font-weight="600" text-anchor="middle">contraction</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="105.0" y="449.6" width="150.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="472.6" font-size="13.5" font-weight="600" text-anchor="middle">Reduced LV</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="489.5" font-size="13.5" font-weight="600" text-anchor="middle">filling and lower</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="180.0" y="506.4" font-size="13.5" font-weight="600" text-anchor="middle">systemic pressure</text><rect class="fig-r2-03-rv-spiral-screen-pn" x="12.0" y="361.6" width="150.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-screen-t-ink" x="87.0" y="393.0" font-size="13.5" font-weight="600" text-anchor="middle">Further reduced</text><text class="fig-r2-03-rv-spiral-screen-t-ink" x="87.0" y="409.9" font-size="13.5" font-weight="600" text-anchor="middle">RV perfusion</text><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M259.0,308.625 Q273.0,308.625 273.0,357.625" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M273.0,435.625 Q273.0,484.625 259.0,484.625" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M101.0,484.625 Q87.0,484.625 87.0,435.625" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><path class="fig-r2-03-rv-spiral-screen-s-muted" d="M87.0,357.625 Q87.0,308.625 101.0,308.625" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-screen-ah)"/><text class="fig-r2-03-rv-spiral-screen-t-muted" x="180.0" y="541.6" font-size="12.5" text-anchor="middle">Unless interrupted, the loop can sustain itself.</text></svg>