<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 683" width="6.9in" height="6.73in" role="img" aria-labelledby="fig-r8-03-anion-gap-bookkeeping-print-title" aria-describedby="fig-r8-03-anion-gap-bookkeeping-print-desc"><title id="fig-r8-03-anion-gap-bookkeeping-print-title">The anion gap is bookkeeping, and albumin fills most of it</title><desc id="fig-r8-03-anion-gap-bookkeeping-print-desc">Paired stacked columns of cations and anions, schematic and not to scale, under the formula gap equals sodium minus chloride plus bicarbonate, calculated without potassium. Sodium stands against chloride, bicarbonate and unmeasured anions, with albumin the largest part of the unmeasured block. Four variants: normal; low albumin, where the baseline gap shrinks and can hide an added acid, with the example of a gap of 10 at albumin 2.0 against a normal 4.0 adjusting to 15; gap acidosis, where lactate, ketones or toxic alcohol acids take the place of bicarbonate and the gap widens; and chloride gain or bicarbonate loss, labeled gap normal: bicarbonate lost or diluted, chloride takes its place in the arithmetic. In that panel, bicarbonate is lost or diluted and chloride takes its place in the arithmetic; chloride does not push bicarbonate out. Renal dysfunction is noted as able to do both. A small timeline shows the osmolar gap high early and the anion gap rising later in toxic alcohol poisoning. The albumin adjustment corrects the baseline only.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r8-03-anion-gap-bookkeeping-print-h)}</style><defs><marker id="fig-r8-03-anion-gap-bookkeeping-print-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r8-03-anion-gap-bookkeeping-print-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="700" height="683"/><g transform="translate(10,10)"><text x="0" y="16" font-size="13.14" text-anchor="start" font-weight="700" class="t-teal">ACID–BASE PHYSIOLOGY</text><text x="0" y="40" font-size="20.14" text-anchor="start" font-weight="700" class="t-ink">The anion gap is bookkeeping,</text><text x="0" y="64" font-size="20.14" text-anchor="start" font-weight="700" class="t-ink">and albumin fills most of it</text><text x="0" y="88" font-size="13.78" text-anchor="start" font-weight="400" class="t-muted">Gap = Na+ − (Cl− + HCO3−). Schematic proportions.</text></g><g transform="translate(10,124)"><rect x="0" y="0" width="340" height="244" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">Normal</text><rect x="30" y="40" width="60" height="130" rx="0" class="pn" /><text x="60" y="105.0" font-size="13.78" text-anchor="middle" font-weight="700" class="t-ink">Na+</text><rect x="110" y="40" width="60" height="80.6" rx="0" class="pn" /><rect x="110" y="40" width="60" height="80.6" rx="0" class="s-ink" /><text x="140" y="85.3" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">Cl−</text><rect x="110" y="120.6" width="60" height="26.0" rx="0" class="pn" /><rect x="110" y="120.6" width="60" height="26.0" rx="0" class="s-ink" /><text x="140" y="138.6" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">HCO3−</text><rect x="110" y="146.6" width="60" height="23.4" rx="0" class="hatch" /><rect x="110" y="146.6" width="60" height="23.4" rx="0" class="s-ink" /><text x="184" y="60" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Gap: unmeasured</text><text x="184" y="76" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">anions, mostly</text><text x="184" y="92" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">albumin</text><line x1="140" y1="162" x2="140" y2="180" class="s-ink" stroke-width="1.2"/><text x="140" y="194" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">gap (hatched)</text><text x="12" y="208" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">cations | anions</text><text x="12" y="226" font-size="13.14" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">Calculated without K+</text></g><g transform="translate(350,10)"><rect x="0" y="0" width="340" height="291" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">Low albumin</text><rect x="30" y="40" width="60" height="130" rx="0" class="pn" /><text x="60" y="105.0" font-size="13.78" text-anchor="middle" font-weight="700" class="t-ink">Na+</text><rect x="110" y="40" width="60" height="85.8" rx="0" class="pn" /><rect x="110" y="40" width="60" height="85.8" rx="0" class="s-ink" /><text x="140" y="87.9" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">Cl−</text><rect x="110" y="125.8" width="60" height="31.2" rx="0" class="pn" /><rect x="110" y="125.8" width="60" height="31.2" rx="0" class="s-ink" /><text x="140" y="146.4" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">HCO3−</text><rect x="110" y="157.0" width="60" height="13.0" rx="0" class="hatch" /><rect x="110" y="157.0" width="60" height="13.0" rx="0" class="s-ink" /><text x="184" y="60" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Low albumin hides</text><text x="184" y="76" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">a gap. Example:</text><text x="184" y="92" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">AG 10, albumin 2.0</text><text x="184" y="108" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">(normal 4.0) →</text><text x="184" y="124" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">adjusted AG 15</text><line x1="140" y1="162" x2="140" y2="180" class="s-ink" stroke-width="1.2"/><text x="140" y="194" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">gap (hatched)</text><text x="12" y="208" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">cations | anions</text><text x="12" y="226" font-size="13.14" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">Calculated without K+</text><text x="12" y="246" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Adjustment restores the gap&#x27;s baseline; it</text><text x="12" y="261" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">does not capture albumin&#x27;s own alkalinizing</text><text x="12" y="276" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">effect.</text></g><g transform="translate(10,382)"><rect x="0" y="0" width="340" height="244" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">Added acid</text><rect x="30" y="40" width="60" height="130" rx="0" class="pn" /><text x="60" y="105.0" font-size="13.78" text-anchor="middle" font-weight="700" class="t-ink">Na+</text><rect x="110" y="40" width="60" height="80.6" rx="0" class="pn" /><rect x="110" y="40" width="60" height="80.6" rx="0" class="s-ink" /><text x="140" y="85.3" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">Cl−</text><rect x="110" y="120.6" width="60" height="10.4" rx="0" class="pn" /><rect x="110" y="120.6" width="60" height="10.4" rx="0" class="s-ink" /><text x="140" y="130.8" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">HCO3−</text><rect x="110" y="131.0" width="60" height="39.0" rx="0" class="hatch" /><rect x="110" y="131.0" width="60" height="39.0" rx="0" class="s-ink" /><text x="184" y="60" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Gap widens:</text><text x="184" y="76" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">lactate, ketones,</text><text x="184" y="92" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">toxic-alcohol acids</text><text x="184" y="108" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">replace HCO3−</text><line x1="140" y1="162" x2="140" y2="180" class="s-ink" stroke-width="1.2"/><text x="140" y="194" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">gap (hatched)</text><text x="12" y="208" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">cations | anions</text><text x="12" y="226" font-size="13.14" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">Calculated without K+</text></g><g transform="translate(350,315)"><rect x="0" y="0" width="340" height="244" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">Chloride gain or HCO3− loss</text><rect x="30" y="40" width="60" height="130" rx="0" class="pn" /><text x="60" y="105.0" font-size="13.78" text-anchor="middle" font-weight="700" class="t-ink">Na+</text><rect x="110" y="40" width="60" height="96.2" rx="0" class="pn" /><rect x="110" y="40" width="60" height="96.2" rx="0" class="s-ink" /><text x="140" y="93.1" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">Cl−</text><rect x="110" y="136.2" width="60" height="10.4" rx="0" class="pn" /><rect x="110" y="136.2" width="60" height="10.4" rx="0" class="s-ink" /><text x="140" y="146.39999999999998" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">HCO3−</text><rect x="110" y="146.6" width="60" height="23.4" rx="0" class="hatch" /><rect x="110" y="146.6" width="60" height="23.4" rx="0" class="s-ink" /><text x="184" y="60" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Gap normal:</text><text x="184" y="76" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">bicarbonate lost</text><text x="184" y="92" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">or diluted;</text><text x="184" y="108" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">chloride takes its</text><text x="184" y="124" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">place in the</text><text x="184" y="140" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">arithmetic.</text><text x="184" y="156" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">Renal dysfunction:</text><text x="184" y="172" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">can do both.</text><line x1="140" y1="162" x2="140" y2="180" class="s-ink" stroke-width="1.2"/><text x="140" y="194" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">gap (hatched)</text><text x="12" y="208" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">cations | anions</text><text x="12" y="226" font-size="13.14" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">Calculated without K+</text></g><g transform="translate(350,573)"><rect x="0" y="0" width="340" height="96" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">Two gaps, opposite directions</text><text x="12" y="44" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Toxic alcohol over time:</text><text x="12" y="62" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">early: parent alcohol → osmolar gap up</text><text x="12" y="80" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">later: acids → anion gap up, osmolar falls</text></g></svg>