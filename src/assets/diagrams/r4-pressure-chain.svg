Higher than left atrial pressure</text><path class="fig-r4-02a-pressure-chain-screen-s-ink" d="M22,167 V792.25" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#fig-r4-02a-pressure-chain-screen-ah)"/><path class="fig-r4-02a-pressure-chain-screen-s-ink" d="M36,792.25 V167" stroke-width="1.2" stroke-linecap="round" marker-end="url(#fig-r4-02a-pressure-chain-screen-ah)"/><path class="fig-r4-02a-pressure-chain-screen-s-ink" d="M72,808.25 V842.25" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fig-r4-02a-pressure-chain-screen-ah)"/><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="82.0" y="826.2" font-size="12.5" font-weight="600" text-anchor="start">Filtration rises with capillary</text><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="82.0" y="842.5" font-size="12.5" font-weight="600" text-anchor="start">pressure</text><rect class="fig-r4-02a-pressure-chain-screen-pn" x="46.0" y="868.8" width="302.0" height="64.8" rx="6"/><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="56.0" y="890.0" font-size="12.5" font-weight="600" text-anchor="start">Interstitium</text><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="56.0" y="906.2" font-size="12.5" text-anchor="start">Lymph flow rises to match filtration,</text><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="56.0" y="922.5" font-size="12.5" text-anchor="start">up to a limit</text><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="46.0" y="951.5" font-size="12.5" font-weight="600" text-anchor="start">When filtration exceeds lymph capacity,</text><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="46.0" y="967.8" font-size="12.5" font-weight="600" text-anchor="start">fluid collects:</text><rect class="fig-r4-02a-pressure-chain-screen-f-tt" x="46.0" y="990.0" width="302.0" height="32.2" rx="6"/><text class="fig-r4-02a-pressure-chain-screen-t-ink" x="56.0" y="1011.2" font-size="12.5" text-anchor="start">1  around the bronchovascular bundles</text