<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 1279" role="img" aria-labelledby="fig-r4-02a-pressure-chain-screen-title" aria-describedby="fig-r4-02a-pressure-chain-screen-desc"><title id="fig-r4-02a-pressure-chain-screen-title">A rise in filling pressure is transmitted back from the left ventricle to the lung capillaries</title><desc id="fig-r4-02a-pressure-chain-screen-desc">A schematic chain of boxes from the left ventricle to the lung capillaries, with no values. A dashed line labeled pressure runs from the left ventricle toward the capillaries, and a separate thin solid line labeled blood flow runs the other way. Left ventricle: LVEDP, the pressure at the end of filling; a filling pressure is not a filling volume. A strip says mean left atrial pressure and LVEDP track reasonably closely with a normal valve, an organized atrial rhythm and a normally compliant atrium, and separate with a narrowed or substantially leaking mitral valve, a stiff or enlarged atrium, lost atrial rhythm, and the point in the cardiac cycle when the pressure is read. Left atrium: left atrial pressure changes through the cardiac cycle; a dashed marker says the wedge pressure estimates left atrial pressure under the right conditions, is not a direct measure of capillary pressure and is not interchangeable with LVEDP. Pulmonary veins: pressure just upstream of the atrium. Lung capillaries: pressure between pulmonary arterial and venous pressure, higher than left atrial pressure. An arrow says filtration rises with capillary pressure and leads to the interstitium, where lymph flow rises to match filtration, up to a limit. When filtration exceeds lymph capacity, fluid collects in three numbered stages: around the bronchovascular bundles, in the alveolar walls, and in the alveoli. A dotted box says the alveolar epithelium transports salt, water follows, and the lymphatics and the circulation remove it. A key says the wedge pressure estimates left atrial pressure, lung ultrasound and imaging see interstitial fluid, and neither measures capillary pressure directly.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-02a-pressure-chain-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r4-02a-pressure-chain-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r4-02a-pressure-chain-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r4-02a-pressure-chain-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r4-02a-pressure-chain-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r4-02a-pressure-chain-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r4-02a-pressure-chain-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r4-02a-pressure-chain-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r4-02a-pressure-chain-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r4-02a-pressure-chain-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r4-02a-pressure-chain-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r4-02a-pressure-chain-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r4-02a-pressure-chain-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r4-02a-pressure-chain-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r4-02a-pressure-chain-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r4-02a-pressure-chain-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r4-02a-pressure-chain-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r4-02a-pressure-chain-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r4-02a-pressure-chain-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r4-02a-pressure-chain-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r4-02a-pressure-chain-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r4-02a-pressure-chain-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-02a-pressure-chain-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-02a-pressure-chain-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-02a-pressu