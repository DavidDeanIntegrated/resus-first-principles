<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="100%" role="img" aria-labelledby="rf3-title rf3-desc"><title id="rf3-title">The respiratory pump: load against capacity</title><desc id="rf3-desc">A balance with load on one side and capacity on the other, tipped toward load: the pump fails when load persistently exceeds its capacity. Load rises with stiffer lungs, narrower airways, intrinsic PEEP, ventilatory demand from fever, acidosis or sepsis, and dead space that forces more ventilation. Capacity falls with hyperinflation, which weakens the diaphragm, electrolyte disturbance, malnutrition, shock limiting muscle blood flow, and neuromuscular disease. Drive is the third element: too low, as in Patient B, or very high, with muscles near their maximum. Rapid shallow breathing reduces the work of each breath but raises the dead-space fraction. A rising PaCO2 often comes late; waiting for it can mean waiting too long.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf3-t-ink{fill:var(--fig-ink,#172d38)}.rf3-t-muted{fill:var(--fig-muted,#526671)}.rf3-t-teal{fill:var(--fig-teal,#077578)}.rf3-t-red{fill:var(--fig-red,#af4639)}.rf3-t-gold{fill:var(--fig-gold,#996613)}.rf3-bg{fill:var(--fig-canvas,#f7f5ef)}.rf3-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.rf3-s-teal{stroke:var(--fig-teal,#077578);fill:none}.rf3-f-teal{fill:var(--fig-teal,#077578)}.rf3-s-red{stroke:var(--fig-red,#af4639);fill:none}.rf3-f-red{fill:var(--fig-red,#af4639)}.rf3-s-gold{stroke:var(--fig-gold,#996613);fill:none}.rf3-f-gold{fill:var(--fig-gold,#996613)}.rf3-s-muted{stroke:var(--fig-muted,#526671);fill:none}.rf3-f-muted{fill:var(--fig-muted,#526671)}.rf3-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.rf3-f-rule{fill:var(--fig-rule,#d5dedc)}.rf3-f-tt{fill:var(--fig-teal-tint,#ddedea)}.rf3-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.rf3-t-ink{fill:var(--fig-ink,#e8dfd0)}.rf3-t-muted{fill:var(--fig-muted,#b3a897)}.rf3-t-teal{fill:var(--fig-teal,#6fb8b0)}.rf3-t-red{fill:var(--fig-red,#e0907f)}.rf3-t-gold{fill:var(--fig-gold,#d9a955)}.rf3-bg{fill:var(--fig-canvas,#25211c)}.rf3-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.rf3-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.rf3-f-teal{fill:var(--fig-teal,#6fb8b0)}.rf3-s-red{stroke:var(--fig-red,#e0907f);fill:none}.rf3-f-red{fill:var(--fig-red,#e0907f)}.rf3-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.rf3-f-gold{fill:var(--fig-gold,#d9a955)}.rf3-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.rf3-f-muted{fill:var(--fig-muted,#b3a897)}.rf3-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.rf3-f-rule{fill:var(--fig-rule,#4a4238)}.rf3-f-tt{fill:var(--fig-teal-tint,#30443f)}.rf3-f-rt{fill:var(--fig-red-tint,#43302a)}}:root[data-theme=dark] svg {}</style><defs><marker id="rf3-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf3-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf3-bg" width="360" height="740"/><text class="rf3-t-teal" x="12" y="24" font-size="12" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf3-t-ink" x="12" y="48" font-size="19" font-weight="600" text-anchor="start">The respiratory pump:</text><text class="rf3-t-ink" x="12" y="72" font-size="19" font-weight="600" text-anchor="start">load against capacity</text><text class="rf3-t-muted" x="12" y="92" font-size="12.5" text-anchor="start">The pump fails when load persistently exceeds</text><text class="rf3-t-muted" x="12" y="108" font-size="12.5" text-anchor="start">its capacity to meet that load.</text><path class="rf3-s-muted" d="M180,210 L164,240 H196 Z" stroke-width="2.5"/><path class="rf3-s-muted" d="M44,228 L316,188" stroke-width="4" stroke-linecap="round"/><rect class="rf3-f-rt" x="30" y="190" width="80" height="36" rx="6"/><text class="rf3-t-red" x="70" y="213" font-size="14" font-weight="600" text-anchor="middle">LOAD</text><rect class="rf3-f-tt" x="250" y="150" width="80" height="36" rx="6"/><text class="rf3-t-teal" x="290" y="173" font-size="13" font-weight="600" text-anchor="middle">CAPACITY</text><text class="rf3-t-ink" x="180" y="262" font-size="12.5" text-anchor="middle">Load heavier: the pump tips toward failure</text><rect class="rf3-pn" x="12" y="282" width="336" height="124" rx="6"/><rect class="rf3-f-red" x="12" y="282" width="5" height="124" rx="2"/><text class="rf3-t-red" x="28" y="304" font-size="15" font-weight="600" text-anchor="start">Load rises with</text><text class="rf3-t-ink" x="28" y="324" font-size="13.5" text-anchor="start">stiffer lungs</text><text class="rf3-t-ink" x="28" y="342" font-size="13.5" text-anchor="start">narrower airways</text><text class="rf3-t-ink" x="28" y="360" font-size="13.5" text-anchor="start">intrinsic PEEP</text><text class="rf3-t-ink" x="28" y="378" font-size="13.5" text-anchor="start">ventilatory demand: fever, acidosis, sepsis</text><text class="rf3-t-ink" x="28" y="396" font-size="13.5" text-anchor="start">dead space forcing more ventilation</text><rect class="rf3-pn" x="12" y="416" width="336" height="106" rx="6"/><rect class="rf3-f-teal" x="12" y="416" width="5" height="106" rx="2"/><text class="rf3-t-teal" x="28" y="438" font-size="15" font-weight="600" text-anchor="start">Capacity falls with</text><text class="rf3-t-ink" x="28" y="458" font-size="13.5" text-anchor="start">hyperinflation (weakens the diaphragm)</text><text class="rf3-t-ink" x="28" y="476" font-size="13.5" text-anchor="start">electrolyte disturbance, malnutrition</text><text class="rf3-t-ink" x="28" y="494" font-size="13.5" text-anchor="start">shock limiting muscle blood flow</text><text class="rf3-t-ink" x="28" y="512" font-size="13.5" text-anchor="start">neuromuscular disease</text><rect class="rf3-pn" x="12" y="532" width="336" height="70" rx="6"/><rect class="rf3-f-gold" x="12" y="532" width="5" height="70" rx="2"/><text class="rf3-t-gold" x="28" y="554" font-size="15" font-weight="600" text-anchor="start">Drive, the third element</text><text class="rf3-t-ink" x="28" y="574" font-size="13.5" text-anchor="start">too low, as in Patient B</text><text class="rf3-t-ink" x="28" y="592" font-size="13.5" text-anchor="start">very high, muscles near their maximum</text><rect class="rf3-f-tt" x="12" y="612" width="336" height="96" rx="6"/><text class="rf3-t-ink" x="24" y="634" font-size="13.5" text-anchor="start">Rapid shallow breathing cuts the work of</text><text class="rf3-t-ink" x="24" y="653" font-size="13.5" text-anchor="start">each breath but raises the dead-space</text><text class="rf3-t-ink" x="24" y="672" font-size="13.5" text-anchor="start">fraction. A rising PaCO2 often comes late;</text><text class="rf3-t-ink" x="24" y="691" font-size="13.5" text-anchor="start">waiting for it can mean waiting too long.</text><text class="rf3-t-muted" x="12" y="728" font-size="12" text-anchor="start">Conceptual balance; no scale. From Part IV.</text></svg>