<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 645.0" width="100%" role="img" aria-labelledby="rf3-title rf3-desc"><title id="rf3-title">The respiratory pump: load against capacity</title><desc id="rf3-desc">One causal loop, read clockwise, under the statement that the pump fails when load persistently exceeds its capacity to meet that load. Load rises, so effort increases; sustained high effort fatigues the muscles; capacity falls; PaCO2 rises; and an arrow labeled acidosis raises ventilatory demand returns to rising load. Load and effort are drawn as solid red boxes, fatigue and falling capacity as dashed teal boxes, and rising PaCO2 as a gold box. Notes accompanying the loop: load rises with stiffer lungs, narrower airways, intrinsic PEEP, ventilatory demand from fever, acidosis or sepsis, and dead space forcing more ventilation. Rapid shallow breathing reduces the work of each breath but raises the dead-space fraction. A rising PaCO2 often comes late; waiting for it can mean waiting too long. Conceptual loop; no scale.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf3-t-ink{fill:var(--fig-ink,#172d38)}.rf3-t-muted{fill:var(--fig-muted,#526671)}.rf3-t-teal{fill:var(--fig-teal,#077578)}.rf3-t-red{fill:var(--fig-red,#af4639)}.rf3-t-gold{fill:var(--fig-gold,#996613)}.rf3-bg{fill:var(--fig-canvas,#f7f5ef)}.rf3-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.rf3-s-teal{stroke:var(--fig-teal,#077578);fill:none}.rf3-f-teal{fill:var(--fig-teal,#077578)}.rf3-s-red{stroke:var(--fig-red,#af4639);fill:none}.rf3-f-red{fill:var(--fig-red,#af4639)}.rf3-s-gold{stroke:var(--fig-gold,#996613);fill:none}.rf3-f-gold{fill:var(--fig-gold,#996613)}.rf3-s-muted{stroke:var(--fig-muted,#526671);fill:none}.rf3-f-muted{fill:var(--fig-muted,#526671)}.rf3-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.rf3-f-rule{fill:var(--fig-rule,#d5dedc)}.rf3-f-tt{fill:var(--fig-teal-tint,#ddedea)}.rf3-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.rf3-t-ink{fill:var(--fig-ink,#e8dfd0)}.rf3-t-muted{fill:var(--fig-muted,#b3a897)}.rf3-t-teal{fill:var(--fig-teal,#6fb8b0)}.rf3-t-red{fill:var(--fig-red,#e0907f)}.rf3-t-gold{fill:var(--fig-gold,#d9a955)}.rf3-bg{fill:var(--fig-canvas,#25211c)}.rf3-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.rf3-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.rf3-f-teal{fill:var(--fig-teal,#6fb8b0)}.rf3-s-red{stroke:var(--fig-red,#e0907f);fill:none}.rf3-f-red{fill:var(--fig-red,#e0907f)}.rf3-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.rf3-f-gold{fill:var(--fig-gold,#d9a955)}.rf3-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.rf3-f-muted{fill:var(--fig-muted,#b3a897)}.rf3-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.rf3-f-rule{fill:var(--fig-rule,#4a4238)}.rf3-f-tt{fill:var(--fig-teal-tint,#30443f)}.rf3-f-rt{fill:var(--fig-red-tint,#43302a)}}:root[data-theme=dark] svg {}</style><defs><marker id="rf3-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf3-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf3-bg" width="360" height="645.0"/><text class="rf3-t-teal" x="12" y="24" font-size="12.5" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf3-t-ink" x="12" y="48" font-size="19" font-weight="600" text-anchor="start">The respiratory pump:</text><text class="rf3-t-ink" x="12" y="72" font-size="19" font-weight="600" text-anchor="start">load against capacity</text><text class="rf3-t-muted" x="12" y="92" font-size="13" text-anchor="start">The pump fails when load persistently exceeds its</text><text class="rf3-t-muted" x="12" y="109" font-size="13" text-anchor="start">capacity to meet that load.</text><path class="rf3-s-muted" d="M208.1,179.0 Q238.8,186.0 252.2,215.0" stroke-width="2.5" marker-end="url(#rf3-ah)"/><path class="rf3-s-muted" d="M280.5,264.0 Q289.6,296.3 272.0,320.0" stroke-width="2.5" marker-end="url(#rf3-ah)"/><path class="rf3-s-muted" d="M205.0,346.0 Q181.7,360.0 158.0,346.0" stroke-width="2.5" marker-end="url(#rf3-ah)"/><path class="rf3-s-muted" d="M88.5,323.0 Q71.0,299.7 80.0,267.0" stroke-width="2.5" marker-end="url(#rf3-ah)"/><path class="rf3-s-muted" d="M104.1,218.0 Q116.9,189.5 148.2,182.0" stroke-width="2.5" marker-end="url(#rf3-ah)"/><rect class="rf3-f-rt" x="120.0" y="136.0" width="120" height="40" rx="8"/><rect class="rf3-s-red" x="120.0" y="136.0" width="120" height="40" rx="8" stroke-width="2"/><text class="rf3-t-red" x="180.0" y="161.0" font-size="14" font-weight="600" text-anchor="middle">Load rises</text><rect class="rf3-f-rt" x="224.0" y="221.0" width="120" height="40" rx="8"/><rect class="rf3-s-red" x="224.0" y="221.0" width="120" height="40" rx="8" stroke-width="2"/><text class="rf3-t-red" x="284.0" y="246.0" font-size="14" font-weight="600" text-anchor="middle">More effort</text><rect class="rf3-f-tt" x="208.0" y="326.0" width="120" height="40" rx="8"/><rect class="rf3-s-teal" x="208.0" y="326.0" width="120" height="40" rx="8" stroke-width="2" stroke-dasharray="5 3"/><text class="rf3-t-teal" x="268.0" y="351.0" font-size="14" font-weight="600" text-anchor="middle">Fatigue</text><rect class="rf3-f-tt" x="32.0" y="326.0" width="120" height="40" rx="8"/><rect class="rf3-s-teal" x="32.0" y="326.0" width="120" height="40" rx="8" stroke-width="2" stroke-dasharray="5 3"/><text class="rf3-t-teal" x="92.0" y="351.0" font-size="14" font-weight="600" text-anchor="middle">Capacity falls</text><rect class="rf3-pn" x="16.0" y="221.0" width="120" height="40" rx="8"/><rect class="rf3-s-gold" x="16.0" y="221.0" width="120" height="40" rx="8" stroke-width="2"/><text class="rf3-t-gold" x="76.0" y="246.0" font-size="14" font-weight="600" text-anchor="middle">PaCO2 rises</text><text class="rf3-t-muted" x="180" y="283.0" font-size="12.5" text-anchor="middle">read</text><text class="rf3-t-muted" x="180" y="299.0" font-size="12.5" text-anchor="middle">clockwise</text><text class="rf3-t-gold" x="133.0" y="206.0" font-size="12.5" text-anchor="start">acidosis raises</text><text class="rf3-t-gold" x="133.0" y="221.5" font-size="12.5" text-anchor="start">ventilatory</text><text class="rf3-t-gold" x="133.0" y="237.0" font-size="12.5" text-anchor="start">demand</text><rect class="rf3-f-tt" x="12" y="380.0" width="336" height="92" rx="6"/><text class="rf3-t-ink" x="24" y="401.0" font-size="13.5" text-anchor="start">Load rises with stiffer lungs, narrower</text><text class="rf3-t-ink" x="24" y="420.0" font-size="13.5" text-anchor="start">airways, intrinsic PEEP, ventilatory demand</text><text class="rf3-t-ink" x="24" y="439.0" font-size="13.5" text-anchor="start">(fever, acidosis, sepsis), and dead space</text><text class="rf3-t-ink" x="24" y="458.0" font-size="13.5" text-anchor="start">forcing more ventilation.</text><rect class="rf3-f-tt" x="12" y="480.0" width="336" height="73" rx="6"/><text class="rf3-t-ink" x="24" y="501.0" font-size="13.5" text-anchor="start">Rapid shallow breathing reduces the work of</text><text class="rf3-t-ink" x="24" y="520.0" font-size="13.5" text-anchor="start">each breath but raises the dead-space</text><text class="rf3-t-ink" x="24" y="539.0" font-size="13.5" text-anchor="start">fraction.</text><rect class="rf3-f-tt" x="12" y="561.0" width="336" height="54" rx="6"/><text class="rf3-t-ink" x="24" y="582.0" font-size="13.5" text-anchor="start">A rising PaCO2 often comes late; waiting for it</text><text class="rf3-t-ink" x="24" y="601.0" font-size="13.5" text-anchor="start">can mean waiting too long.</text><text class="rf3-t-muted" x="12" y="633.0" font-size="12.5" text-anchor="start">Conceptual loop; no scale. From Part IV.</text></svg>