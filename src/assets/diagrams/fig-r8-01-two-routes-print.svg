<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 655" width="6.9in" height="6.46in" role="img" aria-labelledby="fig-r8-01-two-routes-print-title" aria-describedby="fig-r8-01-two-routes-print-desc"><title id="fig-r8-01-two-routes-print-title">Buffers hold acid reversibly; the lungs and kidneys set the balance; metabolism can undo organic acids</title><desc id="fig-r8-01-two-routes-print-desc">Schematic of acid handling, not to scale. Carbon dioxide from metabolism, about 15,000 millimoles a day, and nonvolatile acid, about 50 to 100 millimoles of hydrogen ion a day, enter the extracellular fluid. Inside, two reversible reactions drawn with two-way arrows: carbon dioxide and water forming carbonic acid, hydrogen ion and bicarbonate; and hydrogen ion binding to hemoglobin, proteins and phosphate. A note says buffering binds hydrogen ions reversibly, the acid stays in the body and buffer base is used up. A red-cell inset shows carbon dioxide entering, hydrogen ion binding to hemoglobin and bicarbonate leaving in exchange for chloride. A note shows lactate and ketoacid anions being metabolized back to bicarbonate. Only two arrows leave the body: carbon dioxide exhaled by the lungs in minutes, and ammonium and titratable acid in urine over hours to days, drawn dashed, with new bicarbonate returned to the blood. A corner note reads: pH 7.40 to 7.10 doubles hydrogen ion concentration, from about 40 to about 80 nanomoles per liter.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r8-01-two-routes-print-h)}</style><defs><marker id="fig-r8-01-two-routes-print-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r8-01-two-routes-print-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="700" height="655"/><g transform="translate(10,10)"><text x="0" y="16" font-size="13.14" text-anchor="start" font-weight="700" class="t-teal">ACID–BASE PHYSIOLOGY</text><text x="0" y="40" font-size="20.14" text-anchor="start" font-weight="700" class="t-ink">Buffers hold acid; lungs and</text><text x="0" y="64" font-size="20.14" text-anchor="start" font-weight="700" class="t-ink">kidneys set the balance</text><text x="0" y="88" font-size="13.78" text-anchor="start" font-weight="400" class="t-muted">Schematic, not to scale. ⇌ = reversible reaction;</text><text x="0" y="106" font-size="13.78" text-anchor="start" font-weight="400" class="t-muted">→ = transport; heavy arrows leave the body.</text></g><g transform="translate(10,142)"><rect x="0" y="0" width="340" height="278" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">1. Sources (illustrative values)</text><text x="12" y="42" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">Inputs (solid arrows = transport, seconds to</text><text x="12" y="57" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">minutes):</text><line x1="20" y1="72" x2="20" y2="98" class="s-teal" stroke-width="2" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="32" y="82" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">CO2 from metabolism, about 15,000</text><text x="32" y="97" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">mmol/day (volatile)</text><line x1="20" y1="112" x2="20" y2="138" class="s-red" stroke-width="2" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="32" y="122" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Nonvolatile acid (sulfuric, phosphoric),</text><text x="32" y="137" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">about 50–100 mmol H+/day</text><rect x="12" y="152" width="316" height="104" rx="6" class="pn" stroke-dasharray="2 2"/><text x="22" y="170" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Extracellular fluid</text><text x="22" y="188" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">Lactate and ketoacids: made and used daily;</text><text x="22" y="203" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">metabolizing the anion regenerates HCO3−.</text><path d="M40,222 q40,18 80,0" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><path d="M120,216 q-40,-14 -80,0" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="130" y="226" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">⇌ metabolism (liver, tissues)</text></g><g transform="translate(10,434)"><rect x="0" y="0" width="340" height="207" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">2. Buffer equilibria</text><text x="12" y="46" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">CO2 + H2O ⇌ H2CO3 ⇌ H+ + HCO3−</text><text x="12" y="64" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">bicarbonate pair, pKa 6.1, open at the CO2 end</text><text x="12" y="91" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">H+ + Buf− ⇌ HBuf</text><text x="12" y="109" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">hemoglobin, proteins, phosphate; pKa near 7;</text><text x="12" y="124" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">buffer CO2-derived H+</text><rect x="12" y="139" width="316" height="52" rx="8" class="pn" /><text x="22" y="159" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Buffering binds H+ reversibly. The acid is</text><text x="22" y="174" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">still in the body; buffer base is used up.</text></g><g transform="translate(350,10)"><rect x="0" y="0" width="340" height="192" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">3. Red-cell inset</text><ellipse cx="170" cy="100" rx="120" ry="50" class="s-red" stroke-width="2" stroke-dasharray="1 0"/><text x="170" y="70" font-size="13.14" text-anchor="middle" font-weight="400" class="t-muted">red cell</text><line x1="8" y1="92" x2="60" y2="92" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="10" y="84" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">CO2</text><text x="170" y="94" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">CO2 + H2O ⇌ H+ + HCO3−</text><text x="170" y="110" font-size="13.14" text-anchor="middle" font-weight="400" class="t-muted">(carbonic anhydrase)</text><text x="170" y="128" font-size="13.14" text-anchor="middle" font-weight="400" class="t-ink">H+ + Hb ⇌ HHb</text><line x1="282" y1="98" x2="334" y2="98" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="332" y="90" font-size="13.14" text-anchor="end" font-weight="700" class="t-ink">HCO3−</text><line x1="334" y1="124" x2="286" y2="124" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="332" y="142" font-size="13.14" text-anchor="end" font-weight="700" class="t-ink">Cl−</text><text x="12" y="170" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">Paired transport arrows: chloride shift</text></g><g transform="translate(350,216)"><rect x="0" y="0" width="340" height="240" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">4. Exits: only two cross the body</text><line x1="250" y1="34" x2="250" y2="190" class="s-ink" stroke-width="2.5" stroke-dasharray="2 3"/><text x="328" y="40" font-size="13.14" text-anchor="end" font-weight="400" class="t-muted">body outline</text><text x="12" y="48" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Lung</text><line x1="60" y1="60" x2="330" y2="60" class="s-teal" stroke-width="4" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="12" y="80" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">CO2 exhaled, minutes (solid)</text><text x="12" y="96" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">Lungs excrete CO2; no nonvolatile</text><text x="12" y="111" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">acid leaves this way.</text><text x="12" y="138" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Kidney</text><line x1="70" y1="150" x2="330" y2="150" class="s-gold" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="12" y="170" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">NH4+ and titratable acid in urine,</text><text x="12" y="185" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">hours to days (dashed)</text><line x1="200" y1="204" x2="40" y2="204" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-01-two-routes-print-ar)"/><text x="44" y="220" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">new HCO3− to blood</text></g><g transform="translate(350,470)"><rect x="0" y="0" width="340" height="86" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">Corner note</text><text x="12" y="44" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">pH 7.40 → 7.10: [H+] about 40 → 80 nmol/L</text><text x="12" y="59" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">(doubles).</text></g></svg>