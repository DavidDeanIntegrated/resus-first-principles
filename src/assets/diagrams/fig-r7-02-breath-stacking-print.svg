<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 558" width="6.9in" height="5.50in" role="img" aria-labelledby="fig-r7-02-breath-stacking-print-title" aria-describedby="fig-r7-02-breath-stacking-print-desc"><title id="fig-r7-02-breath-stacking-print-title">When the next breath comes before the lung has emptied</title><desc id="fig-r7-02-breath-stacking-print-desc">Two volume-over-time traces of successive breaths. In the top trace, each exhalation returns to the dashed FRC baseline. In the bottom trace, each exhalation is cut short, so end-expiratory volume ratchets up to a new, higher steady state; the trapped volume between the baseline and the end-expiratory volume is hatched. A stacked bar, with illustrative numbers, shows the inspiratory pressure the muscles must make: 10 cm H2O of intrinsic PEEP, spent before any inflow begins, plus 10 cm H2O for the breath itself, 20 in total, half of it spent before any gas enters, compared with 10 without intrinsic PEEP; all numbers illustrative. Two small alveoli show a fast unit that empties in time and a slow unit with a long time constant that does not finish.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r7-02-breath-stacking-print-h)}</style><defs><marker id="fig-r7-02-breath-stacking-print-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r7-02-breath-stacking-print-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="700" height="558"/><g transform="translate(10,10)"><text x="0" y="16" font-size="12.4" text-anchor="start" font-weight="700" class="t-teal">LIFE-THREATENING ASTHMA</text><text x="0" y="40" font-size="19" text-anchor="start" font-weight="700" class="t-ink">When the next breath comes</text><text x="0" y="64" font-size="19" text-anchor="start" font-weight="700" class="t-ink">before the lung has emptied</text><text x="0" y="88" font-size="13" text-anchor="start" font-weight="400" class="t-muted">Lung volume over successive breaths (schematic).</text></g><g transform="translate(10,124)"><rect x="0" y="0" width="340" height="150" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Enough time: back to baseline</text><line x1="20" y1="120" x2="330" y2="120" class="s-muted" stroke-width="1.5" stroke-dasharray="5 3"/><text x="330" y="136" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">FRC (baseline)</text><path d="M24,120 L46,65 L84,120 L106,65 L144,120 L166,65 L204,120 L226,65 L264,120 L286,65 L324,120" class="s-teal" stroke-width="2.5"/><text x="176" y="40" font-size="12.4" text-anchor="middle" font-weight="400" class="t-ink">each exhalation returns to FRC</text></g><g transform="translate(350,124)"><rect x="0" y="0" width="340" height="150" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Too little time: breaths stack</text><line x1="20" y1="120" x2="330" y2="120" class="s-muted" stroke-width="1.5" stroke-dasharray="5 3"/><text x="330" y="136" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">FRC (baseline)</text><path d="M24,120 L84,107 L144,94 L204,82 L264,82 L324,82 L324,120 Z" class="hatch" opacity="0.8"/><text x="24" y="136" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">hatched: trapped volume</text><text x="330" y="22" font-size="12.4" text-anchor="end" font-weight="400" class="t-ink">→ new steady state</text><path d="M24,120 L46,65 L84,107 L106,52 L144,94 L166,39 L204,82 L226,27 L264,82 L286,27 L324,82" class="s-teal" stroke-width="2.5"/></g><g transform="translate(10,288)"><rect x="0" y="0" width="340" height="256" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">The cost: work without flow</text><text x="12" y="40" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">Inspiratory pressure the muscles must make</text><text x="12" y="55" font-size="12.4" text-anchor="start" font-weight="400" font-style="italic" class="t-muted">(illustrative numbers)</text><rect x="40" y="140" width="70" height="60" class="hatch" stroke-width="1.5"/><rect x="40" y="140" width="70" height="60" rx="0" class="s-ink" /><rect x="40" y="80" width="70" height="60" rx="0" class="f-teal" /><rect x="40" y="80" width="70" height="120" rx="0" class="s-ink" /><text x="122" y="115" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">10 cm H2O for the breath</text><text x="122" y="130" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">itself (illustrative)</text><text x="122" y="166" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">10 cm H2O intrinsic PEEP</text><text x="122" y="181" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">(illustrative): spent before</text><text x="122" y="196" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">any inflow begins</text><line x1="20" y1="200" x2="330" y2="200" class="s-ink" stroke-width="1.5"/><text x="12" y="222" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">Total 20 cm H2O, half spent before any gas</text><text x="12" y="238" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">enters; without intrinsic PEEP, 10 (illustrative).</text></g><g transform="translate(350,288)"><rect x="0" y="0" width="340" height="112" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Why: units empty at different speeds</text><circle cx="40" cy="62" r="18" class="s-teal" stroke-width="2"/><text x="64" y="58" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">fast unit:</text><text x="64" y="73" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">empties in time</text><circle cx="190" cy="62" r="22" class="hatch"/><circle cx="190" cy="62" r="22" class="s-ink" stroke-width="2" stroke-dasharray="4 2"/><text x="218" y="58" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">slow unit:</text><text x="218" y="73" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">does not finish</text><text x="218" y="88" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">(long time constant)</text></g></svg>