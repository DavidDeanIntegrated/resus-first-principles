<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 697" role="img" aria-labelledby="fig-r4-03-pleural-pressure-screen-title" aria-describedby="fig-r4-03-pleural-pressure-screen-desc"><title id="fig-r4-03-pleural-pressure-screen-title">Breathing hard loads the left ventricle</title><desc id="fig-r4-03-pleural-pressure-screen-desc">Two schematic drawings of a heart inside the chest. In the first, labeled labored breathing, arrows point outward from the heart to show pleural pressure falling well below atmospheric; the ventricle must generate more transmural pressure, so its load rises. In the second, labeled positive pressure, arrows point inward toward the heart to show slightly positive pleural pressure; the gap between inside and outside is smaller, so the load falls. A note reads: at the same arterial pressure, positive pressure lowers the load on the left ventricle; the direction is the point. Schematic; no values are shown.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-03-pleural-pressure-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r4-03-pleural-pressure-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r4-03-pleural-pressure-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r4-03-pleural-pressure-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r4-03-pleural-pressure-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r4-03-pleural-pressure-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r4-03-pleural-pressure-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r4-03-pleural-pressure-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r4-03-pleural-pressure-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r4-03-pleural-pressure-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r4-03-pleural-pressure-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r4-03-pleural-pressure-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r4-03-pleural-pressure-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r4-03-pleural-pressure-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r4-03-pleural-pressure-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r4-03-pleural-pressure-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r4-03-pleural-pressure-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r4-03-pleural-pressure-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r4-03-pleural-pressure-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r4-03-pleural-pressure-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r4-03-pleural-pressure-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r4-03-pleural-pressure-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-03-pleural-pressure-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-03-pleural-pressure-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-03-pleural-pressure-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r4-03-pleural-pressure-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r4-03-pleural-pressure-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r4-03-pleural-pressure-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r4-03-pleural-pressure-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r4-03-pleural-pressure-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-03-pleural-pressure-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r4-03-pleural-pressure-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r4-03-pleural-pressure-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r4-03-pleural-pressure-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r4-03-pleural-pressure-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r4-03-pleural-pressure-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-03-pleural-pressure-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r4-03-pleural-pressure-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r4-03-pleural-pressure-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r4-03-pleural-pressure-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-03-pleural-pressure-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r4-03-pleural-pressure-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r4-03-pleural-pressure-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-03-pleural-pressure-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-03-pleural-pressure-screen-bg" width="360" height="697"/><text class="fig-r4-03-pleural-pressure-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">Breathing hard loads</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="12.0" y="74.0" font-size="19" font-weight="600" text-anchor="start">the left ventricle</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="12.0" y="94.0" font-size="12.5" text-anchor="start">Schematic; direction only;</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="12.0" y="111.0" font-size="12.5" text-anchor="start">no values are shown.</text><rect class="fig-r4-03-pleural-pressure-screen-pn" x="12.0" y="134.0" width="336.0" height="230.0" rx="6"/><rect class="fig-r4-03-pleural-pressure-screen-f-red" x="12.0" y="134.0" width="5" height="230.0" rx="2"/><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="28.0" y="158.0" font-size="15" font-weight="600" text-anchor="start">Labored breathing</text><rect class="fig-r4-03-pleural-pressure-screen-f-tt" x="34" y="182" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-screen-f-red" cx="96" cy="234" r="24" opacity="0.85"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M66,234.0 L46,234.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M126,234.0 L146,234.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M96,210.0 L96,194.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M96,258.0 L96,274.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="172.0" y="204.0" font-size="12.5" text-anchor="start">Pleural pressure falls</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="172.0" y="220.0" font-size="12.5" text-anchor="start">well below atmospheric</text><text class="fig-r4-03-pleural-pressure-screen-t-red" x="28.0" y="306.0" font-size="13" font-weight="600" text-anchor="start">Ventricle must generate</text><text class="fig-r4-03-pleural-pressure-screen-t-red" x="28.0" y="323.0" font-size="13" font-weight="600" text-anchor="start">more transmural pressure:</text><text class="fig-r4-03-pleural-pressure-screen-t-red" x="28.0" y="340.0" font-size="13" font-weight="600" text-anchor="start">more load</text><rect class="fig-r4-03-pleural-pressure-screen-pn" x="12.0" y="374.0" width="336.0" height="230.0" rx="6"/><rect class="fig-r4-03-pleural-pressure-screen-f-teal" x="12.0" y="374.0" width="5" height="230.0" rx="2"/><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="28.0" y="398.0" font-size="15" font-weight="600" text-anchor="start">Positive pressure</text><rect class="fig-r4-03-pleural-pressure-screen-f-tt" x="34" y="422" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-screen-f-teal" cx="96" cy="474" r="24" opacity="0.85"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M44,474.0 L64,474.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M148,474.0 L128,474.0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M96,432.4 L96,448.4" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M96,515.6 L96,499.6" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="172.0" y="444.0" font-size="12.5" text-anchor="start">Pleural pressure</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="172.0" y="460.0" font-size="12.5" text-anchor="start">slightly positive</text><text class="fig-r4-03-pleural-pressure-screen-t-teal" x="28.0" y="546.0" font-size="13" font-weight="600" text-anchor="start">Smaller gap inside</text><text class="fig-r4-03-pleural-pressure-screen-t-teal" x="28.0" y="563.0" font-size="13" font-weight="600" text-anchor="start">to outside: less load</text><rect class="fig-r4-03-pleural-pressure-screen-f-tt" x="12.0" y="616.0" width="336.0" height="69.0" rx="6"/><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="24.0" y="636.0" font-size="13" text-anchor="start">At the same arterial pressure, positive</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="24.0" y="653.0" font-size="13" text-anchor="start">pressure lowers the load on the left</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="24.0" y="670.0" font-size="13" text-anchor="start">ventricle. The direction is the point.</text></svg>