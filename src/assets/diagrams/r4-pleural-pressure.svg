<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 671" role="img" aria-labelledby="fig-r4-03-pleural-pressure-screen-title" aria-describedby="fig-r4-03-pleural-pressure-screen-desc"><title id="fig-r4-03-pleural-pressure-screen-title">Transmural pressure on the left ventricle: labored breathing versus positive pressure</title><desc id="fig-r4-03-pleural-pressure-screen-desc">Two side-by-side drawings of a heart inside the chest, both at peak systole during inspiration and with the same systolic pressure. In the left drawing, labeled labored breathing, arrows point outward from the heart to show pleural pressure falling well below atmospheric, and a label reads higher transmural pressure. In the right drawing, labeled positive pressure, a flat baseline marked approximately zero shows pleural pressure near atmospheric at the same point in the breath, and a label reads lower transmural pressure. No other values are shown.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-03-pleural-pressure-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r4-03-pleural-pressure-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r4-03-pleural-pressure-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r4-03-pleural-pressure-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r4-03-pleural-pressure-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r4-03-pleural-pressure-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r4-03-pleural-pressure-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r4-03-pleural-pressure-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r4-03-pleural-pressure-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r4-03-pleural-pressure-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r4-03-pleural-pressure-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r4-03-pleural-pressure-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r4-03-pleural-pressure-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r4-03-pleural-pressure-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r4-03-pleural-pressure-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r4-03-pleural-pressure-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r4-03-pleural-pressure-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r4-03-pleural-pressure-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r4-03-pleural-pressure-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r4-03-pleural-pressure-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r4-03-pleural-pressure-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r4-03-pleural-pressure-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-03-pleural-pressure-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-03-pleural-pressure-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-03-pleural-pressure-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r4-03-pleural-pressure-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r4-03-pleural-pressure-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r4-03-pleural-pressure-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r4-03-pleural-pressure-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r4-03-pleural-pressure-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-03-pleural-pressure-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r4-03-pleural-pressure-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r4-03-pleural-pressure-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r4-03-pleural-pressure-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r4-03-pleural-pressure-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r4-03-pleural-pressure-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-03-pleural-pressure-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r4-03-pleural-pressure-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r4-03-pleural-pressure-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r4-03-pleural-pressure-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-03-pleural-pressure-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r4-03-pleural-pressure-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r4-03-pleural-pressure-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-03-pleural-pressure-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-03-pleural-pressure-screen-bg" width="360" height="671"/><text class="fig-r4-03-pleural-pressure-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">Transmural pressure on the left</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="12.0" y="74.0" font-size="19" font-weight="600" text-anchor="start">ventricle: labored breathing</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="12.0" y="98.0" font-size="19" font-weight="600" text-anchor="start">versus positive pressure</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="12.0" y="124.0" font-size="12.5" text-anchor="start">Same instant: peak systole during</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="12.0" y="140.2" font-size="12.5" text-anchor="start">inspiration; same assumed systolic pressure</text><rect class="fig-r4-03-pleural-pressure-screen-pn" x="12.0" y="164.5" width="336.0" height="220.0" rx="6"/><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="26.0" y="188.5" font-size="15" font-weight="600" text-anchor="start">Labored breathing</text><rect class="fig-r4-03-pleural-pressure-screen-f-tt" x="34" y="212.5" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-screen-f-rt" cx="96" cy="264.5" r="24"/><circle class="fig-r4-03-pleural-pressure-screen-s-ink" cx="96" cy="264.5" r="24" stroke-width="2"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M66,264.5 L44,264.5" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M126,264.5 L148,264.5" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M96,240.5 L96,222.9" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M96,288.5 L96,306.1" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-03-pleural-pressure-screen-ah)"/><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="182.0" y="230.5" font-size="12.5" text-anchor="start">Pleural pressure</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="182.0" y="246.8" font-size="12.5" text-anchor="start">well below</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="182.0" y="263.0" font-size="12.5" text-anchor="start">atmospheric</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="26.0" y="350.5" font-size="13" font-weight="600" text-anchor="start">Higher transmural pressure</text><rect class="fig-r4-03-pleural-pressure-screen-pn" x="12.0" y="394.5" width="336.0" height="220.0" rx="6"/><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="26.0" y="418.5" font-size="15" font-weight="600" text-anchor="start">Positive pressure</text><rect class="fig-r4-03-pleural-pressure-screen-f-tt" x="34" y="442.5" width="124" height="104" rx="40"/><circle class="fig-r4-03-pleural-pressure-screen-f-rt" cx="96" cy="494.5" r="24"/><circle class="fig-r4-03-pleural-pressure-screen-s-ink" cx="96" cy="494.5" r="24" stroke-width="2"/><path class="fig-r4-03-pleural-pressure-screen-s-ink" d="M40,534.5 H152" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="154.0" y="538.5" font-size="13" font-weight="600" text-anchor="start">≈ 0</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="182.0" y="460.5" font-size="12.5" text-anchor="start">Pleural pressure</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="182.0" y="476.8" font-size="12.5" text-anchor="start">near atmospheric at</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="182.0" y="493.0" font-size="12.5" text-anchor="start">the same point in</text><text class="fig-r4-03-pleural-pressure-screen-t-muted" x="182.0" y="509.2" font-size="12.5" text-anchor="start">the breath</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="26.0" y="580.5" font-size="13" font-weight="600" text-anchor="start">Lower transmural pressure</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="12.0" y="632.5" font-size="12.5" text-anchor="start">Direction only; not a measure of total</text><text class="fig-r4-03-pleural-pressure-screen-t-ink" x="12.0" y="648.8" font-size="12.5" text-anchor="start">afterload; no values are shown.</text></svg>