<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 753" width="6.9in" height="7.42in" role="img" aria-labelledby="fig-r8-04-renal-bicarbonate-print-title" aria-describedby="fig-r8-04-renal-bicarbonate-print-desc"><title id="fig-r8-04-renal-bicarbonate-print-title">Reclaiming filtered bicarbonate prevents loss; only acid leaving on urinary buffers adds new bicarbonate</title><desc id="fig-r8-04-renal-bicarbonate-print-desc">Two tubule-cell panels, urine side on the left and blood on the right, illustrative values. Panel 1, reclamation: about 4,300 millimoles of bicarbonate are filtered daily. The cell secretes a hydrogen ion in exchange for sodium; in the lumen it combines with filtered bicarbonate to form carbonic acid, then carbon dioxide and water; carbon dioxide enters the cell and re-forms hydrogen ion and bicarbonate; bicarbonate crosses to the blood and the hydrogen ion is secreted again, drawn as a loop labeled recycled. Nothing leaves in urine; net acid excreted is zero. Panel 2, new bicarbonate: secreted hydrogen ion binds filtered phosphate, leaving in urine as titratable acid, and glutamine metabolism yields ammonium, which leaves in urine, each with a new bicarbonate sent to the blood. A note says ammonium counts only if excreted. A box notes that free hydrogen ion at urine pH 4.5 is only about 0.03 millimoles per liter, about 0.05 millimoles a day, roughly one fifteen-hundredth of a 70 millimole load. A footer reads: net acid excretion equals ammonium plus titratable acid minus urinary bicarbonate, and develops over days.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r8-04-renal-bicarbonate-print-h)}</style><defs><marker id="fig-r8-04-renal-bicarbonate-print-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r8-04-renal-bicarbonate-print-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="700" height="753"/><g transform="translate(10,10)"><text x="0" y="16" font-size="13.14" text-anchor="start" font-weight="700" class="t-teal">ACID–BASE PHYSIOLOGY</text><text x="0" y="40" font-size="20.14" text-anchor="start" font-weight="700" class="t-ink">Reclaiming bicarbonate vs</text><text x="0" y="64" font-size="20.14" text-anchor="start" font-weight="700" class="t-ink">making new bicarbonate</text><text x="0" y="88" font-size="13.78" text-anchor="start" font-weight="400" class="t-muted">Urine side left, blood right. → = transport;</text><text x="0" y="106" font-size="13.78" text-anchor="start" font-weight="400" class="t-muted">⇌ = reversible; heavy ↓ = leaves in urine.</text></g><g transform="translate(10,142)"><rect x="0" y="0" width="340" height="378" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">1. Reclaiming filtered HCO3−</text><text x="12" y="40" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">Stops a loss, excretes nothing.</text><text x="328" y="40" font-size="13.14" text-anchor="end" font-weight="400" font-style="italic" class="t-muted">Illustrative values</text><text x="12" y="58" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">Filtered HCO3− in lumen: about 4,300 mmol/day</text><text x="12" y="73" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">at GFR 180 L/day.</text><rect x="118" y="108" width="110" height="150" rx="10" class="pn" stroke-width="2"/><text x="62" y="100" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">lumen (urine)</text><text x="180" y="100" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">tubule cell</text><text x="300" y="100" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">blood</text><line x1="124" y1="134" x2="30" y2="134" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="77.0" y="129" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">H+</text><line x1="30" y1="160" x2="124" y2="160" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="77.0" y="155" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">Na+</text><line x1="30" y1="186" x2="124" y2="186" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="77.0" y="181" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">CO2</text><line x1="224" y1="212" x2="318" y2="212" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="271.0" y="207" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">HCO3−</text><path d="M130,190 C215,196 215,138 130,138" class="s-ink" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="173" y="248" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">H+ recycled</text><text x="12" y="280" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Lumen: H+ + HCO3− ⇌ H2CO3 ⇌ CO2 + H2O</text><text x="24" y="295" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">brush-border carbonic anhydrase</text><text x="12" y="314" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Cell: CO2 + H2O ⇌ H+ + HCO3−</text><rect x="12" y="334" width="140" height="30" rx="4" class="pn" /><text x="20" y="354" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">urine: nothing</text><text x="164" y="354" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">net acid excreted: 0</text></g><g transform="translate(350,10)"><rect x="0" y="0" width="340" height="601" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">2. Making new HCO3−</text><text x="12" y="40" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">H+ must leave on a carrier.</text><text x="328" y="40" font-size="13.14" text-anchor="end" font-weight="400" font-style="italic" class="t-muted">Illustrative values</text><text x="12" y="62" font-size="13.14" text-anchor="start" font-weight="700" class="t-teal">a. Titratable acid (collecting duct)</text><rect x="118" y="86" width="110" height="80" rx="10" class="pn" stroke-width="2"/><text x="62" y="78" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">lumen (urine)</text><text x="180" y="78" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">tubule cell</text><text x="300" y="78" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">blood</text><line x1="124" y1="110" x2="30" y2="110" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="77.0" y="105" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">H+</text><line x1="224" y1="136" x2="318" y2="136" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="271.0" y="131" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">new HCO3−</text><line x1="60" y1="92" x2="60" y2="178" class="s-ink" stroke-width="4" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="66" y="180" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">H2PO4− in urine</text><text x="12" y="206" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Cell: CO2 + H2O ⇌ H+ + HCO3−</text><text x="24" y="221" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">(carbonic anhydrase)</text><text x="24" y="236" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">H+ to lumen, HCO3− to blood</text><text x="12" y="257" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Lumen: H+ + HPO4²− ⇌ H2PO4−</text><text x="24" y="273" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">pKa 6.8: about 20% acid form at pH 7.4,</text><text x="24" y="288" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">about 95% at pH 5.5</text><text x="12" y="313" font-size="13.14" text-anchor="start" font-weight="700" class="t-teal">b. Ammonium (proximal ammoniagenesis)</text><rect x="118" y="343" width="110" height="80" rx="10" class="pn" stroke-width="2"/><text x="62" y="335" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">lumen (urine)</text><text x="180" y="335" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">tubule cell</text><text x="300" y="335" font-size="13.14" text-anchor="middle" font-weight="700" class="t-muted">blood</text><text x="172" y="369" font-size="13.14" text-anchor="middle" font-weight="400" class="t-ink">glutamine →</text><text x="172" y="384" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">NH4+ + HCO3−</text><line x1="124" y1="401" x2="30" y2="401" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="77.0" y="396" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">NH4+</text><line x1="224" y1="401" x2="318" y2="401" class="s-ink" stroke-width="1.8" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="271.0" y="396" font-size="13.14" text-anchor="middle" font-weight="700" class="t-ink">new HCO3−</text><line x1="60" y1="407" x2="60" y2="435" class="s-ink" stroke-width="4" marker-end="url(#fig-r8-04-renal-bicarbonate-print-ar)"/><text x="66" y="437" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">NH4+ in urine</text><text x="12" y="459" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">Glutamine yields 2 NH4+ and 2 HCO3−. Counts as</text><text x="12" y="474" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">new HCO3− only if NH4+ is excreted, not</text><text x="12" y="489" font-size="13.14" text-anchor="start" font-weight="400" class="t-muted">returned to the liver for urea.</text><rect x="12" y="504" width="316" height="68" rx="4" class="pn" /><text x="20" y="522" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Urine outlet</text><text x="20" y="538" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">Free H+ at pH 4.5: about 0.03 mmol/L, about</text><text x="20" y="553" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">0.05 mmol/day in 1.5 L, roughly 1/1,500 of a</text><text x="20" y="568" font-size="13.14" text-anchor="start" font-weight="400" class="t-ink">70 mmol load.</text></g><g transform="translate(350,625)"><rect x="0" y="0" width="340" height="114" rx="6" class="pn" /><text x="12" y="22" font-size="14.84" text-anchor="start" font-weight="700" class="t-ink">Footer</text><text x="12" y="44" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">Net acid excretion = NH4+ + titratable acid −</text><text x="12" y="59" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">urinary HCO3−. Each unit = one new HCO3− in</text><text x="12" y="74" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">blood. Develops over days (hours to days,</text><text x="12" y="89" font-size="13.14" text-anchor="start" font-weight="700" class="t-ink">dashed in Fig. A).</text></g></svg>