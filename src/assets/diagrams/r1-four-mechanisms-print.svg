<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 784" width="100%" role="img" aria-labelledby="rf1p-title rf1p-desc"><title id="rf1p-title">Five mechanisms of hypoxemia, and how each responds to oxygen</title><desc id="rf1p-desc">Five schematic lung units, each with its A–a gradient on room air, response to supplemental oxygen, and typical PaCO2. Hypoventilation, drawn as a dashed alveolus with a normal lung: A–a normal, unless lung disease coexists; oxygen corrects easily but does not correct the hypoventilation; PaCO2 high. Low V/Q mismatch: a thin gas arrow reaches the alveolus, but the blood leaving it is drawn tinted, incompletely oxygenated; A–a widened; usually responds to modest oxygen; PaCO2 normal or low, can rise in advanced disease. Shunt: the alveolus is filled and crossed out, no gas arrow reaches it, and the blood passes through unchanged, drawn the same color entering and leaving; A–a widened, often greatly; response to oxygen limited, and smaller as shunt grows, but it does not measure shunt fraction; PaCO2 normal or low, rises if the pump fails. Under the shunt row: 30% shunt, illustrative: PaO2 about 58 on room air, under 150 on 100% O2, not over 400. Diffusion limitation, a thickened alveolar wall: A–a widened; usually corrects; PaCO2 normal or low. Low inspired oxygen, environmental, not a lung mechanism, drawn as a normal alveolus with low-oxygen gas: A–a normal; corrects; PaCO2 often low. The three illustrative patients on room air: A, pneumonia, PaO2 55 and PaCO2 32 mm Hg, A–a about 55, the lung fails to transfer. B, opioid hypoventilation, PaCO2 70, PAO2 about 62, PaO2 56, A–a about 6, normal, pH about 7.21, SpO2 about 80 percent. C, COPD, PaCO2 62, pH 7.31, PaO2 56, hypoventilation dominant; A–a about 16, inside the rough age-expected range of about 21. Schematic units, not anatomy.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf1p-t-ink{fill:#172d38}.rf1p-t-muted{fill:#526671}.rf1p-t-teal{fill:#077578}.rf1p-t-red{fill:#af4639}.rf1p-t-gold{fill:#996613}.rf1p-bg{fill:#ffffff}.rf1p-pn{fill:#ffffff;stroke:#d5dedc}.rf1p-s-teal{stroke:#077578;fill:none}.rf1p-f-teal{fill:#077578}.rf1p-s-red{stroke:#af4639;fill:none}.rf1p-f-red{fill:#af4639}.rf1p-s-gold{stroke:#996613;fill:none}.rf1p-f-gold{fill:#996613}.rf1p-s-muted{stroke:#526671;fill:none}.rf1p-f-muted{fill:#526671}.rf1p-s-rule{stroke:#d5dedc;fill:none}.rf1p-f-rule{fill:#d5dedc}.rf1p-f-tt{fill:#ddedea}.rf1p-f-rt{fill:#f5e4df}</style><defs><marker id="rf1p-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf1p-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf1p-bg" width="700" height="784"/><text class="rf1p-t-teal" x="16" y="24" font-size="13" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf1p-t-ink" x="16" y="48" font-size="20" font-weight="600" text-anchor="start">Five mechanisms of hypoxemia</text><text class="rf1p-t-muted" x="16" y="72" font-size="13" text-anchor="start">Dominant patterns; real patients mix them.</text><rect class="rf1p-pn" x="16.0" y="88" width="328.0" height="162" rx="6"/><rect class="rf1p-f-teal" x="16.0" y="88" width="5" height="162" rx="2"/><circle class="rf1p-s-teal" cx="310.0" cy="122" r="13.0" stroke-width="2.5" stroke-dasharray="4 3"/><path class="rf1p-s-teal" d="M310.0,95.0 V106.0" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#rf1p-ah)"/><path class="rf1p-s-muted" d="M286.0,141.0 H310.0" stroke-width="5"/><path class="rf1p-s-red" d="M310.0,141.0 H334.0" stroke-width="5"/><path class="rf1p-s-muted" d="M332.0,141.0 H340.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><text class="rf1p-t-teal" x="32.0" y="110" font-size="16" font-weight="600" text-anchor="start">Hypoventilation</text><text class="rf1p-t-muted" x="32.0" y="128" font-size="13" text-anchor="start">lung normal, too little air moving</text><text class="rf1p-t-ink" x="32.0" y="149" font-size="13.5" text-anchor="start">A–a gradient: Normal, unless lung</text><text class="rf1p-t-ink" x="32.0" y="167" font-size="13.5" text-anchor="start">disease coexists</text><text class="rf1p-t-ink" x="32.0" y="185" font-size="13.5" text-anchor="start">Oxygen: Corrects easily; does not</text><text class="rf1p-t-ink" x="32.0" y="203" font-size="13.5" text-anchor="start">correct the hypoventilation</text><text class="rf1p-t-ink" x="32.0" y="221" font-size="13.5" text-anchor="start">PaCO2: High</text><rect class="rf1p-pn" x="356.0" y="88" width="328.0" height="162" rx="6"/><rect class="rf1p-f-gold" x="356.0" y="88" width="5" height="162" rx="2"/><path class="rf1p-s-gold" d="M650.0,93.0 V106.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><circle class="rf1p-s-gold" cx="650.0" cy="122" r="13.0" stroke-width="2.5"/><path class="rf1p-s-muted" d="M626.0,141.0 H650.0" stroke-width="5"/><rect class="rf1p-f-rt" x="650.0" y="137.5" width="24.0" height="7"/><path class="rf1p-s-red" d="M650.0,137.5 H674.0" stroke-width="3.5"/><path class="rf1p-s-muted" d="M672.0,141.0 H680.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><text class="rf1p-t-gold" x="372.0" y="110" font-size="16" font-weight="600" text-anchor="start">Low V/Q mismatch</text><text class="rf1p-t-muted" x="372.0" y="128" font-size="13" text-anchor="start">some fresh gas, not enough for the</text><text class="rf1p-t-muted" x="372.0" y="145" font-size="13" text-anchor="start">blood</text><text class="rf1p-t-ink" x="372.0" y="166" font-size="13.5" text-anchor="start">A–a gradient: Widened</text><text class="rf1p-t-ink" x="372.0" y="184" font-size="13.5" text-anchor="start">Oxygen: Usually responds to modest</text><text class="rf1p-t-ink" x="372.0" y="202" font-size="13.5" text-anchor="start">oxygen</text><text class="rf1p-t-ink" x="372.0" y="220" font-size="13.5" text-anchor="start">PaCO2: Normal or low; can rise in</text><text class="rf1p-t-ink" x="372.0" y="238" font-size="13.5" text-anchor="start">advanced disease</text><rect class="rf1p-pn" x="16.0" y="258" width="328.0" height="245" rx="6"/><rect class="rf1p-f-red" x="16.0" y="258" width="5" height="245" rx="2"/><circle class="rf1p-s-red" cx="310.0" cy="292" r="13.0" stroke-width="2.5"/><circle class="rf1p-f-rt" cx="310.0" cy="292" r="11.5"/><path class="rf1p-s-red" d="M300.9,282.9 L319.1,301.1 M319.1,282.9 L300.9,301.1" stroke-width="2.5" stroke-linecap="round"/><path class="rf1p-s-muted" d="M286.0,311.0 H334.0" stroke-width="5"/><path class="rf1p-s-muted" d="M332.0,311.0 H340.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><text class="rf1p-t-red" x="32.0" y="280" font-size="16" font-weight="600" text-anchor="start">Shunt</text><text class="rf1p-t-muted" x="32.0" y="298" font-size="13" text-anchor="start">no inspired gas arrives; blood passes</text><text class="rf1p-t-muted" x="32.0" y="315" font-size="13" text-anchor="start">unchanged</text><text class="rf1p-t-ink" x="32.0" y="336" font-size="13.5" text-anchor="start">A–a gradient: Widened, often greatly</text><text class="rf1p-t-ink" x="32.0" y="354" font-size="13.5" text-anchor="start">Oxygen: Limited, and smaller as</text><text class="rf1p-t-ink" x="32.0" y="372" font-size="13.5" text-anchor="start">shunt grows; does not measure</text><text class="rf1p-t-ink" x="32.0" y="390" font-size="13.5" text-anchor="start">shunt fraction</text><text class="rf1p-t-ink" x="32.0" y="408" font-size="13.5" text-anchor="start">PaCO2: Normal or low; rises if the</text><text class="rf1p-t-ink" x="32.0" y="426" font-size="13.5" text-anchor="start">pump fails</text><g id="shunt-line-print" data-slot="shunt-line"><path class="rf1p-s-red" d="M32.0,438 H328.0" stroke-width="1" stroke-dasharray="3 3"/><text class="rf1p-t-red" x="32.0" y="456" font-size="13" font-weight="600" text-anchor="start">30% shunt (illustrative): PaO2 about 58</text><text class="rf1p-t-red" x="32.0" y="473" font-size="13" font-weight="600" text-anchor="start">on room air, under 150 on 100% O2, not</text><text class="rf1p-t-red" x="32.0" y="490" font-size="13" font-weight="600" text-anchor="start">over 400.</text></g><rect class="rf1p-pn" x="356.0" y="258" width="328.0" height="245" rx="6"/><rect class="rf1p-f-muted" x="356.0" y="258" width="5" height="245" rx="2"/><circle class="rf1p-s-muted" cx="650.0" cy="292" r="13.0" stroke-width="5"/><path class="rf1p-s-muted" d="M626.0,311.0 H650.0" stroke-width="5"/><path class="rf1p-s-red" d="M650.0,311.0 H674.0" stroke-width="5"/><path class="rf1p-s-muted" d="M672.0,311.0 H680.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><text class="rf1p-t-ink" x="372.0" y="280" font-size="16" font-weight="600" text-anchor="start">Diffusion limitation</text><text class="rf1p-t-muted" x="372.0" y="298" font-size="13" text-anchor="start">oxygen cannot equilibrate in the</text><text class="rf1p-t-muted" x="372.0" y="315" font-size="13" text-anchor="start">transit time</text><text class="rf1p-t-ink" x="372.0" y="336" font-size="13.5" text-anchor="start">A–a gradient: Widened</text><text class="rf1p-t-ink" x="372.0" y="354" font-size="13.5" text-anchor="start">Oxygen: Usually corrects</text><text class="rf1p-t-ink" x="372.0" y="372" font-size="13.5" text-anchor="start">PaCO2: Normal or low</text><rect class="rf1p-pn" x="16" y="511" width="668" height="73" rx="6"/><rect class="rf1p-f-teal" x="16" y="511" width="5" height="73" rx="2"/><rect class="rf1p-s-teal" x="18" y="513" width="664" height="69" rx="5" stroke-dasharray="5 4" stroke-width="1.2"/><path class="rf1p-s-muted" d="M650,516.0 V529.0" stroke-width="3" stroke-dasharray="2 2" marker-end="url(#rf1p-ah)"/><circle class="rf1p-s-teal" cx="650" cy="545" r="13.0" stroke-width="2.5"/><path class="rf1p-s-muted" d="M626.0,564.0 H650" stroke-width="5"/><path class="rf1p-s-red" d="M650,564.0 H674.0" stroke-width="5"/><path class="rf1p-s-muted" d="M672.0,564.0 H680.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><text class="rf1p-t-teal" x="32" y="533" font-size="16" font-weight="600" text-anchor="start">Low inspired oxygen</text><text class="rf1p-t-muted" x="32" y="551" font-size="13" text-anchor="start">environmental, not a lung mechanism</text><text class="rf1p-t-ink" x="32" y="572" font-size="13.5" text-anchor="start">A–a gradient: Normal</text><text class="rf1p-t-ink" x="222" y="572" font-size="13.5" text-anchor="start">Oxygen: Corrects</text><text class="rf1p-t-ink" x="372" y="572" font-size="13.5" text-anchor="start">PaCO2: Often low</text><text class="rf1p-t-teal" x="16" y="600" font-size="13" font-weight="600" text-anchor="start">THE THREE PATIENTS (ILLUSTRATIVE, ROOM AIR)</text><rect class="rf1p-pn" x="16.0" y="610" width="216.0" height="142" rx="6"/><rect class="rf1p-f-red" x="16.0" y="610" width="5" height="142" rx="2"/><text class="rf1p-t-ink" x="30.0" y="630" font-size="14" font-weight="600" text-anchor="start">Patient A · Pneumonia</text><text class="rf1p-t-ink" x="30.0" y="650" font-size="13.5" text-anchor="start">PaO2 55, PaCO2 32 mm Hg</text><text class="rf1p-t-ink" x="30.0" y="668" font-size="13.5" text-anchor="start">A–a about 55: lung fails to</text><text class="rf1p-t-ink" x="30.0" y="686" font-size="13.5" text-anchor="start">transfer</text><rect class="rf1p-pn" x="242.0" y="610" width="216.0" height="142" rx="6"/><rect class="rf1p-f-teal" x="242.0" y="610" width="5" height="142" rx="2"/><text class="rf1p-t-ink" x="256.0" y="630" font-size="14" font-weight="600" text-anchor="start">Patient B · Opioid</text><text class="rf1p-t-ink" x="256.0" y="648" font-size="14" font-weight="600" text-anchor="start">hypoventilation</text><text class="rf1p-t-ink" x="256.0" y="668" font-size="13.5" text-anchor="start">PaCO2 70, PAO2 about 62,</text><text class="rf1p-t-ink" x="256.0" y="686" font-size="13.5" text-anchor="start">PaO2 56</text><text class="rf1p-t-ink" x="256.0" y="704" font-size="13.5" text-anchor="start">A–a about 6 (normal); pH</text><text class="rf1p-t-ink" x="256.0" y="722" font-size="13.5" text-anchor="start">about 7.21</text><text class="rf1p-t-ink" x="256.0" y="740" font-size="13.5" text-anchor="start">SpO2 about 80%</text><rect class="rf1p-pn" x="468.0" y="610" width="216.0" height="142" rx="6"/><rect class="rf1p-f-gold" x="468.0" y="610" width="5" height="142" rx="2"/><text class="rf1p-t-ink" x="482.0" y="630" font-size="14" font-weight="600" text-anchor="start">Patient C · COPD</text><text class="rf1p-t-ink" x="482.0" y="650" font-size="13.5" text-anchor="start">PaCO2 62, pH 7.31, PaO2</text><text class="rf1p-t-ink" x="482.0" y="668" font-size="13.5" text-anchor="start">56</text><text class="rf1p-t-ink" x="482.0" y="686" font-size="13.5" text-anchor="start">Hypoventilation dominant;</text><text class="rf1p-t-ink" x="482.0" y="704" font-size="13.5" text-anchor="start">A–a about 16, inside the</text><text class="rf1p-t-ink" x="482.0" y="722" font-size="13.5" text-anchor="start">rough age-expected range</text><text class="rf1p-t-ink" x="482.0" y="740" font-size="13.5" text-anchor="start">(about 21)</text><text class="rf1p-t-muted" x="16" y="772" font-size="13" text-anchor="start">Schematic units, not anatomy. Values from Parts I and III.</text></svg>