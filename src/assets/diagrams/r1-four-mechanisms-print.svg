<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 766" width="100%" role="img" aria-labelledby="rf1p-title rf1p-desc"><title id="rf1p-title">Four mechanisms of hypoxemia, and how each responds to oxygen</title><desc id="rf1p-desc">Four schematic lung units compared. Hypoventilation: normal A–a gradient unless lung disease coexists; corrects easily with oxygen, which does not correct the hypoventilation; PaCO2 high. Low V/Q mismatch: widened gradient; usually corrects with modest oxygen; PaCO2 normal or low, can rise in advanced disease. Shunt: gradient widened, often greatly; poor response to oxygen, poorer as shunt fraction grows; PaCO2 normal or low, rises if the pump fails. Diffusion limitation: widened gradient; usually corrects; PaCO2 normal or low. Low inspired oxygen, an environmental cause: normal gradient, corrects, PaCO2 often low. The three illustrative patients on room air: A, pneumonia, PaO2 55 and PaCO2 32 mm Hg, A–a about 55. B, opioid hypoventilation, PaCO2 70, PAO2 about 62, PaO2 56, A–a about 6 which is normal, pH about 7.21, SpO2 about 80 percent. C, COPD, PaCO2 62, pH 7.31, PaO2 56, A–a about 16, SpO2 about 85 percent; mechanism: V/Q mismatch + hypoventilation.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf1p-t-ink{fill:#172d38}.rf1p-t-muted{fill:#526671}.rf1p-t-teal{fill:#077578}.rf1p-t-red{fill:#af4639}.rf1p-t-gold{fill:#996613}.rf1p-bg{fill:#ffffff}.rf1p-pn{fill:#ffffff;stroke:#d5dedc}.rf1p-s-teal{stroke:#077578;fill:none}.rf1p-f-teal{fill:#077578}.rf1p-s-red{stroke:#af4639;fill:none}.rf1p-f-red{fill:#af4639}.rf1p-s-gold{stroke:#996613;fill:none}.rf1p-f-gold{fill:#996613}.rf1p-s-muted{stroke:#526671;fill:none}.rf1p-f-muted{fill:#526671}.rf1p-s-rule{stroke:#d5dedc;fill:none}.rf1p-f-rule{fill:#d5dedc}.rf1p-f-tt{fill:#ddedea}.rf1p-f-rt{fill:#f5e4df}</style><defs><marker id="rf1p-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf1p-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf1p-bg" width="700" height="766"/><text class="rf1p-t-teal" x="16" y="26" font-size="13" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf1p-t-ink" x="16" y="52" font-size="20" font-weight="600" text-anchor="start">Four mechanisms of hypoxemia</text><text class="rf1p-t-muted" x="16" y="74" font-size="13.5" text-anchor="start">Dominant patterns; real patients mix them.</text><rect class="rf1p-pn" x="16.0" y="90" width="328.0" height="162" rx="6"/><rect class="rf1p-f-teal" x="16.0" y="90" width="5" height="162" rx="2"/><circle class="rf1p-s-teal" cx="314.0" cy="116" r="13" stroke-width="2.5" stroke-dasharray="4 3"/><path class="rf1p-s-teal" d="M292.0,134 H336.0" stroke-width="4" stroke-linecap="round"/><text class="rf1p-t-teal" x="32.0" y="112" font-size="16" font-weight="600" text-anchor="start">Hypoventilation</text><text class="rf1p-t-muted" x="32.0" y="130" font-size="13" text-anchor="start">lung normal, too little air moving</text><text class="rf1p-t-ink" x="32.0" y="151" font-size="13.5" text-anchor="start">A–a gradient: normal, unless lung</text><text class="rf1p-t-ink" x="32.0" y="169" font-size="13.5" text-anchor="start">disease coexists</text><text class="rf1p-t-ink" x="32.0" y="187" font-size="13.5" text-anchor="start">Oxygen: corrects easily; does not</text><text class="rf1p-t-ink" x="32.0" y="205" font-size="13.5" text-anchor="start">correct the hypoventilation</text><text class="rf1p-t-ink" x="32.0" y="223" font-size="13.5" text-anchor="start">PaCO2: high</text><rect class="rf1p-pn" x="356.0" y="90" width="328.0" height="162" rx="6"/><rect class="rf1p-f-gold" x="356.0" y="90" width="5" height="162" rx="2"/><circle class="rf1p-s-gold" cx="654.0" cy="116" r="13" stroke-width="2.5" /><circle class="rf1p-f-rt" cx="654.0" cy="116" r="5"/><path class="rf1p-s-gold" d="M632.0,134 H676.0" stroke-width="4" stroke-linecap="round"/><text class="rf1p-t-gold" x="372.0" y="112" font-size="16" font-weight="600" text-anchor="start">Low V/Q mismatch</text><text class="rf1p-t-muted" x="372.0" y="130" font-size="13" text-anchor="start">some fresh gas, not enough for</text><text class="rf1p-t-muted" x="372.0" y="147" font-size="13" text-anchor="start">the blood</text><text class="rf1p-t-ink" x="372.0" y="168" font-size="13.5" text-anchor="start">A–a gradient: widened</text><text class="rf1p-t-ink" x="372.0" y="186" font-size="13.5" text-anchor="start">Oxygen: usually corrects with</text><text class="rf1p-t-ink" x="372.0" y="204" font-size="13.5" text-anchor="start">modest oxygen</text><text class="rf1p-t-ink" x="372.0" y="222" font-size="13.5" text-anchor="start">PaCO2: normal or low; can rise in</text><text class="rf1p-t-ink" x="372.0" y="240" font-size="13.5" text-anchor="start">advanced disease</text><rect class="rf1p-pn" x="16.0" y="264" width="328.0" height="162" rx="6"/><rect class="rf1p-f-red" x="16.0" y="264" width="5" height="162" rx="2"/><circle class="rf1p-s-red" cx="314.0" cy="290" r="13" stroke-width="2.5" /><circle class="rf1p-f-rt" cx="314.0" cy="290" r="11.5"/><path class="rf1p-s-red" d="M292.0,308 H336.0" stroke-width="4" stroke-linecap="round"/><text class="rf1p-t-red" x="32.0" y="286" font-size="16" font-weight="600" text-anchor="start">Shunt</text><text class="rf1p-t-muted" x="32.0" y="304" font-size="13" text-anchor="start">no inspired gas arrives;</text><text class="rf1p-t-muted" x="32.0" y="321" font-size="13" text-anchor="start">blood passes unchanged</text><text class="rf1p-t-ink" x="32.0" y="342" font-size="13.5" text-anchor="start">A–a gradient: widened, often greatly</text><text class="rf1p-t-ink" x="32.0" y="360" font-size="13.5" text-anchor="start">Oxygen: poor, and poorer as shunt</text><text class="rf1p-t-ink" x="32.0" y="378" font-size="13.5" text-anchor="start">fraction grows</text><text class="rf1p-t-ink" x="32.0" y="396" font-size="13.5" text-anchor="start">PaCO2: normal or low; rises if the</text><text class="rf1p-t-ink" x="32.0" y="414" font-size="13.5" text-anchor="start">pump fails</text><rect class="rf1p-pn" x="356.0" y="264" width="328.0" height="162" rx="6"/><rect class="rf1p-f-muted" x="356.0" y="264" width="5" height="162" rx="2"/><circle class="rf1p-s-muted" cx="654.0" cy="290" r="13" stroke-width="2.5" /><path class="rf1p-s-muted" d="M632.0,308 H676.0" stroke-width="4" stroke-linecap="round"/><text class="rf1p-t-ink" x="372.0" y="286" font-size="16" font-weight="600" text-anchor="start">Diffusion limitation</text><text class="rf1p-t-muted" x="372.0" y="304" font-size="13" text-anchor="start">oxygen cannot equilibrate in</text><text class="rf1p-t-muted" x="372.0" y="321" font-size="13" text-anchor="start">the transit time</text><text class="rf1p-t-ink" x="372.0" y="342" font-size="13.5" text-anchor="start">A–a gradient: widened</text><text class="rf1p-t-ink" x="372.0" y="360" font-size="13.5" text-anchor="start">Oxygen: usually corrects</text><text class="rf1p-t-ink" x="372.0" y="378" font-size="13.5" text-anchor="start">PaCO2: normal or low</text><rect class="rf1p-f-tt" x="16" y="438" width="668" height="50" rx="6"/><text class="rf1p-t-ink" x="28" y="459" font-size="13.5" text-anchor="start">Low inspired oxygen (environmental, not a lung mechanism): A–a normal; corrects;</text><text class="rf1p-t-ink" x="28" y="477" font-size="13.5" text-anchor="start">PaCO2 often low.</text><text class="rf1p-t-teal" x="16" y="508" font-size="13" font-weight="600" text-anchor="start">THE THREE PATIENTS (ILLUSTRATIVE, ROOM AIR)</text><rect class="rf1p-pn" x="16" y="520" width="668" height="54" rx="6"/><rect class="rf1p-f-red" x="16" y="520" width="5" height="54" rx="2"/><text class="rf1p-t-ink" x="32" y="544" font-size="14.5" font-weight="600" text-anchor="start">Patient A · Pneumonia</text><text class="rf1p-t-ink" x="330" y="544" font-size="13.5" text-anchor="start">PaO2 55, PaCO2 32 mm Hg</text><text class="rf1p-t-ink" x="330" y="562" font-size="13.5" text-anchor="start">A–a about 55: lung fails to transfer</text><rect class="rf1p-pn" x="16" y="582" width="668" height="72" rx="6"/><rect class="rf1p-f-teal" x="16" y="582" width="5" height="72" rx="2"/><text class="rf1p-t-ink" x="32" y="606" font-size="14.5" font-weight="600" text-anchor="start">Patient B · Opioid hypoventilation</text><text class="rf1p-t-ink" x="330" y="606" font-size="13.5" text-anchor="start">PaCO2 70, PAO2 about 62, PaO2 56</text><text class="rf1p-t-ink" x="330" y="624" font-size="13.5" text-anchor="start">A–a about 6 (normal); pH about 7.21</text><text class="rf1p-t-ink" x="330" y="642" font-size="13.5" text-anchor="start">SpO2 about 80%</text><rect class="rf1p-pn" x="16" y="662" width="668" height="72" rx="6"/><rect class="rf1p-f-gold" x="16" y="662" width="5" height="72" rx="2"/><text class="rf1p-t-ink" x="32" y="686" font-size="14.5" font-weight="600" text-anchor="start">Patient C · COPD</text><text class="rf1p-t-ink" x="330" y="686" font-size="13.5" text-anchor="start">PaCO2 62, pH 7.31, PaO2 56</text><text class="rf1p-t-ink" x="330" y="704" font-size="13.5" text-anchor="start">A–a about 16; SpO2 about 85%</text><text class="rf1p-t-ink" x="330" y="722" font-size="13.5" text-anchor="start">V/Q mismatch + hypoventilation</text><text class="rf1p-t-muted" x="16" y="754" font-size="13" text-anchor="start">Schematic units, not anatomy. Values from Parts I and III.</text></svg>