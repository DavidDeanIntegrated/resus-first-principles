<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 438" role="img" aria-labelledby="fig-r3-01-three-septic-circulations-print-title" aria-describedby="fig-r3-01-three-septic-circulations-print-desc"><title id="fig-r3-01-three-septic-circulations-print-title">One diagnosis, three circulations</title><desc id="fig-r3-01-three-septic-circulations-print-desc">Three simple circuit diagrams, each with a heart, arterioles, capillaries and veins. Patient V, pneumonia: a large heart output with wide arterioles; MAP 53, cardiac output 7.5 liters per minute, SVR about 500, stroke volume 64 mL; a strong heart with lost tone. Patient L, urinary source: fluid leaving the capillaries into the surrounding tissue; MAP 66 on a vasopressor, edema. Patient C, biliary sepsis: a small heart output with narrowed arterioles; MAP 64, cardiac output 3.2 liters per minute, SVR about 1250, stroke volume 26 mL; a weak heart with clamped vessels. A note reads shock index 1.44 for V and 1.42 for C: almost the same index, opposite circulations. Illustrative teaching numbers.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r3-01-three-septic-circulations-print-t-ink{fill:#172d38}.fig-r3-01-three-septic-circulations-print-t-muted{fill:#526671}.fig-r3-01-three-septic-circulations-print-t-teal{fill:#077578}.fig-r3-01-three-septic-circulations-print-t-red{fill:#af4639}.fig-r3-01-three-septic-circulations-print-t-gold{fill:#996613}.fig-r3-01-three-septic-circulations-print-bg{fill:#ffffff}.fig-r3-01-three-septic-circulations-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r3-01-three-septic-circulations-print-s-teal{stroke:#077578;fill:none}.fig-r3-01-three-septic-circulations-print-f-teal{fill:#077578}.fig-r3-01-three-septic-circulations-print-s-red{stroke:#af4639;fill:none}.fig-r3-01-three-septic-circulations-print-f-red{fill:#af4639}.fig-r3-01-three-septic-circulations-print-s-gold{stroke:#996613;fill:none}.fig-r3-01-three-septic-circulations-print-f-gold{f