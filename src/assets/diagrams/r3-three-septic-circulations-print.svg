<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 549" role="img" aria-labelledby="fig-r3-01-three-septic-circulations-print-title" aria-describedby="fig-r3-01-three-septic-circulations-print-desc"><title id="fig-r3-01-three-septic-circulations-print-title">Three septic circulations, each a snapshot at one moment</title><desc id="fig-r3-01-three-septic-circulations-print-desc">Three simple circuit diagrams, each with a heart, arterioles, capillaries and veins, and each a snapshot at one moment. Patient V, pneumonia: a large heart output with wide arterioles. Given values: MAP 53, cardiac output 7.5 liters per minute. Calculated values: SVR about 500, stroke volume 64 mL. Low vascular tone; cardiac output high at current filling. Patient L, urinary source: fluid leaving the capillaries into the surrounding tissue. Given value: MAP 66 on a vasopressor. Edema. Fluid has left the vessels. Patient C, biliary sepsis: a small heart output with narrowed arterioles. Given values: MAP 64, cardiac output 3.2 liters per minute. Calculated values: SVR about 1250, stroke volume 26 mL. High vascular tone; cardiac output low at current filling. In each circuit the arteriolar width is inferred, drawn schematically, not observed. A note reads shock index 1.44 for V and 1.42 for C: almost the same index, opposite circulations. A key reads: given, MAP, CVP and cardiac output, as stated; calculated, SVR and stroke volume, from them; inferred, arteriolar width. Illustrative teaching numbers.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r3-01-three-septic-circulations-print-t-ink{fill:#172d38}.fig-r3-01-three-septic-circulations-print-t-muted{fill:#526671}.fig-r3-01-three-septic-circulations-print-t-teal{fill:#077578}.fig-r3-01-three-septic-circulations-print-t-red{fill:#af4639}.fig-r3-01-three-septic-circulations-print-t-gold{fill:#996613}.fig-r3-01-three-septic-circulations-print-bg{fill:#ffffff}.fig-r3-01-three-septic-circulations-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r3-01-three-septic-circulations-print-s-teal{stroke:#077578;fill:none}.fig-r3-01-three-septic-circulations-print-f-teal{fill:#077578}.fig-r3-01-three-septic-circulations-print-s-red{stroke:#af4639;fill:none}.fig-r3-01-three-septic-circulations-print-f-red{fill:#af4639}.fig-r3-01-three-septic-circulations-print-s-gold{stroke:#996613;fill:none}.fig-r3-01-three-septic-circulations-print-f-gold{fill:#996613}.fig-r3-01-three-septic-circulations-print-s-muted{stroke:#526671;fill:none}.fig-r3-01-three-septic-circulations-print-f-muted{fill:#526671}.fig-r3-01-three-septic-circulations-print-s-rule{stroke:#d5dedc;fill:none}.fig-r3-01-three-septic-circulations-print-f-rule{fill:#d5dedc}.fig-r3-01-three-septic-circulations-print-s-ink{stroke:#172d38;fill:none}.fig-r3-01-three-septic-circulations-print-f-ink{fill:#172d38}.fig-r3-01-three-septic-circulations-print-f-tt{fill:#ddedea}.fig-r3-01-three-septic-circulations-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r3-01-three-septic-circulations-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r3-01-three-septic-circulations-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r3-01-three-septic-circulations-print-bg" width="700" height="549"/><text class="fig-r3-01-three-septic-circulations-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">SEPTIC SHOCK</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">Three septic circulations, each a snapshot at one moment</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Illustrative teaching numbers.</text><rect class="fig-r3-01-three-septic-circulations-print-pn" x="16.0" y="93.0" width="214.7" height="345.0" rx="6"/><rect class="fig-r3-01-three-septic-circulations-print-f-teal" x="16.0" y="93.0" width="5" height="345.0" rx="2"/><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="32.0" y="117.0" font-size="15" font-weight="600" text-anchor="start">Patient V</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="32.0" y="135.0" font-size="13" text-anchor="start">pneumonia</text><circle class="fig-r3-01-three-septic-circulations-print-f-teal" cx="68.0" cy="188.0" r="16" opacity="0.85"/><path class="fig-r3-01-three-septic-circulations-print-s-ink" d="M68.0,172.0 V155 H176.66666666666666 V180.0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-01-three-septic-circulations-print-s-muted" d="M176.66666666666666,196.0 V221 H68.0 V204.0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect class="fig-r3-01-three-septic-circulations-print-f-tt" x="166.66666666666666" y="180.0" width="20" height="16" rx="3"/><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="116.3" y="247.0" font-size="13" text-anchor="middle">arteriole width: inferred</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="32.0" y="277.0" font-size="13" font-weight="600" text-anchor="start">GIVEN</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="32.0" y="293.0" font-size="13" text-anchor="start">MAP 53</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="32.0" y="310.0" font-size="13" text-anchor="start">Cardiac output 7.5 L/min</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="32.0" y="330.0" font-size="13" font-weight="600" text-anchor="start">CALCULATED</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="32.0" y="346.0" font-size="13" text-anchor="start">SVR about 500</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="32.0" y="363.0" font-size="13" text-anchor="start">Stroke volume 64 mL</text><text class="fig-r3-01-three-septic-circulations-print-t-teal" x="32.0" y="394.0" font-size="13" font-weight="600" text-anchor="start">Low vascular tone; cardiac</text><text class="fig-r3-01-three-septic-circulations-print-t-teal" x="32.0" y="410.0" font-size="13" font-weight="600" text-anchor="start">output high at current</text><text class="fig-r3-01-three-septic-circulations-print-t-teal" x="32.0" y="426.0" font-size="13" font-weight="600" text-anchor="start">filling</text><rect class="fig-r3-01-three-septic-circulations-print-pn" x="242.7" y="93.0" width="214.7" height="345.0" rx="6"/><rect class="fig-r3-01-three-septic-circulations-print-f-gold" x="242.7" y="93.0" width="5" height="345.0" rx="2"/><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="258.7" y="117.0" font-size="15" font-weight="600" text-anchor="start">Patient L</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="258.7" y="135.0" font-size="13" text-anchor="start">urinary source</text><circle class="fig-r3-01-three-septic-circulations-print-f-gold" cx="294.66666666666663" cy="188.0" r="13" opacity="0.85"/><path class="fig-r3-01-three-septic-circulations-print-s-ink" d="M294.66666666666663,175.0 V155 H403.33333333333326 V180.0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-01-three-septic-circulations-print-s-muted" d="M403.33333333333326,196.0 V221 H294.66666666666663 V201.0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect class="fig-r3-01-three-septic-circulations-print-f-tt" x="393.33333333333326" y="180.0" width="20" height="16" rx="3"/><path class="fig-r3-01-three-septic-circulations-print-s-gold" d="M412.33333333333326,182.0 h14" stroke-width="2" stroke-linecap="round" marker-end="url(#fig-r3-01-three-septic-circulations-print-ah)"/><path class="fig-r3-01-three-septic-circulations-print-s-gold" d="M412.33333333333326,188.0 h14" stroke-width="2" stroke-linecap="round" marker-end="url(#fig-r3-01-three-septic-circulations-print-ah)"/><path class="fig-r3-01-three-septic-circulations-print-s-gold" d="M412.33333333333326,194.0 h14" stroke-width="2" stroke-linecap="round" marker-end="url(#fig-r3-01-three-septic-circulations-print-ah)"/><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="343.0" y="247.0" font-size="13" text-anchor="middle">arteriole width: inferred</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="258.7" y="277.0" font-size="13" font-weight="600" text-anchor="start">GIVEN</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="258.7" y="293.0" font-size="13" text-anchor="start">MAP 66 on a vasopressor</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="258.7" y="313.0" font-size="13" text-anchor="start">Edema</text><text class="fig-r3-01-three-septic-circulations-print-t-gold" x="258.7" y="426.0" font-size="13" font-weight="600" text-anchor="start">Fluid has left the vessels</text><rect class="fig-r3-01-three-septic-circulations-print-pn" x="469.3" y="93.0" width="214.7" height="345.0" rx="6"/><rect class="fig-r3-01-three-septic-circulations-print-f-red" x="469.3" y="93.0" width="5" height="345.0" rx="2"/><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="485.3" y="117.0" font-size="15" font-weight="600" text-anchor="start">Patient C</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="485.3" y="135.0" font-size="13" text-anchor="start">biliary sepsis</text><circle class="fig-r3-01-three-septic-circulations-print-f-red" cx="521.3333333333333" cy="188.0" r="9" opacity="0.85"/><path class="fig-r3-01-three-septic-circulations-print-s-ink" d="M521.3333333333333,179.0 V155 H630.0 V180.0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-01-three-septic-circulations-print-s-muted" d="M630.0,196.0 V221 H521.3333333333333 V197.0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect class="fig-r3-01-three-septic-circulations-print-f-tt" x="620.0" y="180.0" width="20" height="16" rx="3"/><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="569.7" y="247.0" font-size="13" text-anchor="middle">arteriole width: inferred</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="485.3" y="277.0" font-size="13" font-weight="600" text-anchor="start">GIVEN</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="485.3" y="293.0" font-size="13" text-anchor="start">MAP 64</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="485.3" y="310.0" font-size="13" text-anchor="start">Cardiac output 3.2 L/min</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="485.3" y="330.0" font-size="13" font-weight="600" text-anchor="start">CALCULATED</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="485.3" y="346.0" font-size="13" text-anchor="start">SVR about 1250</text><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="485.3" y="363.0" font-size="13" text-anchor="start">Stroke volume 26 mL</text><text class="fig-r3-01-three-septic-circulations-print-t-red" x="485.3" y="394.0" font-size="13" font-weight="600" text-anchor="start">High vascular tone;</text><text class="fig-r3-01-three-septic-circulations-print-t-red" x="485.3" y="410.0" font-size="13" font-weight="600" text-anchor="start">cardiac output low at</text><text class="fig-r3-01-three-septic-circulations-print-t-red" x="485.3" y="426.0" font-size="13" font-weight="600" text-anchor="start">current filling</text><rect class="fig-r3-01-three-septic-circulations-print-f-tt" x="16.0" y="446.0" width="668.0" height="35.0" rx="6"/><text class="fig-r3-01-three-septic-circulations-print-t-ink" x="28.0" y="466.0" font-size="13.5" text-anchor="start">Shock index: V 1.44, C 1.42. Almost the same index, opposite circulations.</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="16.0" y="497.0" font-size="13" text-anchor="start">Given: MAP, CVP and cardiac output, as stated. Calculated: SVR and stroke volume, from them.</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="16.0" y="513.0" font-size="13" text-anchor="start">Inferred: arteriolar width, drawn as line width; schematic, not observed.</text><text class="fig-r3-01-three-septic-circulations-print-t-muted" x="16.0" y="529.0" font-size="13" text-anchor="start">Circuit: heart, arterioles, capillaries, veins.</text></svg>