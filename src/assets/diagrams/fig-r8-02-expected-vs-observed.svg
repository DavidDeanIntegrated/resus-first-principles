<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 1251" role="img" aria-labelledby="fig-r8-02-expected-vs-observed-screen-title" aria-describedby="fig-r8-02-expected-vs-observed-screen-desc"><title id="fig-r8-02-expected-vs-observed-screen-title">The same pH, different states: compare compensation with what is expected (illustrative values; the pH of 6.92 holds bicarbonate at 8 by assumption)</title><desc id="fig-r8-02-expected-vs-observed-screen-desc">Illustrative values. Two compact cards and one main panel. Patient 1, toxic alcohol: bicarbonate 8; Winter&#x27;s formula expects a PaCO2 of 18 to 22; observed 20 is inside; pH about 7.22. A second marker shows that at a PaCO2 of 40, holding bicarbonate at 8 by assumption, pH would be about 6.92, or about 7.02 allowing a little acute buffering. Patient 2, opioid: PaCO2 rose from 40 to 70 over minutes; the acute rule expects bicarbonate about 27 and the chronic rule about 34.5; observed 27, consistent with an acute rise but not excluding chronic retention with a new metabolic acidosis; pH about 7.21. Patient 3, in five steps: pH 7.40, PaCO2 40 and bicarbonate 24 are all in range; the anion gap without potassium is 24 against an assumed baseline of 10, a rise of 14; one-for-one, bicarbonate would have fallen to about 10, but it is 24, so bicarbonate has been added; low chloride and low potassium fit vomiting; on a pH axis, the ketoacidosis alone would give about 7.26 and the alkalosis alone about 7.52, and together they give the observed 7.40.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r8-02-expected-vs-observed-screen-h)}</style><defs><marker id="fig-r8-02-expected-vs-observed-screen-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r8-02-expected-vs-observed-screen-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="360" height="1251"/><g transform="translate(10,10)"><text x="0" y="16" font-size="12.4" text-anchor="start" font-weight="700" class="t-teal">ACID–BASE PHYSIOLOGY</text><text x="0" y="40" font-size="19" text-anchor="start" font-weight="700" class="t-ink">The same pH, different states</text><text x="0" y="64" font-size="13" text-anchor="start" font-weight="400" class="t-muted">Compare compensation with what is expected,</text><text x="0" y="82" font-size="13" text-anchor="start" font-weight="400" class="t-muted">then look past a normal pH. Illustrative values.</text></g><g transform="translate(10,118)"><rect x="0" y="0" width="340" height="206" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 1: toxic alcohol</text><text x="328" y="22" font-size="12.4" text-anchor="end" font-weight="400" font-style="italic" class="t-muted">Illustrative values</text><text x="12" y="42" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">Primary: HCO3− 8 mEq/L. pH about 7.22.</text><text x="12" y="62" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">Winter&#x27;s: 1.5 × 8 + 8 = 20 (18–22)</text><line x1="20" y1="96" x2="320" y2="96" class="s-rule" stroke-width="2"/><text x="20" y="112" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">10</text><text x="320" y="112" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">45 mm Hg PaCO2</text><rect x="88.57142857142857" y="88" width="34.28571428571429" height="16" rx="2" class="hatch" /><rect x="88.57142857142857" y="88" width="34.28571428571429" height="16" rx="2" class="s-ink" /><path d="M105.71428571428571,86 l-6,-10 h12 z" class="f-red"/><text x="115.71428571428571" y="84" font-size="12.4" text-anchor="start" font-weight="700" class="t-red">observed 20: inside</text><circle cx="277.14285714285717" cy="96" r="6" class="s-ink" stroke-width="2"/><text x="12" y="136" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">○ If PaCO2 were 40, HCO3− held at 8 by</text><text x="12" y="151" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">assumption: pH about 6.92.</text><text x="12" y="166" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">Allowing about 2 mEq/L acute buffering: about</text><text x="12" y="181" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">7.02.</text></g><g transform="translate(10,338)"><rect x="0" y="0" width="340" height="205" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 2: opioid</text><text x="328" y="22" font-size="12.4" text-anchor="end" font-weight="400" font-style="italic" class="t-muted">Illustrative values</text><text x="12" y="42" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">PaCO2 40 → 70 over minutes. pH about 7.21.</text><line x1="20" y1="94" x2="320" y2="94" class="s-rule" stroke-width="2"/><text x="20" y="110" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">22</text><text x="320" y="110" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">40 mEq/L HCO3−</text><rect x="100.33333333333333" y="86" width="6" height="16" rx="1" class="hatch" /><rect x="100.33333333333333" y="86" width="6" height="16" rx="1" class="s-ink" /><text x="103.33333333333333" y="64" font-size="12.4" text-anchor="middle" font-weight="400" class="t-ink">acute rule ≈ 27</text><rect x="222.33333333333334" y="88" width="12" height="12" class="s-ink" stroke-width="2"/><text x="228.33333333333334" y="64" font-size="12.4" text-anchor="middle" font-weight="400" class="t-ink">□ chronic ≈ 34.5</text><path d="M103.33333333333333,104 l-6,10 h12 z" class="f-red"/><text x="113.33333333333333" y="128" font-size="12.4" text-anchor="start" font-weight="700" class="t-red">▲ observed 27</text><text x="12" y="150" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">Consistent with acute. Does not exclude</text><text x="12" y="165" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">chronic retention plus a new metabolic</text><text x="12" y="180" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">acidosis.</text></g><g transform="translate(10,557)"><rect x="0" y="0" width="340" height="84" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 3, step 1: blood gas</text><text x="12" y="44" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">pH 7.40, PaCO2 40, HCO3− 24.</text><text x="12" y="59" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">All in range.</text></g><g transform="translate(10,655)"><rect x="0" y="0" width="340" height="114" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 3, step 2: anion gap (without K+)</text><text x="12" y="44" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">136 − (88 + 24) = 24; assumed baseline 10;</text><text x="12" y="59" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">Δgap 14.</text><text x="12" y="74" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">With K+ 3.0: 27, against a higher reference</text><text x="12" y="89" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">range.</text></g><g transform="translate(10,783)"><rect x="0" y="0" width="340" height="99" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 3, step 3: delta comparison</text><text x="12" y="44" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">Expected HCO3− if 1:1 = 24 − 14 = 10; observed</text><text x="12" y="59" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">24; excess 14 → bicarbonate has been added.</text><text x="12" y="74" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">A clue, not exact accounting.</text></g><g transform="translate(10,896)"><rect x="0" y="0" width="340" height="84" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 3, step 4: chloride and potassium</text><text x="12" y="44" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">Cl− 88 (low), K+ 3.0 (low) → fit vomiting;</text><text x="12" y="59" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">maintain the alkalosis.</text></g><g transform="translate(10,994)"><rect x="0" y="0" width="340" height="243" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 3, step 5: tug-of-war</text><text x="12" y="44" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">Arrows point from the observed pH to where</text><text x="12" y="59" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">each process alone would take it.</text><rect x="145.0" y="84" width="50.000000000000256" height="28" rx="0" class="hatch" /><line x1="20" y1="98" x2="320" y2="98" class="s-ink" stroke-width="1.5"/><line x1="20.0" y1="94" x2="20.0" y2="102" class="s-ink" stroke-width="1.5"/><text x="20.0" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">7.10</text><line x1="69.99999999999983" y1="94" x2="69.99999999999983" y2="102" class="s-ink" stroke-width="1.5"/><text x="69.99999999999983" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">7.20</text><line x1="120.0000000000001" y1="94" x2="120.0000000000001" y2="102" class="s-ink" stroke-width="1.5"/><text x="120.0000000000001" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">7.30</text><line x1="169.99999999999991" y1="94" x2="169.99999999999991" y2="102" class="s-ink" stroke-width="1.5"/><text x="169.99999999999991" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">7.40</text><line x1="220.0000000000002" y1="94" x2="220.0000000000002" y2="102" class="s-ink" stroke-width="1.5"/><text x="220.0000000000002" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">7.50</text><line x1="270.0" y1="94" x2="270.0" y2="102" class="s-ink" stroke-width="1.5"/><text x="270.0" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">7.60</text><line x1="319.99999999999983" y1="94" x2="319.99999999999983" y2="102" class="s-ink" stroke-width="1.5"/><text x="319.99999999999983" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">7.70</text><text x="170" y="136" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">pH (illustrative); hatched: normal 7.35–7.45</text><line x1="170.00000000000037" y1="74" x2="100.00000000000007" y2="74" class="s-red" stroke-width="2.5" marker-end="url(#fig-r8-02-expected-vs-observed-screen-ar)"/><line x1="170.00000000000037" y1="74" x2="229.99999999999997" y2="74" class="s-teal" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#fig-r8-02-expected-vs-observed-screen-ar)"/><path d="M170.00000000000037,100 l-7,-12 h14 z" class="f-ink"/><text x="12" y="158" font-size="12.4" text-anchor="start" font-weight="700" class="t-red">← solid: ketoacidosis alone → 7.26 (HCO3−</text><text x="12" y="173" font-size="12.4" text-anchor="start" font-weight="700" class="t-red">about 10, PaCO2 about 23)</text><text x="12" y="188" font-size="12.4" text-anchor="start" font-weight="700" class="t-teal">dashed →: alkalosis alone → 7.52 (HCO3− about</text><text x="12" y="203" font-size="12.4" text-anchor="start" font-weight="700" class="t-teal">38, PaCO2 about 48)</text><text x="12" y="218" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">▼ 7.40: both together: observed</text></g></svg>