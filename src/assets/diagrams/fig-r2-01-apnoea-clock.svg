<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 771" role="img" aria-labelledby="fig-r2-01-apnoea-clock-screen-title" aria-describedby="fig-r2-01-apnoea-clock-screen-desc"><title id="fig-r2-01-apnoea-clock-screen-title">The apnea clock</title><desc id="fig-r2-01-apnoea-clock-screen-desc">Schematic graph of lung oxygen store in liters against time from the start of apnea in minutes. Simple depletion estimates: store divided by consumption of 250 milliliters per minute. A healthy adult after preoxygenation starts at about 2.2 liters, a depletion estimate of about 8.7 minutes. The same adult on room air starts at about 0.35 liters, an estimate of about 1.4 minutes. Patient H&#x27;s store is about 1.2 liters even if her ventilated alveoli reached an oxygen fraction of 0.8, and her consumption is likely higher, so her dashed line starts lower and falls faster; no estimate or time is given for her. A shaded band at the start marks that she begins at a saturation of 88 percent, already at the shoulder of the dissociation curve, so saturation can fall steeply almost as soon as apnea starts. Depletion estimates, not upper limits and not times to a saturation of 90 percent. Saturation falls before the store is empty. Illustrative; about 80 kg; sea level; no ventilation or oxygen inflow during apnea.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-01-apnoea-clock-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r2-01-apnoea-clock-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r2-01-apnoea-clock-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r2-01-apnoea-clock-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r2-01-apnoea-clock-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r2-01-apnoea-clock-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r2-01-apnoea-clock-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r2-01-apnoea-clock-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r2-01-apnoea-clock-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r2-01-apnoea-clock-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r2-01-apnoea-clock-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r2-01-apnoea-clock-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r2-01-apnoea-clock-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r2-01-apnoea-clock-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r2-01-apnoea-clock-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r2-01-apnoea-clock-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r2-01-apnoea-clock-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r2-01-apnoea-clock-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r2-01-apnoea-clock-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r2-01-apnoea-clock-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r2-01-apnoea-clock-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r2-01-apnoea-clock-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-01-apnoea-clock-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-01-apnoea-clock-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-01-apnoea-clock-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r2-01-apnoea-clock-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-01-apnoea-clock-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r2-01-apnoea-clock-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r2-01-apnoea-clock-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r2-01-apnoea-clock-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-01-apnoea-clock-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r2-01-apnoea-clock-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r2-01-apnoea-clock-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r2-01-apnoea-clock-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-01-apnoea-clock-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r2-01-apnoea-clock-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-01-apnoea-clock-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r2-01-apnoea-clock-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r2-01-apnoea-clock-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r2-01-apnoea-clock-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-01-apnoea-clock-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r2-01-apnoea-clock-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r2-01-apnoea-clock-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-01-apnoea-clock-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-01-apnoea-clock-screen-bg" width="360" height="771"/><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">The apnea clock</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="12.0" y="70.0" font-size="12.5" text-anchor="start">Lung oxygen store against time. Simple</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="12.0" y="87.0" font-size="12.5" text-anchor="start">depletion estimates: store divided by</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="12.0" y="104.0" font-size="12.5" text-anchor="start">consumption (250 mL/min).</text><path class="fig-r2-01-apnoea-clock-screen-s-muted" d="M58,141 V377 H336" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="52.0" y="381.0" font-size="12.5" text-anchor="end">0</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="58.0" y="397.0" font-size="12.5" text-anchor="middle">0</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="336.0" y="431.0" font-size="12.5" text-anchor="end">Time from start of apnea (min) →</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" font-size="12.5" transform="translate(24,262.0) rotate(-90)" text-anchor="middle">Lung oxygen store (L)</text><rect class="fig-r2-01-apnoea-clock-screen-f-rt" x="58" y="260.6" width="30.6" height="116.4"/><path class="fig-r2-01-apnoea-clock-screen-s-teal" d="M58,174.6 L299.9,377" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-01-apnoea-clock-screen-s-gold" d="M58,344.8 L96.9,377" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-01-apnoea-clock-screen-s-red" d="M58,266.6 L130.3,326.4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><circle class="fig-r2-01-apnoea-clock-screen-f-teal" cx="299.9" cy="377" r="4"/><circle class="fig-r2-01-apnoea-clock-screen-f-gold" cx="96.9" cy="377" r="4"/><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="336.0" y="397.0" font-size="12.5" font-weight="600" text-anchor="end">estimate about</text><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="336.0" y="412.6" font-size="12.5" font-weight="600" text-anchor="end">8.7 minutes</text><text class="fig-r2-01-apnoea-clock-screen-t-gold" x="100.9" y="397.0" font-size="12.5" font-weight="600" text-anchor="start">about 1.4</text><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="66.0" y="166.6" font-size="12.5" font-weight="600" text-anchor="start">Preoxygenated adult: about 2.2 L</text><path class="fig-r2-01-apnoea-clock-screen-s-gold" d="M16,444.5 H46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r2-01-apnoea-clock-screen-t-gold" x="56.0" y="448.5" font-size="12.5" text-anchor="start">Room air: about 0.35 L,</text><text class="fig-r2-01-apnoea-clock-screen-t-gold" x="56.0" y="464.8" font-size="12.5" text-anchor="start">estimate about 1.4 minutes</text><path class="fig-r2-01-apnoea-clock-screen-s-red" d="M16,492.5 H46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r2-01-apnoea-clock-screen-t-red" x="56.0" y="496.5" font-size="12.5" text-anchor="start">Patient H: about 1.2 L even at 0.8</text><text class="fig-r2-01-apnoea-clock-screen-t-red" x="56.0" y="512.8" font-size="12.5" text-anchor="start">oxygen fraction; consumption likely</text><text class="fig-r2-01-apnoea-clock-screen-t-red" x="56.0" y="529.0" font-size="12.5" text-anchor="start">higher; no estimate given</text><rect class="fig-r2-01-apnoea-clock-screen-pn" x="12.0" y="557.2" width="336.0" height="89.5" rx="6"/><rect class="fig-r2-01-apnoea-clock-screen-f-red" x="12.0" y="557.2" width="5" height="89.5" rx="2"/><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="577.2" font-size="12.5" text-anchor="start">Shaded: Patient H starts at 88 percent,</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="594.1" font-size="12.5" text-anchor="start">already at the shoulder of the curve;</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="611.0" font-size="12.5" text-anchor="start">saturation can fall steeply almost as soon</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="627.9" font-size="12.5" text-anchor="start">as apnea starts. No time is given.</text><rect class="fig-r2-01-apnoea-clock-screen-f-tt" x="12.0" y="656.8" width="336.0" height="102.4" rx="6"/><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="676.8" font-size="12.5" text-anchor="start">Depletion estimates, not upper limits and</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="693.6" font-size="12.5" text-anchor="start">not times to a saturation of 90 percent.</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="710.5" font-size="12.5" text-anchor="start">Saturation falls before the store is empty.</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="727.4" font-size="12.5" text-anchor="start">Illustrative; about 80 kg; sea level; no</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="744.2" font-size="12.5" text-anchor="start">ventilation or oxygen inflow during apnea.</text></svg>