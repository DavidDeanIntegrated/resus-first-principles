<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 737" role="img" aria-labelledby="fig-r2-01-apnoea-clock-screen-title" aria-describedby="fig-r2-01-apnoea-clock-screen-desc"><title id="fig-r2-01-apnoea-clock-screen-title">The apnoea clock</title><desc id="fig-r2-01-apnoea-clock-screen-desc">Schematic graph of lung oxygen store in litres against time from the start of apnoea in minutes. A healthy adult after preoxygenation starts at about 2.2 litres; at a consumption of 250 millilitres per minute the store&#x27;s ceiling is about 8.7 minutes. The same adult on room air starts at about 0.35 litres, with a ceiling of about 1.4 minutes. Patient H&#x27;s store is about 1.2 litres even if her ventilated alveoli reached an oxygen fraction of 0.8, and her consumption is likely higher, so her dashed line starts lower and falls faster; no ceiling or time is given for her. A shaded band at the start marks that she begins at a saturation of 88 percent, already at the shoulder of the dissociation curve, so saturation can fall steeply almost as soon as apnoea starts. Ceilings are upper limits, store divided by consumption, not times to a saturation of 90 percent; saturation falls before the store is empty.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-01-apnoea-clock-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r2-01-apnoea-clock-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r2-01-apnoea-clock-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r2-01-apnoea-clock-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r2-01-apnoea-clock-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r2-01-apnoea-clock-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r2-01-apnoea-clock-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r2-01-apnoea-clock-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r2-01-apnoea-clock-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r2-01-apnoea-clock-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r2-01-apnoea-clock-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r2-01-apnoea-clock-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r2-01-apnoea-clock-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r2-01-apnoea-clock-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r2-01-apnoea-clock-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r2-01-apnoea-clock-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r2-01-apnoea-clock-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r2-01-apnoea-clock-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r2-01-apnoea-clock-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r2-01-apnoea-clock-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r2-01-apnoea-clock-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r2-01-apnoea-clock-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-01-apnoea-clock-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-01-apnoea-clock-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-01-apnoea-clock-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r2-01-apnoea-clock-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-01-apnoea-clock-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r2-01-apnoea-clock-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r2-01-apnoea-clock-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r2-01-apnoea-clock-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r2-01-apnoea-clock-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r2-01-apnoea-clock-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r2-01-apnoea-clock-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r2-01-apnoea-clock-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r2-01-apnoea-clock-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r2-01-apnoea-clock-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r2-01-apnoea-clock-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r2-01-apnoea-clock-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r2-01-apnoea-clock-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r2-01-apnoea-clock-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r2-01-apnoea-clock-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r2-01-apnoea-clock-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r2-01-apnoea-clock-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-01-apnoea-clock-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-01-apnoea-clock-screen-bg" width="360" height="737"/><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">The apnoea clock</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="12.0" y="70.0" font-size="12.5" text-anchor="start">Lung oxygen store against time. Ceilings only:</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="12.0" y="87.0" font-size="12.5" text-anchor="start">store divided by consumption (250 mL/min).</text><path class="fig-r2-01-apnoea-clock-screen-s-muted" d="M58,124 V360 H336" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="52.0" y="364.0" font-size="12.5" text-anchor="end">0</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="58.0" y="380.0" font-size="12.5" text-anchor="middle">0</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" x="336.0" y="414.0" font-size="12.5" text-anchor="end">Time from start of apnoea (min) →</text><text class="fig-r2-01-apnoea-clock-screen-t-muted" font-size="12.5" transform="translate(24,245.0) rotate(-90)" text-anchor="middle">Lung oxygen store (L)</text><rect class="fig-r2-01-apnoea-clock-screen-f-rt" x="58" y="243.6" width="30.6" height="116.4"/><path class="fig-r2-01-apnoea-clock-screen-s-teal" d="M58,157.6 L299.9,360" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-01-apnoea-clock-screen-s-gold" d="M58,327.8 L96.9,360" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-01-apnoea-clock-screen-s-red" d="M58,249.6 L130.3,309.4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><circle class="fig-r2-01-apnoea-clock-screen-f-teal" cx="299.9" cy="360" r="4"/><circle class="fig-r2-01-apnoea-clock-screen-f-gold" cx="96.9" cy="360" r="4"/><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="336.0" y="380.0" font-size="12.5" font-weight="600" text-anchor="end">ceiling about</text><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="336.0" y="395.6" font-size="12.5" font-weight="600" text-anchor="end">8.7 minutes</text><text class="fig-r2-01-apnoea-clock-screen-t-gold" x="100.9" y="380.0" font-size="12.5" font-weight="600" text-anchor="start">about 1.4</text><text class="fig-r2-01-apnoea-clock-screen-t-teal" x="66.0" y="149.6" font-size="12.5" font-weight="600" text-anchor="start">Preoxygenated adult: about 2.2 L</text><path class="fig-r2-01-apnoea-clock-screen-s-gold" d="M16,427.5 H46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r2-01-apnoea-clock-screen-t-gold" x="56.0" y="431.5" font-size="12.5" text-anchor="start">Room air: about 0.35 L,</text><text class="fig-r2-01-apnoea-clock-screen-t-gold" x="56.0" y="447.8" font-size="12.5" text-anchor="start">ceiling about 1.4 minutes</text><path class="fig-r2-01-apnoea-clock-screen-s-red" d="M16,475.5 H46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r2-01-apnoea-clock-screen-t-red" x="56.0" y="479.5" font-size="12.5" text-anchor="start">Patient H: about 1.2 L even at 0.8</text><text class="fig-r2-01-apnoea-clock-screen-t-red" x="56.0" y="495.8" font-size="12.5" text-anchor="start">oxygen fraction; consumption likely</text><text class="fig-r2-01-apnoea-clock-screen-t-red" x="56.0" y="512.0" font-size="12.5" text-anchor="start">higher; no ceiling given</text><rect class="fig-r2-01-apnoea-clock-screen-pn" x="12.0" y="540.2" width="336.0" height="89.5" rx="6"/><rect class="fig-r2-01-apnoea-clock-screen-f-red" x="12.0" y="540.2" width="5" height="89.5" rx="2"/><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="560.2" font-size="12.5" text-anchor="start">Shaded: Patient H starts at 88 percent,</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="577.1" font-size="12.5" text-anchor="start">already at the shoulder of the curve;</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="594.0" font-size="12.5" text-anchor="start">saturation can fall steeply almost as soon</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="28.0" y="610.9" font-size="12.5" text-anchor="start">as apnoea starts. No time is given.</text><rect class="fig-r2-01-apnoea-clock-screen-f-tt" x="12.0" y="639.8" width="336.0" height="85.5" rx="6"/><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="659.8" font-size="12.5" text-anchor="start">Ceilings are upper limits, not times to a</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="676.6" font-size="12.5" text-anchor="start">saturation of 90 percent. Saturation falls</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="693.5" font-size="12.5" text-anchor="start">before the store is empty. Schematic; 80 kg;</text><text class="fig-r2-01-apnoea-clock-screen-t-ink" x="24.0" y="710.4" font-size="12.5" text-anchor="start">sea level, no ventilation during apnoea.</text></svg>