<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 416" role="img" aria-labelledby="fig-r3-03-coherence-print-title" aria-describedby="fig-r3-03-coherence-print-desc"><title id="fig-r3-03-coherence-print-title">Loss of hemodynamic coherence</title><desc id="fig-r3-03-coherence-print-desc">Two panels. The left panel, large vessels, shows MAP and cardiac output moving into the normal range. The right panel, small vessels, shows a network of capillaries in which some are filled with moving red cells and others are empty or show stopped or intermittent flow: flow stays heterogeneous. Heterogeneous microvascular flow has been observed in septic patients and was more severe in patients who died, an association, not proof of cause. Hemodynamic coherence is a framework, not an established finding. Labeled observed association, not a causal model; conceptual only; not a treatment target.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r3-03-coherence-print-t-ink{fill:#172d38}.fig-r3-03-coherence-print-t-muted{fill:#526671}.fig-r3-03-coherence-print-t-teal{fill:#077578}.fig-r3-03-coherence-print-t-red{fill:#af4639}.fig-r3-03-coherence-print-t-gold{fill:#996613}.fig-r3-03-coherence-print-bg{fill:#ffffff}.fig-r3-03-coherence-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r3-03-coherence-print-s-teal{stroke:#077578;fill:none}.fig-r3-03-coherence-print-f-teal{fill:#077578}.fig-r3-03-coherence-print-s-red{stroke:#af4639;fill:none}.fig-r3-03-coherence-print-f-red{fill:#af4639}.fig-r3-03-coherence-print-s-gold{stroke:#996613;fill:none}.fig-r3-03-coherence-print-f-gold{fill:#996613}.fig-r3-03-coherence-print-s-muted{stroke:#526671;fill:none}.fig-r3-03-coherence-print-f-muted{fill:#526671}.fig-r3-03-coherence-print-s-rule{stroke:#d5dedc;fill:none}.fig-r3-03-coherence-print-f-rule{fill:#d5dedc}.fig-r3-03-coherence-print-s-ink{stroke:#172d38;fill:none}.fig-r3-03-coherence-print-f-ink{fill:#172d38}.fig-r3-03-coherence-print-f-tt{fill:#ddedea}.fig-r3-03-coherence-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r3-03-coherence-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r3-03-coherence-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r3-03-coherence-print-bg" width="700" height="416"/><text class="fig-r3-03-coherence-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">SEPTIC SHOCK</text><text class="fig-r3-03-coherence-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">Loss of hemodynamic coherence</text><text class="fig-r3-03-coherence-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Observed association, not a causal model. Conceptual only.</text><rect class="fig-r3-03-coherence-print-pn" x="16.0" y="93.0" width="327.0" height="230.0" rx="6"/><text class="fig-r3-03-coherence-print-t-ink" x="30.0" y="117.0" font-size="14" font-weight="600" text-anchor="start">Large vessels</text><text class="fig-r3-03-coherence-print-t-ink" x="30.0" y="156.0" font-size="13" text-anchor="start">MAP</text><rect class="fig-r3-03-coherence-print-f-rt" x="144" y="145" width="79.7" height="12" rx="3"/><rect class="fig-r3-03-coherence-print-f-tt" x="223.7" y="145" width="97.4" height="12" rx="3"/><path class="fig-r3-03-coherence-print-s-teal" d="M170.6,151 H271.4" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-03-coherence-print-ah)"/><circle class="fig-r3-03-coherence-print-f-teal" cx="276.8" cy="151" r="5"/><text class="fig-r3-03-coherence-print-t-ink" x="30.0" y="208.0" font-size="13" text-anchor="start">Cardiac output</text><rect class="fig-r3-03-coherence-print-f-rt" x="144" y="197" width="79.7" height="12" rx="3"/><rect class="fig-r3-03-coherence-print-f-tt" x="223.7" y="197" width="97.4" height="12" rx="3"/><path class="fig-r3-03-coherence-print-s-teal" d="M170.6,203 H271.4" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-03-coherence-print-ah)"/><circle class="fig-r3-03-coherence-print-f-teal" cx="276.8" cy="203" r="5"/><text class="fig-r3-03-coherence-print-t-teal" x="30.0" y="305.0" font-size="13" font-weight="600" text-anchor="start">Restored into the normal range</text><rect class="fig-r3-03-coherence-print-pn" x="357.0" y="93.0" width="327.0" height="230.0" rx="6"/><text class="fig-r3-03-coherence-print-t-ink" x="371.0" y="117.0" font-size="14" font-weight="600" text-anchor="start">Small vessels</text><path class="fig-r3-03-coherence-print-s-red" d="M375.0,143 C462.3,133 549.6,153 666.0,143" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse class="fig-r3-03-coherence-print-f-red" cx="387.0" cy="142" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="435.5" cy="146" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="484.0" cy="142" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="532.5" cy="146" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="581.0" cy="142" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="629.5" cy="146" rx="5" ry="3.5"/><path class="fig-r3-03-coherence-print-s-muted" d="M375.0,165 C462.3,155 549.6,175 666.0,165" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r3-03-coherence-print-s-red" d="M375.0,187 C462.3,177 549.6,197 666.0,187" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse class="fig-r3-03-coherence-print-f-red" cx="387.0" cy="186" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="435.5" cy="190" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="484.0" cy="186" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="532.5" cy="190" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="581.0" cy="186" rx="5" ry="3.5"/><ellipse class="fig-r3-03-coherence-print-f-red" cx="629.5" cy="190" rx="5" ry="3.5"/><path class="fig-r3-03-coherence-print-s-muted" d="M375.0,209 C462.3,199 549.6,219 666.0,209" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><ellipse class="fig-r3-03-coherence-print-f-red" cx="379.0" cy="233" rx="5" ry="3.5"/><text class="fig-r3-03-coherence-print-t-ink" x="391.0" y="237.0" font-size="13" text-anchor="start">perfused</text><path class="fig-r3-03-coherence-print-s-muted" d="M487.0,233 h22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r3-03-coherence-print-t-ink" x="517.0" y="237.0" font-size="13" text-anchor="start">stopped or</text><text class="fig-r3-03-coherence-print-t-ink" x="517.0" y="253.0" font-size="13" text-anchor="start">intermittent</text><text class="fig-r3-03-coherence-print-t-red" x="371.0" y="307.0" font-size="13" font-weight="600" text-anchor="start">Flow stays heterogeneous</text><rect class="fig-r3-03-coherence-print-f-tt" x="16.0" y="335.0" width="668.0" height="69.0" rx="6"/><text class="fig-r3-03-coherence-print-t-ink" x="28.0" y="355.0" font-size="13" text-anchor="start">Heterogeneous flow is observed in septic patients and was worse in those who died:</text><text class="fig-r3-03-coherence-print-t-ink" x="28.0" y="372.0" font-size="13" text-anchor="start">an association, not proof of cause. Coherence is a framework for reading monitoring,</text><text class="fig-r3-03-coherence-print-t-ink" x="28.0" y="389.0" font-size="13" text-anchor="start">not an established finding. Not a treatment target.</text></svg>