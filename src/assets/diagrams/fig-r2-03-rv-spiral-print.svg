<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 397" role="img" aria-labelledby="fig-r2-03-rv-spiral-print-title" aria-describedby="fig-r2-03-rv-spiral-print-desc"><title id="fig-r2-03-rv-spiral-print-title">The right ventricular spiral</title><desc id="fig-r2-03-rv-spiral-print-desc">Simplified teaching model. A loop of four boxes: lower systemic pressure leads to reduced right coronary perfusion, then a weaker right ventricle, then lower cardiac output, which returns to lower systemic pressure; each step worsens the next. From a panel outside the loop, hypoxaemia, hypercapnia and positive pressure raise pulmonary vascular resistance and add load to the weaker right ventricle. A side panel shows Patient R, with right ventricular perfusion approximated as mean arterial pressure minus central venous pressure: before induction 71 minus 18 equals 53 mm Hg; if mean arterial pressure falls to 55, 55 minus 18 equals 37 mm Hg. The approximation is a teaching simplification; the true driving pressure varies through the cardiac cycle.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-03-rv-spiral-print-t-ink{fill:#172d38}.fig-r2-03-rv-spiral-print-t-muted{fill:#526671}.fig-r2-03-rv-spiral-print-t-teal{fill:#077578}.fig-r2-03-rv-spiral-print-t-red{fill:#af4639}.fig-r2-03-rv-spiral-print-t-gold{fill:#996613}.fig-r2-03-rv-spiral-print-bg{fill:#ffffff}.fig-r2-03-rv-spiral-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r2-03-rv-spiral-print-s-teal{stroke:#077578;fill:none}.fig-r2-03-rv-spiral-print-f-teal{fill:#077578}.fig-r2-03-rv-spiral-print-s-red{stroke:#af4639;fill:none}.fig-r2-03-rv-spiral-print-f-red{fill:#af4639}.fig-r2-03-rv-spiral-print-s-gold{stroke:#996613;fill:none}.fig-r2-03-rv-spiral-print-f-gold{fill:#996613}.fig-r2-03-rv-spiral-print-s-muted{stroke:#526671;fill:none}.fig-r2-03-rv-spiral-print-f-muted{fill:#526671}.fig-r2-03-rv-spiral-print-s-rule{stroke:#d5dedc;fill:none}.fig-r2-03-rv-spiral-print-f-rule{fill:#d5dedc}.fig-r2-03-rv-spiral-print-s-ink{stroke:#172d38;fill:none}.fig-r2-03-rv-spiral-print-f-ink{fill:#172d38}.fig-r2-03-rv-spiral-print-f-tt{fill:#ddedea}.fig-r2-03-rv-spiral-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r2-03-rv-spiral-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-03-rv-spiral-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-03-rv-spiral-print-bg" width="700" height="397"/><text class="fig-r2-03-rv-spiral-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">The right ventricular spiral</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Simplified teaching model.</text><rect class="fig-r2-03-rv-spiral-print-pn" x="16.0" y="93.0" width="160.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-ink" x="96.0" y="121.0" font-size="14" font-weight="600" text-anchor="middle">Lower systemic</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="96.0" y="139.0" font-size="14" font-weight="600" text-anchor="middle">pressure</text><rect class="fig-r2-03-rv-spiral-print-pn" x="212.0" y="93.0" width="160.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-ink" x="292.0" y="121.0" font-size="14" font-weight="600" text-anchor="middle">Reduced right</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="292.0" y="139.0" font-size="14" font-weight="600" text-anchor="middle">coronary perfusion</text><rect class="fig-r2-03-rv-spiral-print-pn" x="212.0" y="199.0" width="160.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-red" x="292.0" y="227.0" font-size="14" font-weight="600" text-anchor="middle">Weaker right</text><text class="fig-r2-03-rv-spiral-print-t-red" x="292.0" y="245.0" font-size="14" font-weight="600" text-anchor="middle">ventricle</text><rect class="fig-r2-03-rv-spiral-print-pn" x="16.0" y="199.0" width="160.0" height="62.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-ink" x="96.0" y="227.0" font-size="14" font-weight="600" text-anchor="middle">Lower cardiac</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="96.0" y="245.0" font-size="14" font-weight="600" text-anchor="middle">output</text><path class="fig-r2-03-rv-spiral-print-s-muted" d="M179,124.0 H208" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><path class="fig-r2-03-rv-spiral-print-s-muted" d="M292.0,158 V195" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><path class="fig-r2-03-rv-spiral-print-s-muted" d="M209,230.0 H180" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><path class="fig-r2-03-rv-spiral-print-s-muted" d="M96.0,196 V159" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><text class="fig-r2-03-rv-spiral-print-t-muted" x="194.0" y="182.0" font-size="13" text-anchor="middle">each step worsens the next</text><path class="fig-r2-03-rv-spiral-print-s-red" d="M292.0,285 V265" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><rect class="fig-r2-03-rv-spiral-print-f-rt" x="16.0" y="287.0" width="356.0" height="96.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-red" x="28.0" y="309.0" font-size="13.5" font-weight="600" text-anchor="start">Raise pulmonary vascular resistance</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="28.0" y="331.0" font-size="14" font-weight="600" text-anchor="start">Hypoxaemia, hypercapnia</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="28.0" y="350.0" font-size="14" font-weight="600" text-anchor="start">and positive pressure</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="28.0" y="371.0" font-size="13" text-anchor="start">add load to the weaker right ventricle</text><rect class="fig-r2-03-rv-spiral-print-pn" x="396" y="93" width="288" height="290.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-teal" x="412.0" y="115.0" font-size="13.5" font-weight="600" text-anchor="start">Patient R: RV perfusion</text><text class="fig-r2-03-rv-spiral-print-t-teal" x="412.0" y="133.0" font-size="13.5" font-weight="600" text-anchor="start">approximated as MAP − CVP</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="412.0" y="163.0" font-size="13" text-anchor="start">Before induction</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="412.0" y="183.0" font-size="15" font-weight="600" text-anchor="start">MAP 71 − CVP 18 = 53 mm Hg</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="412.0" y="211.0" font-size="13" text-anchor="start">If MAP falls to 55</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="412.0" y="231.0" font-size="15" font-weight="600" text-anchor="start">55 − 18 = 37 mm Hg</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="412.0" y="261.0" font-size="13" text-anchor="start">A teaching simplification:</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="412.0" y="277.0" font-size="13" text-anchor="start">true driving pressure varies</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="412.0" y="293.0" font-size="13" text-anchor="start">through the cardiac cycle.</text><rect class="fig-r2-03-rv-spiral-print-f-teal" x="396.0" y="93.0" width="5" height="290.0" rx="2"/></svg>