<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 518" role="img" aria-labelledby="fig-r2-03-rv-spiral-print-title" aria-describedby="fig-r2-03-rv-spiral-print-desc"><title id="fig-r2-03-rv-spiral-print-title">The right ventricular spiral</title><desc id="fig-r2-03-rv-spiral-print-desc">Simplified teaching model. Hypoxemia, hypercapnia, lung collapse and overinflation raise pulmonary vascular resistance, which feeds greater right ventricular load. Greater load leads into a directional loop: right ventricular dilation and wall stress, then reduced right ventricular perfusion and contraction, then reduced left ventricular filling and lower systemic pressure, then further reduced right ventricular perfusion, which returns to more dilation and wall stress. Unless interrupted, the loop can sustain itself.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-03-rv-spiral-print-t-ink{fill:#172d38}.fig-r2-03-rv-spiral-print-t-muted{fill:#526671}.fig-r2-03-rv-spiral-print-t-teal{fill:#077578}.fig-r2-03-rv-spiral-print-t-red{fill:#af4639}.fig-r2-03-rv-spiral-print-t-gold{fill:#996613}.fig-r2-03-rv-spiral-print-bg{fill:#ffffff}.fig-r2-03-rv-spiral-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r2-03-rv-spiral-print-s-teal{stroke:#077578;fill:none}.fig-r2-03-rv-spiral-print-f-teal{fill:#077578}.fig-r2-03-rv-spiral-print-s-red{stroke:#af4639;fill:none}.fig-r2-03-rv-spiral-print-f-red{fill:#af4639}.fig-r2-03-rv-spiral-print-s-gold{stroke:#996613;fill:none}.fig-r2-03-rv-spiral-print-f-gold{fill:#996613}.fig-r2-03-rv-spiral-print-s-muted{stroke:#526671;fill:none}.fig-r2-03-rv-spiral-print-f-muted{fill:#526671}.fig-r2-03-rv-spiral-print-s-rule{stroke:#d5dedc;fill:none}.fig-r2-03-rv-spiral-print-f-rule{fill:#d5dedc}.fig-r2-03-rv-spiral-print-s-ink{stroke:#172d38;fill:none}.fig-r2-03-rv-spiral-print-f-ink{fill:#172d38}.fig-r2-03-rv-spiral-print-f-tt{fill:#ddedea}.fig-r2-03-rv-spiral-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r2-03-rv-spiral-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-03-rv-spiral-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-03-rv-spiral-print-bg" width="700" height="518"/><text class="fig-r2-03-rv-spiral-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">The right ventricular spiral</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Simplified teaching model.</text><rect class="fig-r2-03-rv-spiral-print-f-rt" x="16.0" y="93.0" width="668.0" height="53.0" rx="6"/><rect class="fig-r2-03-rv-spiral-print-f-red" x="16.0" y="93.0" width="5" height="53.0" rx="2"/><text class="fig-r2-03-rv-spiral-print-t-ink" x="350.0" y="119.0" font-size="14" font-weight="600" text-anchor="middle">Hypoxemia, hypercapnia, lung collapse and</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="350.0" y="136.5" font-size="14" font-weight="600" text-anchor="middle">overinflation raise pulmonary vascular resistance</text><path class="fig-r2-03-rv-spiral-print-s-red" d="M350.0,149.0 V176.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><rect class="fig-r2-03-rv-spiral-print-pn" x="230.0" y="180.0" width="240.0" height="44.0" rx="6"/><rect class="fig-r2-03-rv-spiral-print-f-red" x="230.0" y="180.0" width="5" height="44.0" rx="2"/><text class="fig-r2-03-rv-spiral-print-t-red" x="350.0" y="207.0" font-size="15" font-weight="600" text-anchor="middle">Greater RV load</text><path class="fig-r2-03-rv-spiral-print-s-muted" d="M350.0,227.0 V254.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><rect class="fig-r2-03-rv-spiral-print-pn" x="240.0" y="258.0" width="220.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-ink" x="350.0" y="289.3" font-size="14" font-weight="600" text-anchor="middle">RV dilation</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="350.0" y="306.8" font-size="14" font-weight="600" text-anchor="middle">and wall stress</text><rect class="fig-r2-03-rv-spiral-print-pn" x="440.0" y="346.0" width="220.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-red" x="550.0" y="368.5" font-size="14" font-weight="600" text-anchor="middle">Reduced RV</text><text class="fig-r2-03-rv-spiral-print-t-red" x="550.0" y="386.0" font-size="14" font-weight="600" text-anchor="middle">perfusion and</text><text class="fig-r2-03-rv-spiral-print-t-red" x="550.0" y="403.5" font-size="14" font-weight="600" text-anchor="middle">contraction</text><rect class="fig-r2-03-rv-spiral-print-pn" x="240.0" y="434.0" width="220.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-ink" x="350.0" y="456.5" font-size="14" font-weight="600" text-anchor="middle">Reduced LV</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="350.0" y="474.0" font-size="14" font-weight="600" text-anchor="middle">filling and lower</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="350.0" y="491.5" font-size="14" font-weight="600" text-anchor="middle">systemic pressure</text><rect class="fig-r2-03-rv-spiral-print-pn" x="40.0" y="346.0" width="220.0" height="70.0" rx="6"/><text class="fig-r2-03-rv-spiral-print-t-ink" x="150.0" y="377.3" font-size="14" font-weight="600" text-anchor="middle">Further reduced</text><text class="fig-r2-03-rv-spiral-print-t-ink" x="150.0" y="394.8" font-size="14" font-weight="600" text-anchor="middle">RV perfusion</text><path class="fig-r2-03-rv-spiral-print-s-muted" d="M464.0,293.0 Q550.0,293.0 550.0,342.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><path class="fig-r2-03-rv-spiral-print-s-muted" d="M550.0,420.0 Q550.0,469.0 464.0,469.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><path class="fig-r2-03-rv-spiral-print-s-muted" d="M236.0,469.0 Q150.0,469.0 150.0,420.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><path class="fig-r2-03-rv-spiral-print-s-muted" d="M150.0,342.0 Q150.0,293.0 236.0,293.0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r2-03-rv-spiral-print-ah)"/><text class="fig-r2-03-rv-spiral-print-t-muted" x="350.0" y="369.7" font-size="13" text-anchor="middle">Unless interrupted,</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="350.0" y="385.7" font-size="13" text-anchor="middle">the loop can</text><text class="fig-r2-03-rv-spiral-print-t-muted" x="350.0" y="401.7" font-size="13" text-anchor="middle">sustain itself.</text></svg>