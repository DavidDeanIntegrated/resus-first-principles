<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 847" role="img" aria-labelledby="fig-r3-02-where-fluid-goes-screen-title" aria-describedby="fig-r3-02-where-fluid-goes-screen-desc"><title id="fig-r3-02-where-fluid-goes-screen-title">Where given fluid goes in sepsis</title><desc id="fig-r3-02-where-fluid-goes-screen-desc">Titled where given fluid goes in sepsis. A schematic of a blood vessel with fluid entering from an intravenous line. Arrows show some fluid remaining in the vessel and more fluid passing through the vessel wall into the surrounding tissue, labeled lung, gut and kidney; the label leaking wall appears only beside the leak arrow, and normal filtration returning through the lymphatics is shown separately. An inset shows two magnified sections of vessel lining, one with a thick intact glycocalyx layer and one with a thin, patchy layer. No numbers or proportions are shown.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r3-02-where-fluid-goes-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r3-02-where-fluid-goes-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r3-02-where-fluid-goes-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r3-02-where-fluid-goes-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r3-02-where-fluid-goes-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r3-02-where-fluid-goes-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r3-02-where-fluid-goes-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r3-02-where-fluid-goes-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r3-02-where-fluid-goes-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r3-02-where-fluid-goes-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r3-02-where-fluid-goes-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r3-02-where-fluid-goes-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r3-02-where-fluid-goes-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r3-02-where-fluid-goes-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r3-02-where-fluid-goes-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r3-02-where-fluid-goes-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r3-02-where-fluid-goes-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r3-02-where-fluid-goes-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r3-02-where-fluid-goes-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r3-02-where-fluid-goes-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r3-02-where-fluid-goes-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r3-02-where-fluid-goes-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r3-02-where-fluid-goes-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r3-02-where-fluid-goes-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r3-02-where-fluid-goes-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r3-02-where-fluid-goes-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r3-02-where-fluid-goes-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r3-02-where-fluid-goes-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r3-02-where-fluid-goes-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r3-02-where-fluid-goes-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r3-02-where-fluid-goes-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r3-02-where-fluid-goes-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r3-02-where-fluid-goes-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r3-02-where-fluid-goes-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r3-02-where-fluid-goes-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r3-02-where-fluid-goes-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r3-02-where-fluid-goes-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r3-02-where-fluid-goes-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r3-02-where-fluid-goes-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r3-02-where-fluid-goes-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r3-02-where-fluid-goes-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r3-02-where-fluid-goes-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r3-02-where-fluid-goes-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r3-02-where-fluid-goes-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r3-02-where-fluid-goes-screen-bg" width="360" height="847"/><text class="fig-r3-02-where-fluid-goes-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">SEPTIC SHOCK</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">Where given fluid goes</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="12.0" y="74.0" font-size="19" font-weight="600" text-anchor="start">in sepsis</text><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="12.0" y="94.0" font-size="12.5" text-anchor="start">Schematic only; no proportions are shown.</text><text class="fig-r3-02-where-fluid-goes-screen-t-teal" x="12.0" y="131.0" font-size="13" font-weight="600" text-anchor="start">Fluid given</text><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M102,127 H134" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-screen-ah)"/><rect class="fig-r3-02-where-fluid-goes-screen-f-rt" x="12" y="147" width="336" height="44" rx="22"/><path class="fig-r3-02-where-fluid-goes-screen-s-red" d="M32,147 H328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r3-02-where-fluid-goes-screen-s-red" d="M32,191 H328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="34.0" y="174.0" font-size="13" font-weight="600" text-anchor="start">Part stays in the vessel</text><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M288,169 h40" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-screen-ah)"/><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M52,195 V249" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-screen-ah)"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="62.0" y="221.0" font-size="12.5" font-weight="600" text-anchor="start">normal filtration</text><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="62.0" y="237.0" font-size="12.5" text-anchor="start">(solid line)</text><path class="fig-r3-02-where-fluid-goes-screen-s-red" d="M223.20000000000002,195 V249" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#fig-r3-02-where-fluid-goes-screen-ah)"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="233.2" y="209.0" font-size="12.5" font-weight="600" text-anchor="start">leak</text><text class="fig-r3-02-where-fluid-goes-screen-t-red" x="233.2" y="225.0" font-size="12.5" text-anchor="start">leaking wall</text><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="233.2" y="241.0" font-size="12.5" text-anchor="start">(dashed line)</text><rect class="fig-r3-02-where-fluid-goes-screen-f-rt" x="12.0" y="253.0" width="174.7" height="44.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="24.0" y="280.0" font-size="13.5" font-weight="600" text-anchor="start">Interstitium</text><rect class="fig-r3-02-where-fluid-goes-screen-f-tt" x="220.7" y="253.0" width="127.3" height="44.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="230.7" y="280.0" font-size="13.5" font-weight="600" text-anchor="start">Lymphatics</text><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M190.72,275.0 H216.72" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-screen-ah)"/><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M334.0,249 V195" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-screen-ah)"/><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="324.0" y="205.0" font-size="12.5" text-anchor="end">returns</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="12.0" y="321.0" font-size="13" font-weight="600" text-anchor="start">Much of it leaves the vessels, as normal</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="12.0" y="338.0" font-size="13" font-weight="600" text-anchor="start">filtration and as leak; filtered fluid</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="12.0" y="355.0" font-size="13" font-weight="600" text-anchor="start">returns mainly through the lymphatics.</text><rect class="fig-r3-02-where-fluid-goes-screen-pn" x="12.0" y="380.0" width="336.0" height="104.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-screen-f-gold" x="12.0" y="380.0" width="5" height="104.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="26.0" y="400.0" font-size="14" font-weight="600" text-anchor="start">Lung</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="100.0" y="400.0" font-size="12.5" text-anchor="start">In the lung, interstitial water</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="100.0" y="416.0" font-size="12.5" text-anchor="start">lengthens the path oxygen must cross;</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="100.0" y="432.0" font-size="12.5" text-anchor="start">flooded or collapsed alveoli add low</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="100.0" y="448.0" font-size="12.5" text-anchor="start">V/Q and shunt (see the acute</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="100.0" y="464.0" font-size="12.5" text-anchor="start">respiratory failure chapter).</text><rect class="fig-r3-02-where-fluid-goes-screen-pn" x="12.0" y="490.0" width="336.0" height="40.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-screen-f-gold" x="12.0" y="490.0" width="5" height="40.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="26.0" y="510.0" font-size="14" font-weight="600" text-anchor="start">Gut wall</text><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="100.0" y="510.0" font-size="12.5" text-anchor="start">Interstitial pressure rises.</text><rect class="fig-r3-02-where-fluid-goes-screen-pn" x="12.0" y="536.0" width="336.0" height="56.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-screen-f-gold" x="12.0" y="536.0" width="5" height="56.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="26.0" y="556.0" font-size="14" font-weight="600" text-anchor="start">Kidney</text><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="100.0" y="556.0" font-size="12.5" text-anchor="start">Tissue pressure can rise inside the</text><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="100.0" y="572.0" font-size="12.5" text-anchor="start">capsule.</text><rect class="fig-r3-02-where-fluid-goes-screen-pn" x="12.0" y="604.0" width="336.0" height="150.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-screen-t-teal" x="26.0" y="626.0" font-size="13.5" font-weight="600" text-anchor="start">Inset: vessel lining</text><rect class="fig-r3-02-where-fluid-goes-screen-f-muted" x="26.0" y="704" width="147.0" height="10" rx="2" opacity="0.6"/><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M31.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M40.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M49.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M58.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M67.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M76.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M85.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M94.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M103.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M112.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M121.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M130.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M139.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M148.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M157.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M166.0,704 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="26.0" y="734.0" font-size="12.5" font-weight="600" text-anchor="start">Intact glycocalyx</text><rect class="fig-r3-02-where-fluid-goes-screen-f-muted" x="187.0" y="704" width="147.0" height="10" rx="2" opacity="0.6"/><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M192.0,704 v-12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M219.0,704 v-18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M246.0,704 v-12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M273.0,704 v-18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M300.0,704 v-12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-screen-s-teal" d="M327.0,704 v-18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r3-02-where-fluid-goes-screen-t-red" x="187.0" y="734.0" font-size="12.5" font-weight="600" text-anchor="start">Shed in sepsis</text><text class="fig-r3-02-where-fluid-goes-screen-t-muted" x="26.0" y="646.0" font-size="12.5" text-anchor="start">Gel-like layer lining the vessel</text><rect class="fig-r3-02-where-fluid-goes-screen-f-tt" x="12.0" y="766.0" width="336.0" height="69.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="24.0" y="786.0" font-size="13" text-anchor="start">Shedding is observed; how much of the leak</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="24.0" y="803.0" font-size="13" text-anchor="start">it explains in humans is uncertain.</text><text class="fig-r3-02-where-fluid-goes-screen-t-ink" x="24.0" y="820.0" font-size="13" text-anchor="start">Not a treatment target.</text></svg>