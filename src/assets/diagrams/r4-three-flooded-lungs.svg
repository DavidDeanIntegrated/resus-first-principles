<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 726" role="img" aria-labelledby="fig-r4-01-three-flooded-lungs-screen-title" aria-describedby="fig-r4-01-three-flooded-lungs-screen-desc"><title id="fig-r4-01-three-flooded-lungs-screen-title">Same lungs, three circulations</title><desc id="fig-r4-01-three-flooded-lungs-screen-desc">Three simple circuit diagrams, each with lungs, a heart and the body; all three lungs are shaded to show fluid. Patient S, sudden onset: narrowed arteries; MAP 150, weight change 0 kg, shock index 0.58; high pressure with no water gained. Patient F, ten days off his diuretic: swollen legs; MAP 96, weight change plus 6 kg; water gained over days. Patient K, after a myocardial infarction: a small heart output and low forward flow; MAP 68, shock index 1.37, lactate 5.0 mmol/L; the pump is failing. A note reads: all three lungs hold fluid; pressure, water and flow differ, and the image cannot tell them apart. Illustrative teaching numbers; schematic circuits.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-01-three-flooded-lungs-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r4-01-three-flooded-lungs-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r4-01-three-flooded-lungs-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r4-01-three-flooded-lungs-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r4-01-three-flooded-lungs-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r4-01-three-flooded-lungs-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r4-01-three-flooded-lungs-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r4-01-three-flooded-lungs-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r4-01-three-flooded-lungs-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r4-01-three-flooded-lungs-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r4-01-three-flooded-lungs-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r4-01-three-flooded-lungs-screen-s-gold{stro