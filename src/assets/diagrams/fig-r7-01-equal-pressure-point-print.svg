<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 556" width="6.9in" height="5.48in" role="img" aria-labelledby="fig-r7-01-equal-pressure-point-print-title" aria-describedby="fig-r7-01-equal-pressure-point-print-desc"><title id="fig-r7-01-equal-pressure-point-print-title">Why pushing harder stops helping: pressure along a narrowed airway</title><desc id="fig-r7-01-equal-pressure-point-print-desc">Two schematic airways run from an alveolus to the mouth inside a pleural space whose pressure is the same all around. In the normal airway, pressure falls gradually from higher at the alveolus to lower at the mouth and stays above pleural pressure, so the airway stays open. In the narrowed airway, pressure falls faster and drops to pleural pressure at a point marked the equal pressure point; downstream the airway wall is drawn pinched, labeled airway squeezed here. An inset graph of expiratory effort against expiratory flow, with no numbers, shows flow rising and then flattening, labeled flow limited, because more effort raises pleural pressure too.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r7-01-equal-pressure-point-print-h)}</style><defs><marker id="fig-r7-01-equal-pressure-point-print-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r7-01-equal-pressure-point-print-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="700" height="556"/><g transform="translate(10,10)"><text x="0" y="16" font-size="12.4" text-anchor="start" font-weight="700" class="t-teal">LIFE-THREATENING ASTHMA</text><text x="0" y="40" font-size="19" text-anchor="start" font-weight="700" class="t-ink">Why pushing harder stops</text><text x="0" y="64" font-size="19" text-anchor="start" font-weight="700" class="t-ink">helping</text><text x="0" y="88" font-size="13" text-anchor="start" font-weight="400" class="t-muted">Pressure along a normal and a narrowed airway</text><text x="0" y="106" font-size="13" text-anchor="start" font-weight="400" class="t-muted">during a forced exhalation (schematic).</text></g><g transform="translate(10,142)"><rect x="0" y="0" width="340" height="216" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Normal airway</text><rect x="40" y="36" width="290" height="70" rx="4" class="pn" stroke-dasharray="4 3"/><text x="46" y="52" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">pleural pressure (same all around)</text><circle cx="26" cy="78" r="16" class="s-teal" stroke-width="2"/><text x="26" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">alveolus</text><path d="M42,66 L330,66 M42,90 L330,90" class="s-teal" stroke-width="2"/><text x="186" y="82" font-size="12.4" text-anchor="middle" font-weight="400" class="t-ink">airway stays open</text><text x="12" y="158" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">airway pressure</text><line x1="40" y1="190" x2="330" y2="190" class="s-muted" stroke-width="1.5" stroke-dasharray="5 3"/><text x="44" y="206" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">pleural pressure (dashed)</text><path d="M42,166 L330,178" class="s-ink" stroke-width="2.5"/><text x="120" y="164" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">higher → lower</text></g><g transform="translate(350,142)"><rect x="0" y="0" width="340" height="216" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Narrowed airway</text><rect x="40" y="36" width="290" height="70" rx="4" class="pn" stroke-dasharray="4 3"/><text x="46" y="52" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">pleural pressure (same all around)</text><circle cx="26" cy="78" r="16" class="s-teal" stroke-width="2"/><text x="26" y="118" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">alveolus</text><path d="M42,64 L200,70 Q230,80 260,74 L330,70 M42,92 L200,86 Q230,77 260,82 L330,86" class="s-teal" stroke-width="2"/><line x1="230" y1="66" x2="230" y2="94" class="s-red" stroke-width="2" stroke-dasharray="3 2"/><text x="232" y="130" font-size="12.4" text-anchor="middle" font-weight="700" class="t-red">equal pressure point</text><text x="232" y="145" font-size="12.4" text-anchor="middle" font-weight="400" class="t-ink">airway squeezed here</text><text x="12" y="158" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">airway pressure</text><line x1="40" y1="190" x2="330" y2="190" class="s-muted" stroke-width="1.5" stroke-dasharray="5 3"/><text x="44" y="206" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">pleural pressure (dashed)</text><path d="M42,166 L230,190 L330,198" class="s-ink" stroke-width="2.5"/><circle cx="230" cy="190" r="4" class="f-red"/></g><g transform="translate(10,372)"><rect x="0" y="0" width="340" height="170" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Effort versus flow (qualitative)</text><line x1="50" y1="140" x2="320" y2="140" class="s-ink" stroke-width="1.5" marker-end="url(#fig-r7-01-equal-pressure-point-print-ar)"/><line x1="50" y1="140" x2="50" y2="40" class="s-ink" stroke-width="1.5" marker-end="url(#fig-r7-01-equal-pressure-point-print-ar)"/><text x="185" y="160" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">expiratory effort →</text><text x="44" y="54" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">flow</text><path d="M52,138 C100,70 140,60 200,58 L316,58" class="s-teal" stroke-width="2.5"/><text x="250" y="50" font-size="12.4" text-anchor="middle" font-weight="700" class="t-ink">flow limited</text><text x="150" y="96" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">more effort raises</text><text x="150" y="111" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">pleural pressure too</text></g></svg>