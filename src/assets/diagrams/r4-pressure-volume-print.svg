<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 765" role="img" aria-labelledby="fig-r4-02-pressure-volume-print-title" aria-describedby="fig-r4-02-pressure-volume-print-desc"><title id="fig-r4-02-pressure-volume-print-title">A preserved ejection fraction does not mean a normal filling pressure</title><desc id="fig-r4-02-pressure-volume-print-desc">A graph with ventricular volume on the horizontal axis and diastolic pressure on the vertical axis, without numbers. Two curves rise from left to right. The lower, flatter curve is labeled compliant ventricle. The upper, steeper curve is labeled stiff ventricle. On each curve, a short horizontal arrow shows the same small increase in volume, and a vertical arrow shows the resulting rise in pressure, which is small on the compliant curve and large on the stiff curve.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-02-pressure-volume-print-t-ink{fill:#172d38}.fig-r4-02-pressure-volume-print-t-muted{fill:#526671}.fig-r4-02-pressure-volume-print-t-teal{fill:#077578}.fig-r4-02-pressure-volume-print-t-red{fill:#af4639}.fig-r4-02-pressure-volume-print-t-gold{fill:#996613}.fig-r4-02-pressure-volume-print-bg{fill:#ffffff}.fig-r4-02-pressure-volume-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-02-pressure-volume-print-s-teal{stroke:#077578;fill:none}.fig-r4-02-pressure-volume-print-f-teal{fill:#077578}.fig-r4-02-pressure-volume-print-s-red{stroke:#af4639;fill:none}.fig-r4-02-pressure-volume-print-f-red{fill:#af4639}.fig-r4-02-pressure-volume-print-s-gold{stroke:#996613;fill:none}.fig-r4-02-pressure-volume-print-f-gold{fill:#996613}.fig-r4-02-pressure-volume-print-s-muted{stroke:#526671;fill:none}.fig-r4-02-pressure-volume-print-f-muted{fill:#526671}.fig-r4-02-pressure-volume-print-s-rule{stroke:#d5dedc;fill:none}.fig-r4-02-pressure-volume-print-f-rule{fill:#d5dedc}.fig-r4-02-pressure-volume-print-s-ink{stroke:#172d38;fill:none}.fig-r4-02-pressure-volume-print-f-ink{fill:#172d38}.fig-r4-02-pressure-volume-print-f-tt{fill:#ddedea}.fig-r4-02-pressure-volume-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r4-02-pressure-volume-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-02-pressure-volume-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-02-pressure-volume-print-bg" width="700" height="765"/><text class="fig-r4-02-pressure-volume-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">A preserved ejection fraction does not mean</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="74.0" font-size="20" font-weight="600" text-anchor="start">a normal filling pressure</text><text class="fig-r4-02-pressure-volume-print-t-muted" x="16.0" y="94.0" font-size="13.5" text-anchor="start">Schematic; no numeric axes.</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="133.0" font-size="13" font-weight="600" text-anchor="start">Diastolic pressure-volume curves</text><text class="fig-r4-02-pressure-volume-print-t-muted" x="18.0" y="157.0" font-size="13" text-anchor="start">Diastolic pressure</text><path class="fig-r4-02-pressure-volume-print-s-ink" d="M40,169 V417 H432.00000000000006" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r4-02-pressure-volume-print-t-muted" x="432.0" y="437.0" font-size="13" text-anchor="end">Ventricular volume</text><path class="fig-r4-02-pressure-volume-print-s-ink" d="M48.0,411.0 L57.4,410.0 L66.8,409.0 L76.2,407.9 L85.6,406.9 L95.0,405.7 L104.4,404.6 L113.8,403.3 L123.2,402.1 L132.6,400.8 L142.0,399.4 L151.4,398.0 L160.8,396.6 L170.2,395.1 L179.6,393.5 L189.0,391.9 L198.4,390.3 L207.8,388.6 L217.2,386.8 L226.6,384.9 L236.0,383.0 L245.4,381.0 L254.8,379.0 L264.2,376.9 L273.6,374.7 L283.0,372.4 L292.4,370.0 L301.8,367.6 L311.2,365.1 L320.6,362.4 L330.0,359.7 L339.4,356.9 L348.8,354.0 L358.2,351.0 L367.6,347.9 L377.0,344.6 L386.4,341.3 L395.8,337.8 L405.2,334.2 L414.6,330.5 L424.0,326.7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r4-02-pressure-volume-print-s-muted" d="M281.1,372.9 H324.2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-print-ah)"/><path class="fig-r4-02-pressure-volume-print-s-ink" d="M326.2,372.9 V364.8" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-print-ah)"/><path class="fig-r4-02-pressure-volume-print-s-ink" d="M48.0,411.0 L57.4,409.9 L66.8,408.7 L76.2,407.4 L85.6,406.1 L95.0,404.7 L104.4,403.2 L113.8,401.6 L123.2,399.9 L132.6,398.1 L142.0,396.2 L151.4,394.1 L160.8,391.9 L170.2,389.6 L179.6,387.1 L189.0,384.4 L198.4,381.5 L207.8,378.4 L217.2,375.1 L226.6,371.6 L236.0,367.7 L245.4,363.6 L254.8,359.2 L264.2,354.4 L273.6,349.3 L283.0,343.8 L292.4,337.8 L301.8,331.4 L311.2,324.5 L320.6,317.1 L330.0,309.0 L339.4,300.3 L348.8,290.9 L358.2,280.8 L367.6,269.8 L377.0,258.0 L386.4,245.2 L395.8,231.4 L405.2,216.5 L414.6,200.3 L424.0,182.8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r4-02-pressure-volume-print-s-muted" d="M281.1,344.9 H324.2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-print-ah)"/><path class="fig-r4-02-pressure-volume-print-s-ink" d="M326.2,344.9 V316.3" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-print-ah)"/><text class="fig-r4-02-pressure-volume-print-t-ink" x="52.0" y="187.0" font-size="13" font-weight="600" text-anchor="start">Stiff ventricle (thickened</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="52.0" y="203.9" font-size="13" font-weight="600" text-anchor="start">by years of hypertension,</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="52.0" y="220.8" font-size="13" font-weight="600" text-anchor="start">as in Patient S)</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="424.0" y="399.0" font-size="13" font-weight="600" text-anchor="end">Compliant ventricle</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="456.0" y="179.0" font-size="13" text-anchor="start">Near the top, a modest extra</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="456.0" y="195.9" font-size="13" text-anchor="start">volume can be the difference</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="456.0" y="212.8" font-size="13" text-anchor="start">between a normal left atrial</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="456.0" y="229.7" font-size="13" text-anchor="start">pressure and a flooded lung</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="463.0" font-size="13" font-weight="600" text-anchor="start">Same small volume rise: small pressure rise on the compliant curve, large on the</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="479.9" font-size="13" font-weight="600" text-anchor="start">stiff curve</text><rect class="fig-r4-02-pressure-volume-print-pn" x="16.0" y="502.8" width="668.0" height="150.0" rx="6"/><ellipse class="fig-r4-02-pressure-volume-print-s-ink" cx="56.0" cy="560.8" rx="23.25" ry="31.25" stroke-width="2.5"/><rect class="fig-r4-02-pressure-volume-print-f-ink" x="98.0" y="564.8" width="16.0" height="30.0" rx="2"/><line class="fig-r4-02-pressure-volume-print-s-muted" x1="92.0" y1="594.8" x2="120.0" y2="594.8" stroke-width="1.5"/><text class="fig-r4-02-pressure-volume-print-t-ink" x="26.0" y="620.8" font-size="13" font-weight="600" text-anchor="start">Empties well (preserved EF)</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="26.0" y="638.8" font-size="13" text-anchor="start">normal filling pressure</text><ellipse class="fig-r4-02-pressure-volume-print-s-ink" cx="390.0" cy="560.8" rx="26.0" ry="34.0" stroke-width="8"/><rect class="fig-r4-02-pressure-volume-print-f-ink" x="432.0" y="524.8" width="16.0" height="70.0" rx="2"/><line class="fig-r4-02-pressure-volume-print-s-muted" x1="426.0" y1="594.8" x2="454.0" y2="594.8" stroke-width="1.5"/><text class="fig-r4-02-pressure-volume-print-t-ink" x="360.0" y="620.8" font-size="13" font-weight="600" text-anchor="start">Empties well (preserved EF)</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="360.0" y="638.8" font-size="13" text-anchor="start">high filling pressure</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="668.8" font-size="13" text-anchor="start">Ejection fraction measures how completely the ventricle empties, not how easily it</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="685.7" font-size="13" text-anchor="start">fills.</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="704.6" font-size="13" font-weight="600" text-anchor="start">Patient S empties well and fills badly.</text><text class="fig-r4-02-pressure-volume-print-t-muted" x="16.0" y="725.5" font-size="13" text-anchor="start">Tachycardia and fast atrial fibrillation shorten diastole; ischemia makes the muscle</text><text class="fig-r4-02-pressure-volume-print-t-muted" x="16.0" y="742.4" font-size="13" text-anchor="start">stiffer; fast atrial fibrillation also removes the atrial contribution to filling.</text></svg>