<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 557" role="img" aria-labelledby="fig-r4-02-pressure-volume-print-title" aria-describedby="fig-r4-02-pressure-volume-print-desc"><title id="fig-r4-02-pressure-volume-print-title">A stiff ventricle: small volume rise, large pressure rise</title><desc id="fig-r4-02-pressure-volume-print-desc">A schematic graph with ventricular volume on the horizontal axis and diastolic pressure on the vertical axis, without numbers. Two curves rise from left to right. The lower, flatter curve is labeled compliant ventricle; the upper, steeper curve is labeled stiff ventricle. On each curve a short dashed horizontal line shows the same small increase in volume, and a vertical arrow shows the resulting rise in pressure, small on the compliant curve and large on the stiff curve. A note reads: ejection fraction shows how completely the ventricle empties, not how easily it fills; tachycardia, ischemia and fast atrial fibrillation make filling harder. Schematic; no numeric axes.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-02-pressure-volume-print-t-ink{fill:#172d38}.fig-r4-02-pressure-volume-print-t-muted{fill:#526671}.fig-r4-02-pressure-volume-print-t-teal{fill:#077578}.fig-r4-02-pressure-volume-print-t-red{fill:#af4639}.fig-r4-02-pressure-volume-print-t-gold{fill:#996613}.fig-r4-02-pressure-volume-print-bg{fill:#ffffff}.fig-r4-02-pressure-volume-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-02-pressure-volume-print-s-teal{stroke:#077578;fill:none}.fig-r4-02-pressure-volume-print-f-teal{fill:#077578}.fig-r4-02-pressure-volume-print-s-red{stroke:#af4639;fill:none}.fig-r4-02-pressure-volume-print-f-red{fill:#af4639}.fig-r4-02-pressure-volume-print-s-gold{stroke:#996613;fill:none}.fig-r4-02-pressure-volume-print-f-gold{fill:#996613}.fig-r4-02-pressure-volume-print-s-muted{stroke:#526671;fill:none}.fig-r4-02-pressure-volume-print-f-muted{fill:#526671}.fig-r4-02-pressure-volume-print-s-rule{stroke:#d5dedc;fill:none}.fig-r4-02-pressure-volume-print-f-rule{fill:#d5dedc}.fig-r4-02-pressure-volume-print-s-ink{stroke:#172d38;fill:none}.fig-r4-02-pressure-volume-print-f-ink{fill:#172d38}.fig-r4-02-pressure-volume-print-f-tt{fill:#ddedea}.fig-r4-02-pressure-volume-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r4-02-pressure-volume-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-02-pressure-volume-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-02-pressure-volume-print-bg" width="700" height="557"/><text class="fig-r4-02-pressure-volume-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">A stiff ventricle: small volume rise, large pressure rise</text><text class="fig-r4-02-pressure-volume-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Schematic; no numeric axes.</text><path class="fig-r4-02-pressure-volume-print-s-ink" d="M40,119 V419 H420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r4-02-pressure-volume-print-t-muted" x="420.0" y="439.0" font-size="13" text-anchor="end">Ventricular volume</text><text class="fig-r4-02-pressure-volume-print-t-muted" x="18.0" y="111.0" font-size="13" text-anchor="start">Diastolic pressure</text><path class="fig-r4-02-pressure-volume-print-s-teal" d="M48.0,413.0 L57.1,411.8 L66.2,410.6 L75.3,409.3 L84.4,408.0 L93.5,406.6 L102.6,405.2 L111.7,403.7 L120.8,402.2 L129.9,400.6 L139.0,399.0 L148.1,397.3 L157.2,395.6 L166.3,393.8 L175.4,391.9 L184.5,389.9 L193.6,387.9 L202.7,385.9 L211.8,383.7 L220.9,381.5 L230.0,379.2 L239.1,376.8 L248.2,374.3 L257.3,371.7 L266.4,369.1 L275.5,366.3 L284.6,363.4 L293.7,360.5 L302.8,357.4 L311.9,354.3 L321.0,351.0 L330.1,347.6 L339.2,344.1 L348.3,340.4 L357.4,336.6 L366.5,332.7 L375.6,328.7 L384.7,324.5 L393.8,320.2 L402.9,315.7 L412.0,311.0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r4-02-pressure-volume-print-s-ink" d="M273.7,366.9 H317.4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r4-02-pressure-volume-print-s-teal" d="M317.4,366.9 V356.3" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-print-ah)"/><path class="fig-r4-02-pressure-volume-print-s-red" d="M48.0,413.0 L57.1,411.6 L66.2,410.2 L75.3,408.7 L84.4,407.1 L93.5,405.4 L102.6,403.5 L111.7,401.6 L120.8,399.6 L129.9,397.4 L139.0,395.1 L148.1,392.6 L157.2,389.9 L166.3,387.1 L175.4,384.1 L184.5,380.8 L193.6,377.3 L202.7,373.6 L211.8,369.6 L220.9,365.3 L230.0,360.7 L239.1,355.7 L248.2,350.3 L257.3,344.6 L266.4,338.4 L275.5,331.7 L284.6,324.5 L293.7,316.7 L302.8,308.4 L311.9,299.4 L321.0,289.6 L330.1,279.1 L339.2,267.7 L348.3,255.5 L357.4,242.2 L366.5,227.9 L375.6,212.5 L384.7,195.7 L393.8,177.7 L402.9,158.1 L412.0,137.0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r4-02-pressure-volume-print-s-ink" d="M273.7,333.1 H317.4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r4-02-pressure-volume-print-s-red" d="M317.4,333.1 V297.6" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-print-ah)"/><text class="fig-r4-02-pressure-volume-print-t-red" x="329.2" y="267.7" font-size="13" font-weight="600" text-anchor="end">Stiff ventricle</text><text class="fig-r4-02-pressure-volume-print-t-teal" x="412.0" y="403.0" font-size="13" font-weight="600" text-anchor="end">Compliant ventricle</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="453.0" font-size="13" text-anchor="start">Same small volume rise (dashed): a small pressure rise on the compliant curve,</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="16.0" y="469.0" font-size="13" text-anchor="start">a large pressure rise on the stiff curve.</text><rect class="fig-r4-02-pressure-volume-print-f-tt" x="16.0" y="493.0" width="668.0" height="52.0" rx="6"/><text class="fig-r4-02-pressure-volume-print-t-ink" x="28.0" y="513.0" font-size="13" text-anchor="start">Ejection fraction shows how completely the ventricle empties, not how easily it fills.</text><text class="fig-r4-02-pressure-volume-print-t-ink" x="28.0" y="530.0" font-size="13" text-anchor="start">Tachycardia, ischemia and fast atrial fibrillation make filling harder.</text></svg>