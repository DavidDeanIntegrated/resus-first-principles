<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 419" role="img" aria-labelledby="fig-r3-02-where-fluid-goes-print-title" aria-describedby="fig-r3-02-where-fluid-goes-print-desc"><title id="fig-r3-02-where-fluid-goes-print-title">Where fluid goes when the capillary leaks</title><desc id="fig-r3-02-where-fluid-goes-print-desc">Schematic of fluid given into the circulation. Part of it stays in the vessel; most moves through the leaking vessel wall into the interstitium of the lung, gut wall and kidney. In the lung it widens the distance oxygen must cross; in the gut wall it raises interstitial pressure; in the kidney, enclosed by its capsule, it raises tissue pressure. An inset shows the vessel lining with an intact glycocalyx and with a thin, patchy glycocalyx shed in sepsis. Filtered fluid returns mainly through the lymphatics. Shedding is observed; how much of the leak it explains in humans is uncertain. Schematic only; no numbers or proportions are shown.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r3-02-where-fluid-goes-print-t-ink{fill:#172d38}.fig-r3-02-where-fluid-goes-print-t-muted{fill:#526671}.fig-r3-02-where-fluid-goes-print-t-teal{fill:#077578}.fig-r3-02-where-fluid-goes-print-t-red{fill:#af4639}.fig-r3-02-where-fluid-goes-print-t-gold{fill:#996613}.fig-r3-02-where-fluid-goes-print-bg{fill:#ffffff}.fig-r3-02-where-fluid-goes-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r3-02-where-fluid-goes-print-s-teal{stroke:#077578;fill:none}.fig-r3-02-where-fluid-goes-print-f-teal{fill:#077578}.fig-r3-02-where-fluid-goes-print-s-red{stroke:#af4639;fill:none}.fig-r3-02-where-fluid-goes-print-f-red{fill:#af4639}.fig-r3-02-where-fluid-goes-print-s-gold{stroke:#996613;fill:none}.fig-r3-02-where-fluid-goes-print-f-gold{fill:#996613}.fig-r3-02-where-fluid-goes-print-s-muted{stroke:#526671;fill:none}.fig-r3-02-where-fluid-goes-print-f-muted{fill:#526671}.fig-r3-02-where-fluid-goes-print-s-rule{stroke:#d5dedc;fill:none}.fig-r3-02-where-fluid-goes-print-f-rule{fill:#d5dedc}.fig-r3-02-where-fluid-goes-print-s-ink{stroke:#172d38;fill:none}.fig-r3-02-where-fluid-goes-print-f-ink{fill:#172d38}.fig-r3-02-where-fluid-goes-print-f-tt{fill:#ddedea}.fig-r3-02-where-fluid-goes-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r3-02-where-fluid-goes-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r3-02-where-fluid-goes-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r3-02-where-fluid-goes-print-bg" width="700" height="419"/><text class="fig-r3-02-where-fluid-goes-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">SEPTIC SHOCK</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">Where fluid goes when the capillary leaks</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Schematic only; no proportions are shown.</text><text class="fig-r3-02-where-fluid-goes-print-t-teal" x="16.0" y="107.0" font-size="13" font-weight="600" text-anchor="start">Fluid given</text><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M106,103 H138" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><rect class="fig-r3-02-where-fluid-goes-print-f-rt" x="16" y="123" width="430" height="44" rx="22"/><path class="fig-r3-02-where-fluid-goes-print-s-red" d="M36,123 H426" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r3-02-where-fluid-goes-print-s-red" d="M36,167 H426" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="38.0" y="150.0" font-size="13" font-weight="600" text-anchor="start">Part stays in the vessel</text><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M386,145 h40" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><text class="fig-r3-02-where-fluid-goes-print-t-red" x="446.0" y="117.0" font-size="13" text-anchor="end">leaking wall</text><path class="fig-r3-02-where-fluid-goes-print-s-gold" d="M85.0,171 V193" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><path class="fig-r3-02-where-fluid-goes-print-s-gold" d="M231.0,171 V193" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><path class="fig-r3-02-where-fluid-goes-print-s-gold" d="M377.0,171 V193" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="16.0" y="215.0" font-size="13.5" font-weight="600" text-anchor="start">Most moves into the interstitium</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="16.0" y="227.0" width="138.0" height="80.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-print-f-gold" x="16.0" y="227.0" width="5" height="80.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="30.0" y="249.0" font-size="14" font-weight="600" text-anchor="start">Lung</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="30.0" y="269.0" font-size="13" text-anchor="start">Oxygen must</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="30.0" y="285.0" font-size="13" text-anchor="start">cross farther</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="162.0" y="227.0" width="138.0" height="80.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-print-f-gold" x="162.0" y="227.0" width="5" height="80.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="176.0" y="249.0" font-size="14" font-weight="600" text-anchor="start">Gut wall</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="176.0" y="269.0" font-size="13" text-anchor="start">Interstitial</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="176.0" y="285.0" font-size="13" text-anchor="start">pressure rises</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="308.0" y="227.0" width="138.0" height="80.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-print-f-gold" x="308.0" y="227.0" width="5" height="80.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="322.0" y="249.0" font-size="14" font-weight="600" text-anchor="start">Kidney</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="322.0" y="269.0" font-size="13" text-anchor="start">Pressure rises</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="322.0" y="285.0" font-size="13" text-anchor="start">inside capsule</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="462.0" y="93.0" width="222.0" height="250.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-print-t-teal" x="476.0" y="115.0" font-size="13.5" font-weight="600" text-anchor="start">Inset: vessel lining</text><rect class="fig-r3-02-where-fluid-goes-print-f-muted" x="476" y="183" width="194" height="10" rx="2" opacity="0.6"/><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M481,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M490,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M499,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M508,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M517,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M526,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-whe