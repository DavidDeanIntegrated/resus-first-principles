<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 607" role="img" aria-labelledby="fig-r3-02-where-fluid-goes-print-title" aria-describedby="fig-r3-02-where-fluid-goes-print-desc"><title id="fig-r3-02-where-fluid-goes-print-title">Where given fluid goes in sepsis</title><desc id="fig-r3-02-where-fluid-goes-print-desc">Titled where given fluid goes in sepsis. A schematic of a blood vessel with fluid entering from an intravenous line. Arrows show some fluid remaining in the vessel and more fluid passing through the vessel wall into the surrounding tissue, labeled lung, gut and kidney; the label leaking wall appears only beside the leak arrow, and normal filtration returning through the lymphatics is shown separately. An inset shows two magnified sections of vessel lining, one with a thick intact glycocalyx layer and one with a thin, patchy layer. No numbers or proportions are shown.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r3-02-where-fluid-goes-print-t-ink{fill:#172d38}.fig-r3-02-where-fluid-goes-print-t-muted{fill:#526671}.fig-r3-02-where-fluid-goes-print-t-teal{fill:#077578}.fig-r3-02-where-fluid-goes-print-t-red{fill:#af4639}.fig-r3-02-where-fluid-goes-print-t-gold{fill:#996613}.fig-r3-02-where-fluid-goes-print-bg{fill:#ffffff}.fig-r3-02-where-fluid-goes-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r3-02-where-fluid-goes-print-s-teal{stroke:#077578;fill:none}.fig-r3-02-where-fluid-goes-print-f-teal{fill:#077578}.fig-r3-02-where-fluid-goes-print-s-red{stroke:#af4639;fill:none}.fig-r3-02-where-fluid-goes-print-f-red{fill:#af4639}.fig-r3-02-where-fluid-goes-print-s-gold{stroke:#996613;fill:none}.fig-r3-02-where-fluid-goes-print-f-gold{fill:#996613}.fig-r3-02-where-fluid-goes-print-s-muted{stroke:#526671;fill:none}.fig-r3-02-where-fluid-goes-print-f-muted{fill:#526671}.fig-r3-02-where-fluid-goes-print-s-rule{stroke:#d5dedc;fill:none}.fig-r3-02-where-fluid-goes-print-f-rule{fill:#d5dedc}.fig-r3-02-where-fluid-goes-print-s-ink{stroke:#172d38;fill:none}.fig-r3-02-where-fluid-goes-print-f-ink{fill:#172d38}.fig-r3-02-where-fluid-goes-print-f-tt{fill:#ddedea}.fig-r3-02-where-fluid-goes-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r3-02-where-fluid-goes-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r3-02-where-fluid-goes-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r3-02-where-fluid-goes-print-bg" width="700" height="607"/><text class="fig-r3-02-where-fluid-goes-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">SEPTIC SHOCK</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">Where given fluid goes in sepsis</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Schematic only; no proportions are shown.</text><text class="fig-r3-02-where-fluid-goes-print-t-teal" x="16.0" y="107.0" font-size="13" font-weight="600" text-anchor="start">Fluid given</text><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M106,103 H138" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><rect class="fig-r3-02-where-fluid-goes-print-f-rt" x="16" y="123" width="430" height="44" rx="22"/><path class="fig-r3-02-where-fluid-goes-print-s-red" d="M36,123 H426" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r3-02-where-fluid-goes-print-s-red" d="M36,167 H426" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="38.0" y="150.0" font-size="13" font-weight="600" text-anchor="start">Part stays in the vessel</text><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M386,145 h40" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M56,171 V225" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="66.0" y="197.0" font-size="13" font-weight="600" text-anchor="start">normal filtration</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="66.0" y="213.0" font-size="13" text-anchor="start">(solid line)</text><path class="fig-r3-02-where-fluid-goes-print-s-red" d="M269.5,171 V225" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="279.5" y="185.0" font-size="13" font-weight="600" text-anchor="start">leak</text><text class="fig-r3-02-where-fluid-goes-print-t-red" x="279.5" y="201.0" font-size="13" text-anchor="start">leaking wall</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="279.5" y="217.0" font-size="13" text-anchor="start">(dashed line)</text><rect class="fig-r3-02-where-fluid-goes-print-f-rt" x="16.0" y="229.0" width="223.6" height="44.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="28.0" y="256.0" font-size="13.5" font-weight="600" text-anchor="start">Interstitium</text><rect class="fig-r3-02-where-fluid-goes-print-f-tt" x="273.6" y="229.0" width="172.4" height="44.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="283.6" y="256.0" font-size="13.5" font-weight="600" text-anchor="start">Lymphatics</text><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M243.6,251.0 H269.6" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M432.0,225 V171" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fig-r3-02-where-fluid-goes-print-ah)"/><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="422.0" y="181.0" font-size="13" text-anchor="end">returns</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="16.0" y="297.0" font-size="13" font-weight="600" text-anchor="start">Much of it leaves the vessels, as normal filtration and as</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="16.0" y="314.0" font-size="13" font-weight="600" text-anchor="start">leak; filtered fluid returns mainly through the lymphatics.</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="16.0" y="339.0" width="430.0" height="88.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-print-f-gold" x="16.0" y="339.0" width="5" height="88.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="30.0" y="359.0" font-size="14" font-weight="600" text-anchor="start">Lung</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="108.0" y="359.0" font-size="13" text-anchor="start">In the lung, interstitial water lengthens the path</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="108.0" y="375.0" font-size="13" text-anchor="start">oxygen must cross; flooded or collapsed alveoli add</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="108.0" y="391.0" font-size="13" text-anchor="start">low V/Q and shunt (see the acute respiratory failure</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="108.0" y="407.0" font-size="13" text-anchor="start">chapter).</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="16.0" y="433.0" width="430.0" height="40.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-print-f-gold" x="16.0" y="433.0" width="5" height="40.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="30.0" y="453.0" font-size="14" font-weight="600" text-anchor="start">Gut wall</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="108.0" y="453.0" font-size="13" text-anchor="start">Interstitial pressure rises.</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="16.0" y="479.0" width="430.0" height="40.0" rx="6"/><rect class="fig-r3-02-where-fluid-goes-print-f-gold" x="16.0" y="479.0" width="5" height="40.0" rx="2"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="30.0" y="499.0" font-size="14" font-weight="600" text-anchor="start">Kidney</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="108.0" y="499.0" font-size="13" text-anchor="start">Tissue pressure can rise inside the capsule.</text><rect class="fig-r3-02-where-fluid-goes-print-pn" x="462.0" y="93.0" width="222.0" height="250.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-print-t-teal" x="476.0" y="115.0" font-size="13.5" font-weight="600" text-anchor="start">Inset: vessel lining</text><rect class="fig-r3-02-where-fluid-goes-print-f-muted" x="476" y="183" width="194" height="10" rx="2" opacity="0.6"/><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M481,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M490,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M499,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M508,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M517,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M526,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M535,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M544,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M553,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M562,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M571,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M580,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M589,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M598,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M607,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M616,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M625,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M634,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M643,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M652,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M661,183 v-34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="476.0" y="213.0" font-size="13" font-weight="600" text-anchor="start">Intact glycocalyx</text><rect class="fig-r3-02-where-fluid-goes-print-f-muted" x="476" y="279" width="194" height="10" rx="2" opacity="0.6"/><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M481,279 v-12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M508,279 v-18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M535,279 v-12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M562,279 v-18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M589,279 v-12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M616,279 v-18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r3-02-where-fluid-goes-print-s-teal" d="M643,279 v-12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r3-02-where-fluid-goes-print-t-red" x="476.0" y="309.0" font-size="13" font-weight="600" text-anchor="start">Shed in sepsis</text><text class="fig-r3-02-where-fluid-goes-print-t-muted" x="476.0" y="135.0" font-size="13" text-anchor="start">Gel-like layer lining the vessel</text><rect class="fig-r3-02-where-fluid-goes-print-f-tt" x="16.0" y="543.0" width="668.0" height="52.0" rx="6"/><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="28.0" y="563.0" font-size="13" text-anchor="start">Shedding is observed; how much of the leak it explains in humans is uncertain.</text><text class="fig-r3-02-where-fluid-goes-print-t-ink" x="28.0" y="580.0" font-size="13" text-anchor="start">Not a treatment target.</text></svg>