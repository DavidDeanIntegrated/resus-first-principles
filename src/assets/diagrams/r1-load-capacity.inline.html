<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 645.0" width="100%" role="img" aria-labelledby="rf3s-title rf3s-desc"><title id="rf3s-title">The respiratory pump: load against capacity</title><desc id="rf3s-desc">One causal loop, read clockwise, under the statement that the pump fails when load persistently exceeds its capacity to meet that load. Load rises, so effort increases; sustained high effort fatigues the muscles; capacity falls; PaCO2 rises; and an arrow labeled acidosis raises ventilatory demand returns to rising load. Load and effort are drawn as solid red boxes, fatigue and falling capacity as dashed teal boxes, and rising PaCO2 as a gold box. Notes accompanying the loop: load rises with stiffer lungs, narrower airways, intrinsic PEEP, ventilatory demand from fever, acidosis or sepsis, and dead space forcing more ventilation. Rapid shallow breathing reduces the work of each breath but raises the dead-space fraction. A rising PaCO2 often comes late; waiting for it can mean waiting too long. Conceptual loop; no scale.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf3s-t-ink{fill:var(--fig-ink,#172d38)}.rf3s-t-muted{fill:var(--fig-muted,#526671)}.rf3s-t-teal{fill:var(--fig-teal,#077578)}.rf3s-t-red{fill:var(--fig-red,#af4639)}.rf3s-t-gold{fill:var(--fig-gold,#996613)}.rf3s-bg{fill:var(--fig-canvas,#f7f5ef)}.rf3s-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.rf3s-s-teal{stroke:var(--fig-teal,#077578);fill:none}.rf3s-f-teal{fill:var(--fig-teal,#077578)}.rf3s-s-red{stroke:var(--fig-red,#af4639);fill:none}.rf3s-f-red{fill:var(--fig-red,#af4639)}.rf3s-s-gold{stroke:var(--fig-gold,#996613);fill:none}.rf3s-f-gold{fill:var(--fig-gold,#996613)}.rf3s-s-muted{stroke:var(--fig-muted,#526671);fill:none}.rf3s-f-muted{fill:var(--fig-muted,#526671)}.rf3s-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.rf3s-f-rule{fill:var(--fig-rule,#d5dedc)}.rf3s-f-tt{fill:var(--fig-teal-tint,#ddedea)}.rf3s-f-rt{fill:
