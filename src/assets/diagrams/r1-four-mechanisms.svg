<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1092" width="100%" role="img" aria-labelledby="rf1-title rf1-desc"><title id="rf1-title">Four mechanisms of hypoxemia, and how each responds to oxygen</title><desc id="rf1-desc">Four schematic lung units compared. Hypoventilation: normal A–a gradient unless lung disease coexists; corrects easily with oxygen, which does not correct the hypoventilation; PaCO2 high. Low V/Q mismatch: widened gradient; usually corrects with modest oxygen; PaCO2 normal or low, can rise in advanced disease. Shunt: gradient widened, often greatly; poor response to oxygen, poorer as shunt fraction grows; PaCO2 normal or low, rises if the pump fails. Diffusion limitation: widened gradient; usually corrects; PaCO2 normal or low. Low inspired oxygen, an environmental cause: normal gradient, corrects, PaCO2 often low. The three illustrative patients on room air: A, pneumonia, PaO2 55 and PaCO2 32 mm Hg, A–a about 55. B, opioid hypoventilation, PaCO2 70, PAO2 about 62, PaO2 56, A–a about 6 which is normal, pH about 7.21, SpO2 about 80 percent. C, COPD, PaCO2 62, pH 7.31, PaO2 56, A–a about 16, SpO2 about 85 percent; mechanism: V/Q mismatch + hypoventilation.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf1-t-ink{fill:var(--fig-ink,#172d38)}.rf1-t-muted{fill:var(--fig-muted,#526671)}.rf1-t-teal{fill:var(--fig-teal,#077578)}.rf1-t-red{fill:var(--fig-red,#af4639)}.rf1-t-gold{fill:var(--fig-gold,#996613)}.rf1-bg{fill:var(--fig-canvas,#f7f5ef)}.rf1-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.rf1-s-teal{stroke:var(--fig-teal,#077578);fill:none}.rf1-f-teal{fill:var(--fig-teal,#077578)}.rf1-s-red{stroke:var(--fig-red,#af4639);fill:none}.rf1-f-red{fill:var(--fig-red,#af4639)}.rf1-s-gold{stroke:var(--fig-gold,#996613);fill:none}.rf1-f-gold{fill:var(--fig-gold,#996613)}.rf1-s-muted{stroke:var(--fig-muted,#526671);fill:none}.rf1-f-muted{fill:var(--fig-muted,#526671)}.rf1-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.rf1-f-rule{fill:var(--fig-rule,#d5dedc)}.rf1-f-tt{fill:var(--fig-teal-tint,#ddedea)}.rf1-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.rf1-t-ink{fill:var(--fig-ink,#e8dfd0)}.rf1-t-muted{fill:var(--fig-muted,#b3a897)}.rf1-t-teal{fill:var(--fig-teal,#6fb8b0)}.rf1-t-red{fill:var(--fig-red,#e0907f)}.rf1-t-gold{fill:var(--fig-gold,#d9a955)}.rf1-bg{fill:var(--fig-canvas,#25211c)}.rf1-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.rf1-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.rf1-f-teal{fill:var(--fig-teal,#6fb8b0)}.rf1-s-red{stroke:var(--fig-red,#e0907f);fill:none}.rf1-f-red{fill:var(--fig-red,#e0907f)}.rf1-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.rf1-f-gold{fill:var(--fig-gold,#d9a955)}.rf1-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.rf1-f-muted{fill:var(--fig-muted,#b3a897)}.rf1-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.rf1-f-rule{fill:var(--fig-rule,#4a4238)}.rf1-f-tt{fill:var(--fig-teal-tint,#30443f)}.rf1-f-rt{fill:var(--fig-red-tint,#43302a)}}:root[data-theme=dark] svg {}</style><defs><marker id="rf1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf1-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf1-bg" width="360" height="1092"/><text class="rf1-t-teal" x="12" y="24" font-size="12" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf1-t-ink" x="12" y="48.0" font-size="17.5" font-weight="600" text-anchor="start">Four mechanisms of hypoxemia</text><text class="rf1-t-muted" x="12" y="68" font-size="13" text-anchor="start">Dominant patterns; real patients mix them.</text><rect class="rf1-pn" x="12" y="84" width="336" height="144" rx="6"/><rect class="rf1-f-teal" x="12" y="84" width="5" height="144" rx="2"/><circle class="rf1-s-teal" cx="318" cy="110" r="13" stroke-width="2.5" stroke-dasharray="4 3"/><path class="rf1-s-teal" d="M296,128 H340" stroke-width="4" stroke-linecap="round"/><text class="rf1-t-teal" x="28" y="106" font-size="16" font-weight="600" text-anchor="start">Hypoventilation</text><text class="rf1-t-muted" x="28" y="124" font-size="12.5" text-anchor="start">lung normal, too little air moving</text><text class="rf1-t-ink" x="28" y="144" font-size="13.5" text-anchor="start">A–a gradient: normal, unless lung</text><text class="rf1-t-ink" x="28" y="162" font-size="13.5" text-anchor="start">disease coexists</text><text class="rf1-t-ink" x="28" y="180" font-size="13.5" text-anchor="start">Oxygen: corrects easily; does not</text><text class="rf1-t-ink" x="28" y="198" font-size="13.5" text-anchor="start">correct the hypoventilation</text><text class="rf1-t-ink" x="28" y="216" font-size="13.5" text-anchor="start">PaCO2: high</text><rect class="rf1-pn" x="12" y="238" width="336" height="160" rx="6"/><rect class="rf1-f-gold" x="12" y="238" width="5" height="160" rx="2"/><circle class="rf1-s-gold" cx="318" cy="264" r="13" stroke-width="2.5" /><circle class="rf1-f-rt" cx="318" cy="264" r="5"/><path class="rf1-s-gold" d="M296,282 H340" stroke-width="4" stroke-linecap="round"/><text class="rf1-t-gold" x="28" y="260" font-size="16" font-weight="600" text-anchor="start">Low V/Q mismatch</text><text class="rf1-t-muted" x="28" y="278" font-size="12.5" text-anchor="start">some fresh gas, not enough for</text><text class="rf1-t-muted" x="28" y="294" font-size="12.5" text-anchor="start">the blood</text><text class="rf1-t-ink" x="28" y="314" font-size="13.5" text-anchor="start">A–a gradient: widened</text><text class="rf1-t-ink" x="28" y="332" font-size="13.5" text-anchor="start">Oxygen: usually corrects with</text><text class="rf1-t-ink" x="28" y="350" font-size="13.5" text-anchor="start">modest oxygen</text><text class="rf1-t-ink" x="28" y="368" font-size="13.5" text-anchor="start">PaCO2: normal or low; can rise in</text><text class="rf1-t-ink" x="28" y="386" font-size="13.5" text-anchor="start">advanced disease</text><rect class="rf1-pn" x="12" y="408" width="336" height="160" rx="6"/><rect class="rf1-f-red" x="12" y="408" width="5" height="160" rx="2"/><circle class="rf1-s-red" cx="318" cy="434" r="13" stroke-width="2.5" /><circle class="rf1-f-rt" cx="318" cy="434" r="11.5"/><path class="rf1-s-red" d="M296,452 H340" stroke-width="4" stroke-linecap="round"/><text class="rf1-t-red" x="28" y="430" font-size="16" font-weight="600" text-anchor="start">Shunt</text><text class="rf1-t-muted" x="28" y="448" font-size="12.5" text-anchor="start">no inspired gas arrives;</text><text class="rf1-t-muted" x="28" y="464" font-size="12.5" text-anchor="start">blood passes unchanged</text><text class="rf1-t-ink" x="28" y="484" font-size="13.5" text-anchor="start">A–a gradient: widened, often greatly</text><text class="rf1-t-ink" x="28" y="502" font-size="13.5" text-anchor="start">Oxygen: poor, and poorer as shunt</text><text class="rf1-t-ink" x="28" y="520" font-size="13.5" text-anchor="start">fraction grows</text><text class="rf1-t-ink" x="28" y="538" font-size="13.5" text-anchor="start">PaCO2: normal or low; rises if the</text><text class="rf1-t-ink" x="28" y="556" font-size="13.5" text-anchor="start">pump fails</text><rect class="rf1-pn" x="12" y="578" width="336" height="124" rx="6"/><rect class="rf1-f-muted" x="12" y="578" width="5" height="124" rx="2"/><circle class="rf1-s-muted" cx="318" cy="604" r="13" stroke-width="2.5" /><path class="rf1-s-muted" d="M296,622 H340" stroke-width="4" stroke-linecap="round"/><text class="rf1-t-ink" x="28" y="600" font-size="16" font-weight="600" text-anchor="start">Diffusion limitation</text><text class="rf1-t-muted" x="28" y="618" font-size="12.5" text-anchor="start">oxygen cannot equilibrate in</text><text class="rf1-t-muted" x="28" y="634" font-size="12.5" text-anchor="start">the transit time</text><text class="rf1-t-ink" x="28" y="654" font-size="13.5" text-anchor="start">A–a gradient: widened</text><text class="rf1-t-ink" x="28" y="672" font-size="13.5" text-anchor="start">Oxygen: usually corrects</text><text class="rf1-t-ink" x="28" y="690" font-size="13.5" text-anchor="start">PaCO2: normal or low</text><rect class="rf1-f-tt" x="12" y="712" width="336" height="72" rx="6"/><text class="rf1-t-ink" x="24" y="733" font-size="13" text-anchor="start">Low inspired oxygen (environmental, not a</text><text class="rf1-t-ink" x="24" y="750" font-size="13" text-anchor="start">lung mechanism): A–a normal; corrects;</text><text class="rf1-t-ink" x="24" y="767" font-size="13" text-anchor="start">PaCO2 often low.</text><text class="rf1-t-teal" x="12" y="800" font-size="12" font-weight="600" text-anchor="start">THE THREE PATIENTS (ILLUSTRATIVE, ROOM AIR)</text><rect class="rf1-pn" x="12" y="810" width="336" height="66" rx="6"/><rect class="rf1-f-red" x="12" y="810" width="5" height="66" rx="2"/><text class="rf1-t-ink" x="28" y="830" font-size="14.5" font-weight="600" text-anchor="start">Patient A · Pneumonia</text><text class="rf1-t-ink" x="28" y="850" font-size="13.5" text-anchor="start">PaO2 55, PaCO2 32 mm Hg</text><text class="rf1-t-ink" x="28" y="868" font-size="13.5" text-anchor="start">A–a about 55: lung fails to transfer</text><rect class="rf1-pn" x="12" y="884" width="336" height="84" rx="6"/><rect class="rf1-f-teal" x="12" y="884" width="5" height="84" rx="2"/><text class="rf1-t-ink" x="28" y="904" font-size="14.5" font-weight="600" text-anchor="start">Patient B · Opioid hypoventilation</text><text class="rf1-t-ink" x="28" y="924" font-size="13.5" text-anchor="start">PaCO2 70, PAO2 about 62, PaO2 56</text><text class="rf1-t-ink" x="28" y="942" font-size="13.5" text-anchor="start">A–a about 6 (normal); pH about 7.21</text><text class="rf1-t-ink" x="28" y="960" font-size="13.5" text-anchor="start">SpO2 about 80%</text><rect class="rf1-pn" x="12" y="976" width="336" height="84" rx="6"/><rect class="rf1-f-gold" x="12" y="976" width="5" height="84" rx="2"/><text class="rf1-t-ink" x="28" y="996" font-size="14.5" font-weight="600" text-anchor="start">Patient C · COPD</text><text class="rf1-t-ink" x="28" y="1016" font-size="13.5" text-anchor="start">PaCO2 62, pH 7.31, PaO2 56</text><text class="rf1-t-ink" x="28" y="1034" font-size="13.5" text-anchor="start">A–a about 16; SpO2 about 85%</text><text class="rf1-t-ink" x="28" y="1052" font-size="13.5" text-anchor="start">V/Q mismatch + hypoventilation</text><text class="rf1-t-muted" x="12" y="1080" font-size="12" text-anchor="start">Schematic units, not anatomy. Values from Parts I and III.</text></svg>