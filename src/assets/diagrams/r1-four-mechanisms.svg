<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1231.5" width="100%" role="img" aria-labelledby="rf1-title rf1-desc"><title id="rf1-title">Five mechanisms of hypoxemia, and how each responds to oxygen</title><desc id="rf1-desc">Five schematic lung units, each with its A–a gradient on room air, response to supplemental oxygen, and typical PaCO2. Hypoventilation, drawn as a dashed alveolus with a normal lung: A–a normal, unless lung disease coexists; oxygen corrects easily but does not correct the hypoventilation; PaCO2 high. Low V/Q mismatch: a thin gas arrow reaches the alveolus, but the blood leaving it is drawn tinted, incompletely oxygenated; A–a widened; usually responds to modest oxygen; PaCO2 normal or low, can rise in advanced disease. Shunt: the alveolus is filled and crossed out, no gas arrow reaches it, and the blood passes through unchanged, drawn the same color entering and leaving; A–a widened, often greatly; response to oxygen limited, and smaller as shunt fraction grows; PaCO2 normal or low, rises if the pump fails. Under the shunt row: 30% shunt, illustrative: PaO2 about 58 on room air, under 150 on 100% O2, not over 400. Diffusion limitation, a thickened alveolar wall: A–a widened; usually corrects; PaCO2 normal or low. Low inspired oxygen, environmental, not a lung mechanism, drawn as a normal alveolus with low-oxygen gas: A–a normal; corrects; PaCO2 often low. The three illustrative patients on room air: A, pneumonia, PaO2 55 and PaCO2 32 mm Hg, A–a about 55, the lung fails to transfer. B, opioid hypoventilation, PaCO2 70, PAO2 about 62, PaO2 56, A–a about 6, normal, pH about 7.21, SpO2 about 80 percent. C, COPD, PaCO2 62, pH 7.31, PaO2 56, hypoventilation dominant; A–a about 16, inside the rough age-expected range of about 21. Schematic units, not anatomy.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf1-t-ink{fill:var(--fig-ink,#172d38)}.rf1-t-muted{fill:var(--fig-muted,#526671)}.rf1-t-teal{fill:var(--fig-teal,#077578)}.rf1-t-red{fill:var(--fig-red,#af4639)}.rf1-t-gold{fill:var(--fig-gold,#996613)}.rf1-bg{fill:var(--fig-canvas,#f7f5ef)}.rf1-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.rf1-s-teal{stroke:var(--fig-teal,#077578);fill:none}.rf1-f-teal{fill:var(--fig-teal,#077578)}.rf1-s-red{stroke:var(--fig-red,#af4639);fill:none}.rf1-f-red{fill:var(--fig-red,#af4639)}.rf1-s-gold{stroke:var(--fig-gold,#996613);fill:none}.rf1-f-gold{fill:var(--fig-gold,#996613)}.rf1-s-muted{stroke:var(--fig-muted,#526671);fill:none}.rf1-f-muted{fill:var(--fig-muted,#526671)}.rf1-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.rf1-f-rule{fill:var(--fig-rule,#d5dedc)}.rf1-f-tt{fill:var(--fig-teal-tint,#ddedea)}.rf1-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.rf1-t-ink{fill:var(--fig-ink,#e8dfd0)}.rf1-t-muted{fill:var(--fig-muted,#b3a897)}.rf1-t-teal{fill:var(--fig-teal,#6fb8b0)}.rf1-t-red{fill:var(--fig-red,#e0907f)}.rf1-t-gold{fill:var(--fig-gold,#d9a955)}.rf1-bg{fill:var(--fig-canvas,#25211c)}.rf1-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.rf1-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.rf1-f-teal{fill:var(--fig-teal,#6fb8b0)}.rf1-s-red{stroke:var(--fig-red,#e0907f);fill:none}.rf1-f-red{fill:var(--fig-red,#e0907f)}.rf1-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.rf1-f-gold{fill:var(--fig-gold,#d9a955)}.rf1-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.rf1-f-muted{fill:var(--fig-muted,#b3a897)}.rf1-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.rf1-f-rule{fill:var(--fig-rule,#4a4238)}.rf1-f-tt{fill:var(--fig-teal-tint,#30443f)}.rf1-f-rt{fill:var(--fig-red-tint,#43302a)}}:root[data-theme=dark] svg {}</style><defs><marker id="rf1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="rf1-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rf1-bg" width="360" height="1231.5"/><text class="rf1-t-teal" x="12" y="24" font-size="12.5" font-weight="600" text-anchor="start">ACUTE RESPIRATORY FAILURE</text><text class="rf1-t-ink" x="12" y="48" font-size="17.5" font-weight="600" text-anchor="start">Five mechanisms of hypoxemia</text><text class="rf1-t-muted" x="12" y="68" font-size="13" text-anchor="start">Dominant patterns; real patients mix them.</text><rect class="rf1-pn" x="12" y="84" width="336" height="144.5" rx="6"/><rect class="rf1-f-teal" x="12" y="84" width="5" height="144.5" rx="2"/><circle class="rf1-s-teal" cx="314" cy="118" r="13.0" stroke-width="2.5" stroke-dasharray="4 3"/><path class="rf1-s-teal" d="M314,91.0 V102.0" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#rf1-ah)"/><path class="rf1-s-muted" d="M290.0,137.0 H314" stroke-width="5"/><path class="rf1-s-red" d="M314,137.0 H338.0" stroke-width="5"/><path class="rf1-s-muted" d="M336.0,137.0 H344.0" stroke-width="1.5" marker-end="url(#rf1-ah)"/><text class="rf1-t-teal" x="28" y="106" font-size="16" font-weight="600" text-anchor="start">Hypoventilation</text><text class="rf1-t-muted" x="28" y="124.0" font-size="12.5" text-anchor="start">lung normal, too little air moving</text><text class="rf1-t-ink" x="28" y="144.5" font-size="13.5" text-anchor="start">A–a gradient: Normal, unless lung</text><text class="rf1-t-ink" x="28" y="162.5" font-size="13.5" text-anchor="start">disease coexists</text><text class="rf1-t-ink" x="28" y="180.5" font-size="13.5" text-anchor="start">Oxygen: Corrects easily; does not</text><text class="rf1-t-ink" x="28" y="198.5" font-size="13.5" text-anchor="start">correct the hypoventilation</text><text class="rf1-t-ink" x="28" y="216.5" font-size="13.5" text-anchor="start">PaCO2: High</text><rect class="rf1-pn" x="12" y="238.5" width="336" height="161.0" rx="6"/><rect class="rf1-f-gold" x="12" y="238.5" width="5" height="161.0" rx="2"/><path class="rf1-s-gold" d="M314,243.5 V256.5" stroke-width="1.5" marker-end="url(#rf1-ah)"/><circle class="rf1-s-gold" cx="314" cy="272.5" r="13.0" stroke-width="2.5"/><path class="rf1-s-muted" d="M290.0,291.5 H314" stroke-width="5"/><rect class="rf1-f-rt" x="314" y="288.0" width="24.0" height="7"/><path class="rf1-s-red" d="M314,288.0 H338.0" stroke-width="3.5"/><path class="rf1-s-muted" d="M336.0,291.5 H344.0" stroke-width="1.5" marker-end="url(#rf1-ah)"/><text class="rf1-t-gold" x="28" y="260.5" font-size="16" font-weight="600" text-anchor="start">Low V/Q mismatch</text><text class="rf1-t-muted" x="28" y="278.5" font-size="12.5" text-anchor="start">some fresh gas, not enough for the</text><text class="rf1-t-muted" x="28" y="295.0" font-size="12.5" text-anchor="start">blood</text><text class="rf1-t-ink" x="28" y="315.5" font-size="13.5" text-anchor="start">A–a gradient: Widened</text><text class="rf1-t-ink" x="28" y="333.5" font-size="13.5" text-anchor="start">Oxygen: Usually responds to modest</text><text class="rf1-t-ink" x="28" y="351.5" font-size="13.5" text-anchor="start">oxygen</text><text class="rf1-t-ink" x="28" y="369.5" font-size="13.5" text-anchor="start">PaCO2: Normal or low; can rise in</text><text class="rf1-t-ink" x="28" y="387.5" font-size="13.5" text-anchor="start">advanced disease</text><rect class="rf1-pn" x="12" y="409.5" width="336" height="224.5" rx="6"/><rect class="rf1-f-red" x="12" y="409.5" width="5" height="224.5" rx="2"/><circle class="rf1-s-red" cx="314" cy="443.5" r="13.0" stroke-width="2.5"/><circle class="rf1-f-rt" cx="314" cy="443.5" r="11.5"/><path class="rf1-s-red" d="M304.9,434.4 L323.1,452.6 M323.1,434.4 L304.9,452.6" stroke-width="2.5" stroke-linecap="round"/><path class="rf1-s-muted" d="M290.0,462.5 H338.0" stroke-width="5"/><path class="rf1-s-muted" d="M336.0,462.5 H344.0" stroke-width="1.5" marker-end="url(#rf1-ah)"/><text class="rf1-t-red" x="28" y="431.5" font-size="16" font-weight="600" text-anchor="start">Shunt</text><text class="rf1-t-muted" x="28" y="449.5" font-size="12.5" text-anchor="start">no inspired gas arrives; blood passes</text><text class="rf1-t-muted" x="28" y="466.0" font-size="12.5" text-anchor="start">unchanged</text><text class="rf1-t-ink" x="28" y="486.5" font-size="13.5" text-anchor="start">A–a gradient: Widened, often greatly</text><text class="rf1-t-ink" x="28" y="504.5" font-size="13.5" text-anchor="start">Oxygen: Limited, and smaller as</text><text class="rf1-t-ink" x="28" y="522.5" font-size="13.5" text-anchor="start">shunt fraction grows</text><text class="rf1-t-ink" x="28" y="540.5" font-size="13.5" text-anchor="start">PaCO2: Normal or low; rises if the</text><text class="rf1-t-ink" x="28" y="558.5" font-size="13.5" text-anchor="start">pump fails</text><g id="shunt-line" data-slot="shunt-line"><path class="rf1-s-red" d="M28,570.5 H332" stroke-width="1" stroke-dasharray="3 3"/><text class="rf1-t-red" x="28" y="588.5" font-size="12.5" font-weight="600" text-anchor="start">30% shunt (illustrative): PaO2 about 58 on</text><text class="rf1-t-red" x="28" y="605.0" font-size="12.5" font-weight="600" text-anchor="start">room air, under 150 on 100% O2, not over</text><text class="rf1-t-red" x="28" y="621.5" font-size="12.5" font-weight="600" text-anchor="start">400.</text></g><rect class="rf1-pn" x="12" y="644.0" width="336" height="125.0" rx="6"/><rect class="rf1-f-muted" x="12" y="644.0" width="5" height="125.0" rx="2"/><circle class="rf1-s-muted" cx="314" cy="678.0" r="13.0" stroke-width="5"/><path class="rf1-s-muted" d="M290.0,697.0 H314" stroke-width="5"/><path class="rf1-s-red" d="M314,697.0 H338.0" stroke-width="5"/><path class="rf1-s-muted" d="M336.0,697.0 H344.0" stroke-width="1.5" marker-end="url(#rf1-ah)"/><text class="rf1-t-ink" x="28" y="666.0" font-size="16" font-weight="600" text-anchor="start">Diffusion limitation</text><text class="rf1-t-muted" x="28" y="684.0" font-size="12.5" text-anchor="start">oxygen cannot equilibrate in the transit</text><text class="rf1-t-muted" x="28" y="700.5" font-size="12.5" text-anchor="start">time</text><text class="rf1-t-ink" x="28" y="721.0" font-size="13.5" text-anchor="start">A–a gradient: Widened</text><text class="rf1-t-ink" x="28" y="739.0" font-size="13.5" text-anchor="start">Oxygen: Usually corrects</text><text class="rf1-t-ink" x="28" y="757.0" font-size="13.5" text-anchor="start">PaCO2: Normal or low</text><rect class="rf1-pn" x="12" y="779.0" width="336" height="108.5" rx="6"/><rect class="rf1-f-teal" x="12" y="779.0" width="5" height="108.5" rx="2"/><rect class="rf1-s-teal" x="14" y="781.0" width="332" height="104.5" rx="5" stroke-dasharray="5 4" stroke-width="1.2"/><path class="rf1-s-muted" d="M314,784.0 V797.0" stroke-width="3" stroke-dasharray="2 2" marker-end="url(#rf1-ah)"/><circle class="rf1-s-teal" cx="314" cy="813.0" r="13.0" stroke-width="2.5"/><path class="rf1-s-muted" d="M290.0,832.0 H314" stroke-width="5"/><path class="rf1-s-red" d="M314,832.0 H338.0" stroke-width="5"/><path class="rf1-s-muted" d="M336.0,832.0 H344.0" stroke-width="1.5" marker-end="url(#rf1-ah)"/><text class="rf1-t-teal" x="28" y="801.0" font-size="16" font-weight="600" text-anchor="start">Low inspired oxygen</text><text class="rf1-t-muted" x="28" y="819.0" font-size="12.5" text-anchor="start">environmental, not a lung mechanism</text><text class="rf1-t-ink" x="28" y="839.5" font-size="13.5" text-anchor="start">A–a gradient: Normal</text><text class="rf1-t-ink" x="28" y="857.5" font-size="13.5" text-anchor="start">Oxygen: Corrects</text><text class="rf1-t-ink" x="28" y="875.5" font-size="13.5" text-anchor="start">PaCO2: Often low</text><text class="rf1-t-teal" x="12" y="905.5" font-size="12.5" font-weight="600" text-anchor="start">THE THREE PATIENTS (ILLUSTRATIVE, ROOM AIR)</text><rect class="rf1-pn" x="12" y="915.5" width="336" height="66" rx="6"/><rect class="rf1-f-red" x="12" y="915.5" width="5" height="66" rx="2"/><text class="rf1-t-ink" x="28" y="935.5" font-size="14.5" font-weight="600" text-anchor="start">Patient A · Pneumonia</text><text class="rf1-t-ink" x="28" y="955.5" font-size="13.5" text-anchor="start">PaO2 55, PaCO2 32 mm Hg</text><text class="rf1-t-ink" x="28" y="973.5" font-size="13.5" text-anchor="start">A–a about 55: lung fails to transfer</text><rect class="rf1-pn" x="12" y="989.5" width="336" height="84" rx="6"/><rect class="rf1-f-teal" x="12" y="989.5" width="5" height="84" rx="2"/><text class="rf1-t-ink" x="28" y="1009.5" font-size="14.5" font-weight="600" text-anchor="start">Patient B · Opioid hypoventilation</text><text class="rf1-t-ink" x="28" y="1029.5" font-size="13.5" text-anchor="start">PaCO2 70, PAO2 about 62, PaO2 56</text><text class="rf1-t-ink" x="28" y="1047.5" font-size="13.5" text-anchor="start">A–a about 6 (normal); pH about 7.21</text><text class="rf1-t-ink" x="28" y="1065.5" font-size="13.5" text-anchor="start">SpO2 about 80%</text><rect class="rf1-pn" x="12" y="1081.5" width="336" height="102" rx="6"/><rect class="rf1-f-gold" x="12" y="1081.5" width="5" height="102" rx="2"/><text class="rf1-t-ink" x="28" y="1101.5" font-size="14.5" font-weight="600" text-anchor="start">Patient C · COPD</text><text class="rf1-t-ink" x="28" y="1121.5" font-size="13.5" text-anchor="start">PaCO2 62, pH 7.31, PaO2 56</text><text class="rf1-t-ink" x="28" y="1139.5" font-size="13.5" text-anchor="start">Hypoventilation dominant; A–a about 16,</text><text class="rf1-t-ink" x="28" y="1157.5" font-size="13.5" text-anchor="start">inside the rough age-expected range (about</text><text class="rf1-t-ink" x="28" y="1175.5" font-size="13.5" text-anchor="start">21)</text><text class="rf1-t-muted" x="12" y="1203.5" font-size="12.5" text-anchor="start">Schematic units, not anatomy. Values from Parts I</text><text class="rf1-t-muted" x="12" y="1219.5" font-size="12.5" text-anchor="start">and III.</text></svg>