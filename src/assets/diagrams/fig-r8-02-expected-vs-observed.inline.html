<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 730" role="img" aria-labelledby="fig-r8-02-expected-vs-observed-screen-title" aria-describedby="fig-r8-02-expected-vs-observed-screen-desc"><title id="fig-r8-02-expected-vs-observed-screen-title">Similar pH, different states: compare compensation with what is expected</title><desc id="fig-r8-02-expected-vs-observed-screen-desc">Three patient cards. Patient 1, toxic alcohol: HCO3 8 mEq/L; Winter&#x27;s formula, 1.5 times HCO3 plus 8 plus or minus 2, gives an expected PaCO2 of 18 to 22 mm Hg, shown as a hatched bar; the observed PaCO2 of 20 is marked inside it and labeled matches. pH is about 7.22; deep, fast breathing keeps it survivable, and with a PaCO2 of 40 the pH would be about 6.92. Patient 2, acute CO2 retention from an opioid: PaCO2 rose from 40 to 70 mm Hg; the acute rule, HCO3 up about 1 per 10 mm Hg, predicts about 27, and the observed 27 matches; the chronic rule, about 3.5 per 10, would give about 34 to 35, so the kidneys have not had time. pH is about 7.21. Patient 3, vomiting plus an added acidosis: pH 7.40, PaCO2 40, HCO3 24 look normal, but the anion gap is 24 against an illustrative baseline of about 10, a mismatch showing a gap acidosis and a metabolic alkalosis offsetting in pH, though not in the gap: a second disorder.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:url(#fig-r8-02-expected-vs-observed-screen-h)}</style><defs><marker id="fig-r8-02-expected-vs-observed-screen-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="f-ink"/></marker><pattern id="fig-r8-02-expected-vs-observed-screen-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-gold" stroke-width="2.5"/></pattern></defs><rect class="bg" width="360" height="730"/><g transform="translate(10,10)"><text x="0" y="16" font-size="12.4" text-anchor="start" font-weight="700" class="t-teal">ACID–BASE PHYSIOLOGY</text><text x="0" y="40" font-size="19" text-anchor="start" font-weight="700" class="t-ink">Similar pH, different states</text><text x="0" y="64" font-size="13" text-anchor="start" font-weight="400" class="t-muted">Compare what compensation is expected with</text><text x="0" y="82" font-size="13" text-anchor="start" font-weight="400" class="t-muted">what is observed.</text></g><g transform="translate(10,118)"><rect x="0" y="0" width="340" height="200" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 1: toxic alcohol</text><text x="12" y="40" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">Primary: HCO3− 8 mEq/L. pH about 7.22.</text><line x1="30" y1="92" x2="310" y2="92" class="s-rule" stroke-width="2"/><text x="30" y="108" font-size="12.4" text-anchor="middle" font-weight="400" class="t-muted">10</text><text x="310" y="108" font-size="12.4" text-anchor="end" font-weight="400" class="t-muted">45 mm Hg</text><rec  10): about 34–35.</text><text x="12" y="170" font-size="12.4" text-anchor="start" font-weight="700" class="t-ink">Kidneys have not had time.</text><text x="12" y="198" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">▲ hatched bar = expected; ▼ red marker = observed</text></g><g transform="translate(10,566)"><rect x="0" y="0" width="340" height="150" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Patient 3: vomiting + added acidosis</text><text x="12" y="40" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">pH 7.40, PaCO2 40, HCO3− 24: looks normal.</text><text x="12" y="64" font-size="12.4" text-anchor="start" font-weight="700" class="t-red">✗ Mismatch: anion gap 24 vs baseline about 10</text><text x="12" y="80" font-size="12.4" text-anchor="start" font-weight="400" class="t-muted">(illustrative; local lab range governs).</text><text x="12" y="104" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">Gap acidosis and metabolic alkalosis offset</text><text x="12" y="120" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">in pH (not in the gap): a second disorder.</text></g></svg>
