<svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 633" role="img" aria-labelledby="fig-r2-02-what-intubation-removes-print-title" aria-describedby="fig-r2-02-what-intubation-removes-print-desc"><title id="fig-r2-02-what-intubation-removes-print-title">What intubation can reduce or add</title><desc id="fig-r2-02-what-intubation-removes-print-desc">Titled what intubation can reduce or add. Two columns. The left column, labeled reduced, lists spontaneous breathing, sympathetic tone (often reduced), and negative intrathoracic pressure. The right column, labeled added, lists apnea and positive pressure. Lines connect spontaneous breathing to Patients M and H, sympathetic tone to Patients P and R, negative intrathoracic pressure to Patient P, apnea to Patients H, M and R, and positive pressure to Patients P and R. Patient H is labeled reduced oxygen store (about 1.2 L).</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r2-02-what-intubation-removes-print-t-ink{fill:#172d38}.fig-r2-02-what-intubation-removes-print-t-muted{fill:#526671}.fig-r2-02-what-intubation-removes-print-t-teal{fill:#077578}.fig-r2-02-what-intubation-removes-print-t-red{fill:#af4639}.fig-r2-02-what-intubation-removes-print-t-gold{fill:#996613}.fig-r2-02-what-intubation-removes-print-bg{fill:#ffffff}.fig-r2-02-what-intubation-removes-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r2-02-what-intubation-removes-print-s-teal{stroke:#077578;fill:none}.fig-r2-02-what-intubation-removes-print-f-teal{fill:#077578}.fig-r2-02-what-intubation-removes-print-s-red{stroke:#af4639;fill:none}.fig-r2-02-what-intubation-removes-print-f-red{fill:#af4639}.fig-r2-02-what-intubation-removes-print-s-gold{stroke:#996613;fill:none}.fig-r2-02-what-intubation-removes-print-f-gold{fill:#996613}.fig-r2-02-what-intubation-removes-print-s-muted{stroke:#526671;fill:none}.fig-r2-02-what-intubation-removes-print-f-muted{fill:#526671}.fig-r2-02-what-intubation-removes-print-s-rule{stroke:#d5dedc;fill:none}.fig-r2-02-what-intubation-removes-print-f-rule{fill:#d5dedc}.fig-r2-02-what-intubation-removes-print-s-ink{stroke:#172d38;fill:none}.fig-r2-02-what-intubation-removes-print-f-ink{fill:#172d38}.fig-r2-02-what-intubation-removes-print-f-tt{fill:#ddedea}.fig-r2-02-what-intubation-removes-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r2-02-what-intubation-removes-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r2-02-what-intubation-removes-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r2-02-what-intubation-removes-print-bg" width="700" height="633"/><text class="fig-r2-02-what-intubation-removes-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PHYSIOLOGICALLY DIFFICULT AIRWAY</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">What intubation can reduce or add</text><text class="fig-r2-02-what-intubation-removes-print-t-muted" x="16.0" y="70.0" font-size="13.5" text-anchor="start">Conceptual, not a timeline.</text><text class="fig-r2-02-what-intubation-removes-print-t-red" x="16.0" y="107.0" font-size="13" font-weight="600" text-anchor="start">REDUCED</text><text class="fig-r2-02-what-intubation-removes-print-t-muted" x="282.0" y="107.0" font-size="13" font-weight="600" text-anchor="start">PATIENTS</text><text class="fig-r2-02-what-intubation-removes-print-t-teal" x="480.0" y="107.0" font-size="13" font-weight="600" text-anchor="start">ADDED</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="282.0" y="119.0" width="170.0" height="74.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="294.0" y="141.0" font-size="14" font-weight="600" text-anchor="start">Patient H</text><text class="fig-r2-02-what-intubation-removes-print-t-muted" x="294.0" y="159.0" font-size="13" text-anchor="start">pneumonia</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="282.0" y="205.0" width="170.0" height="74.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="294.0" y="227.0" font-size="14" font-weight="600" text-anchor="start">Patient P</text><text class="fig-r2-02-what-intubation-removes-print-t-muted" x="294.0" y="245.0" font-size="13" text-anchor="start">vomiting blood</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="282.0" y="291.0" width="170.0" height="74.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="294.0" y="313.0" font-size="14" font-weight="600" text-anchor="start">Patient M</text><text class="fig-r2-02-what-intubation-removes-print-t-muted" x="294.0" y="331.0" font-size="13" text-anchor="start">ketoacidosis</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="282.0" y="377.0" width="170.0" height="74.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="294.0" y="399.0" font-size="14" font-weight="600" text-anchor="start">Patient R</text><text class="fig-r2-02-what-intubation-removes-print-t-muted" x="294.0" y="417.0" font-size="13" text-anchor="start">pulmonary embolus</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="16.0" y="144.3" width="222.0" height="60.0" rx="6"/><rect class="fig-r2-02-what-intubation-removes-print-f-red" x="16.0" y="144.3" width="5" height="60.0" rx="2"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="30.0" y="179.3" font-size="14.5" font-weight="600" text-anchor="start">Spontaneous breathing</text><path class="fig-r2-02-what-intubation-removes-print-s-red" d="M238,174.33333333333334 C268,174.33333333333334 252,328 282,328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-02-what-intubation-removes-print-s-red" d="M238,174.33333333333334 C268,174.33333333333334 252,156 282,156" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect class="fig-r2-02-what-intubation-removes-print-pn" x="16.0" y="255.0" width="222.0" height="60.0" rx="6"/><rect class="fig-r2-02-what-intubation-removes-print-f-red" x="16.0" y="255.0" width="5" height="60.0" rx="2"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="30.0" y="281.0" font-size="14.5" font-weight="600" text-anchor="start">Sympathetic tone</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="30.0" y="299.0" font-size="14.5" font-weight="600" text-anchor="start">(often reduced)</text><path class="fig-r2-02-what-intubation-removes-print-s-red" d="M238,285.0 C268,285.0 252,242 282,242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-02-what-intubation-removes-print-s-red" d="M238,285.0 C268,285.0 252,414 282,414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect class="fig-r2-02-what-intubation-removes-print-pn" x="16.0" y="365.7" width="222.0" height="60.0" rx="6"/><rect class="fig-r2-02-what-intubation-removes-print-f-red" x="16.0" y="365.7" width="5" height="60.0" rx="2"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="30.0" y="391.7" font-size="14.5" font-weight="600" text-anchor="start">Negative intrathoracic</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="30.0" y="409.7" font-size="14.5" font-weight="600" text-anchor="start">pressure</text><path class="fig-r2-02-what-intubation-removes-print-s-red" d="M238,395.6666666666667 C268,395.6666666666667 252,242 282,242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect class="fig-r2-02-what-intubation-removes-print-pn" x="480.0" y="172.0" width="204.0" height="60.0" rx="6"/><rect class="fig-r2-02-what-intubation-removes-print-f-teal" x="480.0" y="172.0" width="5" height="60.0" rx="2"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="494.0" y="207.0" font-size="14.5" font-weight="600" text-anchor="start">Apnea</text><path class="fig-r2-02-what-intubation-removes-print-s-teal" d="M480,202.0 C450,202.0 482,156 452,156" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-02-what-intubation-removes-print-s-teal" d="M480,202.0 C450,202.0 482,328 452,328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-02-what-intubation-removes-print-s-teal" d="M480,202.0 C450,202.0 482,414 452,414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect class="fig-r2-02-what-intubation-removes-print-pn" x="480.0" y="338.0" width="204.0" height="60.0" rx="6"/><rect class="fig-r2-02-what-intubation-removes-print-f-teal" x="480.0" y="338.0" width="5" height="60.0" rx="2"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="494.0" y="373.0" font-size="14.5" font-weight="600" text-anchor="start">Positive pressure</text><path class="fig-r2-02-what-intubation-removes-print-s-teal" d="M480,368.0 C450,368.0 482,242 452,242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r2-02-what-intubation-removes-print-s-teal" d="M480,368.0 C450,368.0 482,414 452,414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r2-02-what-intubation-removes-print-t-teal" x="16.0" y="479.0" font-size="13" font-weight="600" text-anchor="start">WHAT EACH PATIENT DEPENDS ON</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="16.0" y="489.0" width="328.0" height="62.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="28.0" y="509.0" font-size="13.5" font-weight="600" text-anchor="start">Patient H · pneumonia</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="28.0" y="527.0" font-size="13" text-anchor="start">reduced oxygen store (about 1.2 L);</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="28.0" y="543.0" font-size="13" text-anchor="start">needs her own breathing to refill it</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="356.0" y="489.0" width="328.0" height="62.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="368.0" y="509.0" font-size="13.5" font-weight="600" text-anchor="start">Patient P · vomiting blood</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="368.0" y="527.0" font-size="13" text-anchor="start">needs sympathetic tone and</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="368.0" y="543.0" font-size="13" text-anchor="start">negative pressure for venous return</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="16.0" y="559.0" width="328.0" height="62.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="28.0" y="579.0" font-size="13.5" font-weight="600" text-anchor="start">Patient M · ketoacidosis</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="28.0" y="597.0" font-size="13" text-anchor="start">needs her very high ventilation;</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="28.0" y="613.0" font-size="13" text-anchor="start">it is holding her pH up</text><rect class="fig-r2-02-what-intubation-removes-print-pn" x="356.0" y="559.0" width="328.0" height="62.0" rx="6"/><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="368.0" y="579.0" font-size="13.5" font-weight="600" text-anchor="start">Patient R · pulmonary embolus</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="368.0" y="597.0" font-size="13" text-anchor="start">needs low pulmonary vascular resistance</text><text class="fig-r2-02-what-intubation-removes-print-t-ink" x="368.0" y="613.0" font-size="13" text-anchor="start">and pressure to perfuse his RV</text></svg>