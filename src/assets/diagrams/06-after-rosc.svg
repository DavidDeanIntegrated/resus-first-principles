<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000" role="img" aria-labelledby="title desc"><title id="title">After ROSC, protect a vulnerable brain</title><desc id="desc">Three domains converge on limiting secondary brain injury: oxygen content, cerebral flow, and metabolic demand. Selected targets are SpO2 90–98% once reliable, PaCO2 generally 35–45 mm Hg in comatose adults, and MAP at least 65 mm Hg. Use 100% inspired oxygen until reliable measurement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526671"/></marker></defs>
<rect x="0" y="0" width="1080" height="1000" rx="0" fill="#F7F5EF"/>
<text x="44" y="43" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#087F82" font-weight="600" text-anchor="start">RESUS FIRST PRINCIPLES  /  FIGURE 06</text>
<text x="44" y="91" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#172D38" font-weight="600" text-anchor="start">After ROSC, protect a vulnerable brain</text>
<text x="44" y="127" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#526671" font-weight="400" text-anchor="start">Section 9.1 • Restored circulation does not end the injury</text>
<rect x="44" y="165" width="992" height="77" rx="12" fill="#172D38"/>
<text x="540" y="213" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">Manage oxygen delivery, perfusion, and metabolic demand together.</text>
<rect x="44" y="279" width="310" height="216" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="44" y="279" width="5" height="216" rx="2" fill="#087F82"/>
<text x="66" y="317" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Oxygen content</text>
<text x="66" y="354" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Hypoxemia reduces</text>
<text x="66" y="384" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">oxygen availability.</text>
<text x="66" y="414" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start"></text>
<text x="66" y="444" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Excess oxygen can add</text>
<text x="66" y="474" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">oxidative stress.</text>
<rect x="385" y="279" width="310" height="216" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="385" y="279" width="5" height="216" rx="2" fill="#087F82"/>
<text x="407" y="317" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Cerebral blood flow</text>
<text x="407" y="354" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Hypotension threatens</text>
<text x="407" y="384" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">perfusion.</text>
<text x="407" y="414" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start"></text>
<text x="407" y="444" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Hypocapnia constricts</text>
<text x="407" y="474" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">cerebral vessels.</text>
<rect x="726" y="279" width="310" height="216" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="726" y="279" width="5" height="216" rx="2" fill="#087F82"/>
<text x="748" y="317" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Metabolic demand</text>
<text x="748" y="354" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Fever and seizures</text>
<text x="748" y="384" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">can increase demand.</text>
<text x="748" y="414" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start"></text>
<text x="748" y="444" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Injured tissue has</text>
<text x="748" y="474" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">limited reserve.</text>
<path d="M199 500 L540 557" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M540 500 L540 557" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M881 500 L540 557" fill="none" stroke="#526671" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="260" y="565" width="560" height="75" rx="12" fill="#E1EFEB"/>
<text x="540" y="612" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#087F82" font-weight="600" text-anchor="middle">Limit secondary brain injury</text>
<text x="44" y="690" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#087F82" font-weight="600" text-anchor="start">AHA 2025 • SELECTED INITIAL TARGETS</text>
<rect x="44" y="716" width="310" height="140" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="44" y="716" width="5" height="140" rx="2" fill="#087F82"/>
<text x="66" y="754" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Oxygen</text>
<text x="66" y="791" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">SpO₂ 90–98% once</text>
<text x="66" y="821" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">measurement is reliable.</text>
<rect x="385" y="716" width="310" height="140" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="385" y="716" width="5" height="140" rx="2" fill="#087F82"/>
<text x="407" y="754" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Ventilation</text>
<text x="407" y="791" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">PaCO₂ generally 35–45</text>
<text x="407" y="821" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">mm Hg if comatose.</text>
<rect x="726" y="716" width="310" height="140" rx="12" fill="#FFFFFF" stroke="#D5DEDC"/>
<rect x="726" y="716" width="5" height="140" rx="2" fill="#087F82"/>
<text x="748" y="754" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087F82" font-weight="600" text-anchor="start">Blood pressure</text>
<text x="748" y="791" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">Avoid hypotension:</text>
<text x="748" y="821" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526671" font-weight="400" text-anchor="start">MAP at least 65 mm Hg.</text>
<text x="44" y="898" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#172D38" font-weight="400" text-anchor="start">Use 100% inspired oxygen until oxygenation can be measured reliably.</text>
<text x="44" y="926" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#172D38" font-weight="400" text-anchor="start">Targets guide initial care; they do not prove adequate tissue perfusion.</text>
<path d="M44 935 H1036" stroke="#D5DEDC" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="968" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#526671" font-weight="400" text-anchor="start">Physiology overview • Temperature control, EEG/seizure care, cause treatment, and prognosis need separate guidance.</text>
</svg>