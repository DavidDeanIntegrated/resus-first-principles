<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 954" role="img" aria-labelledby="fig-r4-02-pressure-volume-screen-title" aria-describedby="fig-r4-02-pressure-volume-screen-desc"><title id="fig-r4-02-pressure-volume-screen-title">A preserved ejection fraction does not mean a normal filling pressure</title><desc id="fig-r4-02-pressure-volume-screen-desc">A graph with ventricular volume on the horizontal axis and diastolic pressure on the vertical axis, without numbers. Two curves rise from left to right. The lower, flatter curve is labeled compliant ventricle. The upper, steeper curve is labeled stiff ventricle. On each curve, a short horizontal arrow shows the same small increase in volume, and a vertical arrow shows the resulting rise in pressure, which is small on the compliant curve and large on the stiff curve.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-02-pressure-volume-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r4-02-pressure-volume-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r4-02-pressure-volume-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r4-02-pressure-volume-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r4-02-pressure-volume-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r4-02-pressure-volume-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r4-02-pressure-volume-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r4-02-pressure-volume-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r4-02-pressure-volume-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r4-02-pressure-volume-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r4-02-pressure-volume-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r4-02-pressure-volume-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r4-02-pressure-volume-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r4-02-pressure-volume-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r4-02-pressure-volume-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r4-02-pressure-volume-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r4-02-pressure-volume-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r4-02-pressure-volume-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r4-02-pressure-volume-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r4-02-pressure-volume-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r4-02-pressure-volume-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r4-02-pressure-volume-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-02-pressure-volume-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-02-pressure-volume-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-02-pressure-volume-screen-t-red{fill:var(--fig-red,#e0907f)}.fig-r4-02-pressure-volume-screen-t-gold{fill:var(--fig-gold,#d9a955)}.fig-r4-02-pressure-volume-screen-bg{fill:var(--fig-canvas,#25211c)}.fig-r4-02-pressure-volume-screen-pn{fill:var(--fig-panel,#2d2822);stroke:var(--fig-rule,#4a4238)}.fig-r4-02-pressure-volume-screen-s-teal{stroke:var(--fig-teal,#6fb8b0);fill:none}.fig-r4-02-pressure-volume-screen-f-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-02-pressure-volume-screen-s-red{stroke:var(--fig-red,#e0907f);fill:none}.fig-r4-02-pressure-volume-screen-f-red{fill:var(--fig-red,#e0907f)}.fig-r4-02-pressure-volume-screen-s-gold{stroke:var(--fig-gold,#d9a955);fill:none}.fig-r4-02-pressure-volume-screen-f-gold{fill:var(--fig-gold,#d9a955)}.fig-r4-02-pressure-volume-screen-s-muted{stroke:var(--fig-muted,#b3a897);fill:none}.fig-r4-02-pressure-volume-screen-f-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-02-pressure-volume-screen-s-rule{stroke:var(--fig-rule,#4a4238);fill:none}.fig-r4-02-pressure-volume-screen-f-rule{fill:var(--fig-rule,#4a4238)}.fig-r4-02-pressure-volume-screen-s-ink{stroke:var(--fig-ink,#e8dfd0);fill:none}.fig-r4-02-pressure-volume-screen-f-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-02-pressure-volume-screen-f-tt{fill:var(--fig-teal-tint,#30443f)}.fig-r4-02-pressure-volume-screen-f-rt{fill:var(--fig-red-tint,#43302a)}}</style><defs><marker id="fig-r4-02-pressure-volume-screen-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-02-pressure-volume-screen-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-02-pressure-volume-screen-bg" width="360" height="954"/><text class="fig-r4-02-pressure-volume-screen-t-teal" x="12.0" y="24.0" font-size="12.5" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="50.0" font-size="19" font-weight="600" text-anchor="start">A preserved ejection fraction</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="74.0" font-size="19" font-weight="600" text-anchor="start">does not mean a normal</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="98.0" font-size="19" font-weight="600" text-anchor="start">filling pressure</text><text class="fig-r4-02-pressure-volume-screen-t-muted" x="12.0" y="118.0" font-size="12.5" text-anchor="start">Schematic; no numeric axes.</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="157.0" font-size="13" font-weight="600" text-anchor="start">Diastolic pressure-volume curves</text><text class="fig-r4-02-pressure-volume-screen-t-muted" x="14.0" y="181.0" font-size="12.5" text-anchor="start">Diastolic pressure</text><path class="fig-r4-02-pressure-volume-screen-s-ink" d="M36,193 V443 H342" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r4-02-pressure-volume-screen-t-muted" x="342.0" y="463.0" font-size="12.5" text-anchor="end">Ventricular volume</text><path class="fig-r4-02-pressure-volume-screen-s-ink" d="M44.0,437.0 L51.2,436.0 L58.5,435.0 L65.8,433.9 L73.0,432.8 L80.2,431.7 L87.5,430.5 L94.8,429.3 L102.0,428.0 L109.2,426.7 L116.5,425.3 L123.8,423.9 L131.0,422.5 L138.2,421.0 L145.5,419.4 L152.8,417.8 L160.0,416.1 L167.2,414.4 L174.5,412.6 L181.8,410.7 L189.0,408.8 L196.2,406.8 L203.5,404.7 L210.8,402.6 L218.0,400.4 L225.2,398.1 L232.5,395.7 L239.8,393.2 L247.0,390.7 L254.2,388.1 L261.5,385.3 L268.8,382.5 L276.0,379.6 L283.2,376.5 L290.5,373.4 L297.8,370.1 L305.0,366.7 L312.2,363.2 L319.5,359.6 L326.8,355.9 L334.0,352.0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path class="fig-r4-02-pressure-volume-screen-s-muted" d="M223.8,398.5 H256.6" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-screen-ah)"/><path class="fig-r4-02-pressure-volume-screen-s-ink" d="M258.6,398.5 V390.4" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-screen-ah)"/><path class="fig-r4-02-pressure-volume-screen-s-ink" d="M44.0,437.0 L51.2,435.9 L58.5,434.7 L65.8,433.4 L73.0,432.1 L80.2,430.6 L87.5,429.1 L94.8,427.5 L102.0,425.8 L109.2,424.0 L116.5,422.1 L123.8,420.0 L131.0,417.8 L138.2,415.4 L145.5,412.9 L152.8,410.2 L160.0,407.3 L167.2,404.2 L174.5,400.8 L181.8,397.2 L189.0,393.4 L196.2,389.2 L203.5,384.8 L210.8,380.0 L218.0,374.8 L225.2,369.3 L232.5,363.3 L239.8,356.8 L247.0,349.8 L254.2,342.3 L261.5,334.2 L268.8,325.4 L276.0,316.0 L283.2,305.7 L290.5,294.7 L297.8,282.8 L305.0,269.9 L312.2,255.9 L319.5,240.9 L326.8,224.6 L334.0,207.0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path class="fig-r4-02-pressure-volume-screen-s-muted" d="M223.8,370.4 H256.6" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-screen-ah)"/><path class="fig-r4-02-pressure-volume-screen-s-ink" d="M258.6,370.4 V341.5" stroke-width="3" stroke-linecap="round" marker-end="url(#fig-r4-02-pressure-volume-screen-ah)"/><text class="fig-r4-02-pressure-volume-screen-t-ink" x="48.0" y="211.0" font-size="12.5" font-weight="600" text-anchor="start">Stiff ventricle</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="48.0" y="227.2" font-size="12.5" font-weight="600" text-anchor="start">(thickened by years of</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="48.0" y="243.5" font-size="12.5" font-weight="600" text-anchor="start">hypertension, as in</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="48.0" y="259.8" font-size="12.5" font-weight="600" text-anchor="start">Patient S)</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="334.0" y="425.0" font-size="12.5" font-weight="600" text-anchor="end">Compliant ventricle</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="489.0" font-size="12.5" font-weight="600" text-anchor="start">Same small volume rise: small pressure rise</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="505.2" font-size="12.5" font-weight="600" text-anchor="start">on the compliant curve, large on the stiff</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="521.5" font-size="12.5" font-weight="600" text-anchor="start">curve</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="541.8" font-size="12.5" text-anchor="start">Near the top, a modest extra volume can be</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="558.0" font-size="12.5" text-anchor="start">the difference between a normal left atrial</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="574.2" font-size="12.5" text-anchor="start">pressure and a flooded lung</text><rect class="fig-r4-02-pressure-volume-screen-pn" x="12.0" y="600.5" width="336.0" height="196.0" rx="6"/><ellipse class="fig-r4-02-pressure-volume-screen-s-ink" cx="52.0" cy="658.5" rx="23.25" ry="31.25" stroke-width="2.5"/><rect class="fig-r4-02-pressure-volume-screen-f-ink" x="94.0" y="662.5" width="16.0" height="30.0" rx="2"/><line class="fig-r4-02-pressure-volume-screen-s-muted" x1="88.0" y1="692.5" x2="116.0" y2="692.5" stroke-width="1.5"/><text class="fig-r4-02-pressure-volume-screen-t-ink" x="22.0" y="718.5" font-size="12.5" font-weight="600" text-anchor="start">Empties well</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="22.0" y="734.8" font-size="12.5" font-weight="600" text-anchor="start">(preserved EF)</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="22.0" y="750.5" font-size="12.5" text-anchor="start">normal filling</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="22.0" y="766.8" font-size="12.5" text-anchor="start">pressure</text><ellipse class="fig-r4-02-pressure-volume-screen-s-ink" cx="220.0" cy="658.5" rx="26.0" ry="34.0" stroke-width="8"/><rect class="fig-r4-02-pressure-volume-screen-f-ink" x="262.0" y="622.5" width="16.0" height="70.0" rx="2"/><line class="fig-r4-02-pressure-volume-screen-s-muted" x1="256.0" y1="692.5" x2="284.0" y2="692.5" stroke-width="1.5"/><text class="fig-r4-02-pressure-volume-screen-t-ink" x="190.0" y="718.5" font-size="12.5" font-weight="600" text-anchor="start">Empties well</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="190.0" y="734.8" font-size="12.5" font-weight="600" text-anchor="start">(preserved EF)</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="190.0" y="750.5" font-size="12.5" text-anchor="start">high filling</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="190.0" y="766.8" font-size="12.5" text-anchor="start">pressure</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="812.5" font-size="12.5" text-anchor="start">Ejection fraction measures how completely</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="828.8" font-size="12.5" text-anchor="start">the ventricle empties, not how easily it</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="845.0" font-size="12.5" text-anchor="start">fills.</text><text class="fig-r4-02-pressure-volume-screen-t-ink" x="12.0" y="863.2" font-size="12.5" font-weight="600" text-anchor="start">Patient S empties well and fills badly.</text><text class="fig-r4-02-pressure-volume-screen-t-muted" x="12.0" y="883.5" font-size="12.5" text-anchor="start">Tachycardia and fast atrial fibrillation</text><text class="fig-r4-02-pressure-volume-screen-t-muted" x="12.0" y="899.8" font-size="12.5" text-anchor="start">shorten diastole; ischemia makes the muscle</text><text class="fig-r4-02-pressure-volume-screen-t-muted" x="12.0" y="916.0" font-size="12.5" text-anchor="start">stiffer; fast atrial fibrillation also</text><text class="fig-r4-02-pressure-volume-screen-t-muted" x="12.0" y="932.2" font-size="12.5" text-anchor="start">removes the atrial contribution to filling.</text></svg>