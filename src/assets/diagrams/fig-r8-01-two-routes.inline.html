<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 660" role="img" aria-labelledby="fig-r8-01-two-routes-screen-title" aria-describedby="fig-r8-01-two-routes-screen-desc"><title id="fig-r8-01-two-routes-screen-title">Where acid comes from, where it is held, and how it leaves</title><desc id="fig-r8-01-two-routes-screen-desc">A three-step flow. Sources: volatile acid, CO2 from metabolism, a large daily load; and nonvolatile acid from diet and metabolism, a small daily load. Buffer pool: bicarbonate, proteins including hemoglobin, and phosphate hold H+ but do not remove it; the reaction CO2 plus H2O, carbonic acid, H+ plus bicarbonate, is an open system because the lungs remove the CO2 end. Exits: the lungs remove CO2 in minutes, drawn as a solid arrow; the kidneys, drawn as a dashed arrow, work over hours to days, excreting acid as ammonium and titratable acid and generating new bicarbonate. A note: a fall in pH from 7.4 to 7.1 roughly doubles [H+], from 40 to about 80 nmol/L.</desc><style>text{font-family:Literata,'DejaVu Serif',Georgia,serif}text[font-weight='700']{font-family:Fraunces,Literata,Georgia,serif}.t-ink{fill:var(--fig-ink,#172d38)}.s-ink{stroke:var(--fig-ink,#172d38);fill:none}.f-ink{fill:var(--fig-ink,#172d38)}.t-muted{fill:var(--fig-muted,#526671)}.s-muted{stroke:var(--fig-muted,#526671);fill:none}.f-muted{fill:var(--fig-muted,#526671)}.t-teal{fill:var(--fig-teal,#077578)}.s-teal{stroke:var(--fig-teal,#077578);fill:none}.f-teal{fill:var(--fig-teal,#077578)}.t-red{fill:var(--fig-red,#af4639)}.s-red{stroke:var(--fig-red,#af4639);fill:none}.f-red{fill:var(--fig-red,#af4639)}.t-gold{fill:var(--fig-gold,#996613)}.s-gold{stroke:var(--fig-gold,#996613);fill:none}.f-gold{fill:var(--fig-gold,#996613)}.t-rule{fill:var(--fig-rule,#d5dedc)}.s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.f-rule{fill:var(--fig-rule,#d5dedc)}.bg{fill:var(--fig-canvas,#f7f5ef)}.pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.hatch{fill:  font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">new bicarbonate</text></g><g transform="translate(10,576)"><rect x="0" y="0" width="340" height="70" rx="6" class="pn" /><text x="12" y="22" font-size="14" text-anchor="start" font-weight="700" class="t-ink">Why it matters</text><text x="12" y="42" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">7.4 to 7.1 roughly doubles [H+],</text><text x="12" y="58" font-size="12.4" text-anchor="start" font-weight="400" class="t-ink">from 40 to about 80 nmol/L.</text></g></svg>
