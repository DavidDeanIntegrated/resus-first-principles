<svg xmlns="http://www.w3.org/2000/svg" class="diagram-screen" viewBox="0 0 360 1249.5" width="100%" role="img" aria-labelledby="rf1s-title rf1s-desc"><title id="rf1s-title">Five mechanisms of hypoxemia, and how each responds to oxygen</title><desc id="rf1s-desc">Five schematic lung units, each with its A–a gradient on room air, response to supplemental oxygen, and typical PaCO2. Hypoventilation, drawn as a dashed alveolus with a normal lung: A–a normal, unless lung disease coexists; oxygen corrects easily but does not correct the hypoventilation; PaCO2 high. Low V/Q mismatch: a thin gas arrow reaches the alveolus, but the blood leaving it is drawn tinted, incompletely oxygenated; A–a widened; usually responds to modest oxygen; PaCO2 normal or low, can rise in advanced disease. Shunt: the alveolus is filled and crossed out, no gas arrow reaches it, and the blood passes through unchanged, drawn the same color entering and leaving; A–a widened, often greatly; response to oxygen limited, and smaller as shunt grows, but it does not measure shunt fraction; PaCO2 normal or low, rises if the pump fails. Under the shunt row: 30% shunt, illustrative: PaO2 about 58 on room air, under 150 on 100% O2, not over 400. Diffusion limitation, a thickened alveolar wall: A–a widened; usually corrects; PaCO2 normal or low. Low inspired oxygen, environmental, not a lung mechanism, drawn as a normal alveolus with low-oxygen gas: A–a normal; corrects; PaCO2 often low. The three illustrative patients on room air: A, pneumonia, PaO2 55 and PaCO2 32 mm Hg, A–a about 55, the lung fails to transfer. B, opioid hypoventilation, PaCO2 70, PAO2 about 62, PaO2 56, A–a about 6, normal, pH about 7.21, SpO2 about 80 percent. C, COPD, PaCO2 62, pH 7.31, PaO2 56, hypoventilation dominant; A–a about 16, inside the rough age-expected range of about 21. Schematic units, not anatomy.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf1s-t-ink{fill:var(--fig-ink,#172d38)}.rf1s-t-muted{fill:va <svg xmlns="http://www.w3.org/2000/svg" class="diagram-print" viewBox="0 0 700 784" width="100%" role="img" aria-labelledby="rf1p-title rf1p-desc"><title id="rf1p-title">Five mechanisms of hypoxemia, and how each responds to oxygen</title><desc id="rf1p-desc">Five schematic lung units, each with its A–a gradient on room air, response to supplemental oxygen, and typical PaCO2. Hypoventilation, drawn as a dashed alveolus with a normal lung: A–a normal, unless lung disease coexists; oxygen corrects easily but does not correct the hypoventilation; PaCO2 high. Low V/Q mismatch: a thin gas arrow reaches the alveolus, but the blood leaving it is drawn tinted, incompletely oxygenated; A–a widened; usually responds to modest oxygen; PaCO2 normal or low, can rise in advanced disease. Shunt: the alveolus is filled and crossed out, no gas arrow reaches it, and the blood passes through unchanged, drawn the same color entering and leaving; A–a widened, often greatly; response to oxygen limited, and smaller as shunt grows, but it does not measure shunt fraction; PaCO2 normal or low, rises if the pump fails. Under the shunt row: 30% shunt, illustrative: PaO2 about 58 on room air, under 150 on 100% O2, not over 400. Diffusion limitation, a thickened alveolar wall: A–a widened; usually corrects; PaCO2 normal or low. Low inspired oxygen, environmental, not a lung mechanism, drawn as a normal alveolus with low-oxygen gas: A–a normal; corrects; PaCO2 often low. The three illustrative patients on room air: A, pneumonia, PaO2 55 and PaCO2 32 mm Hg, A–a about 55, the lung fails to transfer. B, opioid hypoventilation, PaCO2 70, PAO2 about 62, PaO2 56, A–a about 6, normal, pH about 7.21, SpO2 about 80 percent. C, COPD, PaCO2 62, pH 7.31, PaO2 56, hypoventilation dominant; A–a about 16, inside the rough age-expected range of about 21. Schematic units, not anatomy.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.rf1p-t-ink{fill:#172d38}.rf1p-t-muted{fill:#526671}.rf1p-t-teal{ -size="13.5" text-anchor="start">A–a gradient: Normal, unless lung</text><text class="rf1p-t-ink" x="32.0" y="167" font-size="13.5" text-anchor="start">disease coexists</text><text class="rf1p-t-ink" x="32.0" y="185" font-size="13.5" text-anchor="start">Oxygen: Corrects easily; does not</text><text class="rf1p-t-ink" x="32.0" y="203" font-size="13.5" text-anchor="start">correct the hypoventilation</text><text class="rf1p-t-ink" x="32.0" y="221" font-size="13.5" text-anchor="start">PaCO2: High</text><rect class="rf1p-pn" x="356.0" y="88" width="328.0" height="162" rx="6"/><rect class="rf1p-f-gold" x="356.0" y="88" width="5" height="162" rx="2"/><path class="rf1p-s-gold" d="M650.0,93.0 V106.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><circle class="rf1p-s-gold" cx="650.0" cy="122" r="13.0" stroke-width="2.5"/><path class="rf1p-s-muted" d="M626.0,141.0 H650.0" stroke-width="5"/><rect class="rf1p-f-rt" x="650.0" y="137.5" width="24.0" height="7"/><path class="rf1p-s-red" d="M650.0,137.5 H674.0" stroke-width="3.5"/><path class="rf1p-s-muted" d="M672.0,141.0 H680.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><text class="rf1p-t-gold" x="372.0" y="110" font-size="16" font-weight="600" text-anchor="start">Low V/Q mismatch</text><text class="rf1p-t-muted" x="372.0" y="128" font-size="13" text-anchor="start">some fresh gas, not enough for the</text><text class="rf1p-t-muted" x="372.0" y="145" font-size="13" text-anchor="start">blood</text><text class="rf1p-t-ink" x="372.0" y="166" font-size="13.5" text-anchor="start">A–a gradient: Widened</text><text class="rf1p-t-ink" x="372.0" y="184" font-size="13.5" text-anchor="start">Oxygen: Usually responds to modest</text><text class="rf1p-t-ink" x="372.0" y="202" font-size="13.5" text-anchor="start">oxygen</text><text class="rf1p-t-ink" x="372.0" y="220" font-size="13.5" text-anchor="start">PaCO2: Normal or low; can rise in</text><text class="rf1p-t-ink" x="372.0" y="238" font-size="13.5" text-anchor="start">advanced disease</text><rect class="rf1p-pn" x="16.0" y="258" width="328.0" height="245" rx="6"/><rect class="rf1p-f-red" x="16.0" y="258" width="5" height="245" rx="2"/><circle class="rf1p-s-red" cx="310.0" cy="292" r="13.0" stroke-width="2.5"/><circle class="rf1p-f-rt" cx="310.0" cy="292" r="11.5"/><path class="rf1p-s-red" d="M300.9,282.9 L319.1,301.1 M319.1,282.9 L300.9,301.1" stroke-width="2.5" stroke-linecap="round"/><path class="rf1p-s-muted" d="M286.0,311.0 H334.0" stroke-width="5"/><path class="rf1p-s-muted" d="M332.0,311.0 H340.0" stroke-width="1.5" marker-end="url(#rf1p-ah)"/><text class="rf1p-t-red" x="32.0" y="280" font-size="16" font-weight="600" text-anchor="start">Shunt</text><text class="rf1p-t-muted" x="32.0" y="298" font-size="13" text-anchor="start">no inspired gas arrives; blood passes</text><text class="rf1p-t-muted" x="32.0" y="315" font-size="13" text-anchor="start">unchanged</text><text class="rf1p-t-ink" x="32.0" y="336" font-size="13.5" text-anchor="start">A–a gradient: Widened, often greatly</text><text class="rf1p-t-ink" x="32.0" y="354" font-size="13.5" text-anchor="start">Oxygen: Limited, and smaller as</text><text class="rf1p-t-ink" x="32.0" y="372" font-size="13.5" text-anchor="start">shunt grows; does not measure</text><text class="rf1p-t-ink" x="32.0" y="390" font-size="13.5" text-anchor="start">shunt fraction</text><text class="rf1p-t-ink" x="32.0" y="408" font-size="13.5" text-anchor="start">PaCO2: Normal or low; rises if the</text><text class="rf1p-t-ink" x="32.0" y="426" font-size="13.5" text-anchor="start">pump fails</text><g id="shunt-line-print" data-slot="shunt-line"><path class="rf1p-s-red" d="M32.0,438 H328.0" stroke-width="1" stroke-dasharray="3 3"/><text class="rf1p-t-red" x="32.0" y="456" font-size="13" font-weight="600" text-anchor="start">30% shunt (illustrative): PaO2 about 58</text><text class="rf1p-t-red" x="32.0" y="473" font-size="13" font-weight="600" text-anchor="start">on room air, under 150 on 100% O2, not</text><text class
