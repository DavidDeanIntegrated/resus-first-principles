e, lung ultrasound and imaging see interstitial fluid, and neither measures capillary pressure directly.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-02a-pressure-chain-screen-t-ink{fill:var(--fig-ink,#172d38)}.fig-r4-02a-pressure-chain-screen-t-muted{fill:var(--fig-muted,#526671)}.fig-r4-02a-pressure-chain-screen-t-teal{fill:var(--fig-teal,#077578)}.fig-r4-02a-pressure-chain-screen-t-red{fill:var(--fig-red,#af4639)}.fig-r4-02a-pressure-chain-screen-t-gold{fill:var(--fig-gold,#996613)}.fig-r4-02a-pressure-chain-screen-bg{fill:var(--fig-canvas,#f7f5ef)}.fig-r4-02a-pressure-chain-screen-pn{fill:var(--fig-panel,#ffffff);stroke:var(--fig-rule,#d5dedc)}.fig-r4-02a-pressure-chain-screen-s-teal{stroke:var(--fig-teal,#077578);fill:none}.fig-r4-02a-pressure-chain-screen-f-teal{fill:var(--fig-teal,#077578)}.fig-r4-02a-pressure-chain-screen-s-red{stroke:var(--fig-red,#af4639);fill:none}.fig-r4-02a-pressure-chain-screen-f-red{fill:var(--fig-red,#af4639)}.fig-r4-02a-pressure-chain-screen-s-gold{stroke:var(--fig-gold,#996613);fill:none}.fig-r4-02a-pressure-chain-screen-f-gold{fill:var(--fig-gold,#996613)}.fig-r4-02a-pressure-chain-screen-s-muted{stroke:var(--fig-muted,#526671);fill:none}.fig-r4-02a-pressure-chain-screen-f-muted{fill:var(--fig-muted,#526671)}.fig-r4-02a-pressure-chain-screen-s-rule{stroke:var(--fig-rule,#d5dedc);fill:none}.fig-r4-02a-pressure-chain-screen-f-rule{fill:var(--fig-rule,#d5dedc)}.fig-r4-02a-pressure-chain-screen-s-ink{stroke:var(--fig-ink,#172d38);fill:none}.fig-r4-02a-pressure-chain-screen-f-ink{fill:var(--fig-ink,#172d38)}.fig-r4-02a-pressure-chain-screen-f-tt{fill:var(--fig-teal-tint,#ddedea)}.fig-r4-02a-pressure-chain-screen-f-rt{fill:var(--fig-red-tint,#f5e4df)}@media (prefers-color-scheme:dark){.fig-r4-02a-pressure-chain-screen-t-ink{fill:var(--fig-ink,#e8dfd0)}.fig-r4-02a-pressure-chain-screen-t-muted{fill:var(--fig-muted,#b3a897)}.fig-r4-02a-pressure-chain-screen-t-teal{fill:var(--fig-teal,#6fb8b0)}.fig-r4-02a-pressu g ultrasound and imaging see interstitial fluid, and neither measures capillary pressure directly.</desc><style>text{font-family:'DejaVu Sans',system-ui,sans-serif}.fig-r4-02a-pressure-chain-print-t-ink{fill:#172d38}.fig-r4-02a-pressure-chain-print-t-muted{fill:#526671}.fig-r4-02a-pressure-chain-print-t-teal{fill:#077578}.fig-r4-02a-pressure-chain-print-t-red{fill:#af4639}.fig-r4-02a-pressure-chain-print-t-gold{fill:#996613}.fig-r4-02a-pressure-chain-print-bg{fill:#ffffff}.fig-r4-02a-pressure-chain-print-pn{fill:#ffffff;stroke:#d5dedc}.fig-r4-02a-pressure-chain-print-s-teal{stroke:#077578;fill:none}.fig-r4-02a-pressure-chain-print-f-teal{fill:#077578}.fig-r4-02a-pressure-chain-print-s-red{stroke:#af4639;fill:none}.fig-r4-02a-pressure-chain-print-f-red{fill:#af4639}.fig-r4-02a-pressure-chain-print-s-gold{stroke:#996613;fill:none}.fig-r4-02a-pressure-chain-print-f-gold{fill:#996613}.fig-r4-02a-pressure-chain-print-s-muted{stroke:#526671;fill:none}.fig-r4-02a-pressure-chain-print-f-muted{fill:#526671}.fig-r4-02a-pressure-chain-print-s-rule{stroke:#d5dedc;fill:none}.fig-r4-02a-pressure-chain-print-f-rule{fill:#d5dedc}.fig-r4-02a-pressure-chain-print-s-ink{stroke:#172d38;fill:none}.fig-r4-02a-pressure-chain-print-f-ink{fill:#172d38}.fig-r4-02a-pressure-chain-print-f-tt{fill:#ddedea}.fig-r4-02a-pressure-chain-print-f-rt{fill:#f5e4df}</style><defs><marker id="fig-r4-02a-pressure-chain-print-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="fig-r4-02a-pressure-chain-print-f-muted" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="fig-r4-02a-pressure-chain-print-bg" width="700" height="766"/><text class="fig-r4-02a-pressure-chain-print-t-teal" x="16.0" y="24.0" font-size="13" font-weight="600" text-anchor="start">PULMONARY EDEMA</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="16.0" y="50.0" font-size="20" font-weight="600" text-anchor="start">A rise in filling pressure is transmitted back from</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="16.0" y="74.0" font-size="20" font-weight="600" text-anchor="start">the left ventricle to the lung capillaries</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="16.0" y="94.0" font-size="13.5" text-anchor="start">Schematic; no values.</text><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M16,119 h26" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text class="fig-r4-02a-pressure-chain-print-t-muted" x="48.0" y="123.0" font-size="13" text-anchor="start">pressure</text><path class="fig-r4-02a-pressure-chain-print-s-ink" d="M126,119 h26" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text class="fig-r4-02a-pressure-chain-print-t-muted" x="158.0" y="123.0" font-size="13" text-anchor="start">blood flow</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="50.0" y="137.0" width="316.0" height="49.8" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="158.7" font-size="13" font-weight="600" text-anchor="start">Left ventricle</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="175.6" font-size="13" text-anchor="start">LVEDP: pressure at the end of filling</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="54.0" y="202.8" font-size="13" text-anchor="start">A filling pressure is not a filling</text><text class="fig-r4-02a-pressure-chain-print-t-muted" x="54.0" y="219.7" font-size="13" text-anchor="start">volume</text><rect class="fig-r4-02a-pressure-chain-print-pn" x="50.0" y="240.6" width="316.0" height="66.7" rx="6"/><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="262.3" font-size="13" font-weight="600" text-anchor="start">Left atrium</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="279.2" font-size="13" text-anchor="start">Left atrial pressure: changes through</text><text class="fig-r4-02a-pressure-chain-print-t-ink" x="60.0" y="296.1"
